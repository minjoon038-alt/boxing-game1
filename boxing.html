<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UPBOX</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- CrazyGames SDK v3: gameplay events, ads, mute setting, CrazyGames account. Outside CrazyGames its environment is 'disabled' and the game does not use it -->
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<style>
  html,body{margin:0;height:100%;background:#0b0b0f;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  :root{--cw:min(100vw,calc(100vh*16/9));--u:calc(var(--cw)/960)}   /* --u: 캔버스 폭 1/960 (메인 화면 글자/버튼을 화면 크기에 맞춰 키우고 줄이는 단위) */
  #wrap{position:relative;width:var(--cw);aspect-ratio:16/9;background:#0e0e13}
  canvas{width:100%;height:100%;display:block}
  #menu{position:absolute;inset:0;pointer-events:none;font-family:system-ui,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:#f2f2f2;animation:menuIn .9s ease .3s both}
  #menu.hidden{display:none}
  #menu>*{pointer-events:auto}
  @keyframes menuIn{from{opacity:0;transform:translateY(calc(var(--u)*10))}to{opacity:1;transform:none}}
  /* 메인 화면: 배경은 캔버스에 그린 title-bg.jpg. 왼쪽 열(제목/계정/버튼)은 HTML이 그리고, 그림에 박혀 있는 기본 글자/버튼/아이디는 캔버스에서 어두운 막으로 덮는다 (draw 의 titleArt) */
  #menu .chip{position:absolute;right:calc(var(--u)*14);top:calc(var(--u)*14);width:calc(var(--u)*136);height:calc(var(--u)*36);line-height:calc(var(--u)*36);box-sizing:border-box;padding:0 calc(var(--u)*14);text-align:center;font-size:max(10px,calc(var(--u)*11));font-weight:700;letter-spacing:calc(var(--u)*1);color:#e6e9f5;border:1px solid rgba(255,255,255,.22);border-radius:calc(var(--u)*14);pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #menu .col{position:absolute;left:calc(var(--u)*48);top:0;bottom:0;width:calc(var(--u)*252);pointer-events:none}
  #menu .col>*{pointer-events:auto}
  #menu .logo{position:absolute;left:0;right:0;top:calc(var(--u)*58);text-align:center;pointer-events:none;border-top:1px solid rgba(255,255,255,.22);border-bottom:1px solid rgba(255,255,255,.22);padding:calc(var(--u)*16) 0 calc(var(--u)*14)}
  #menu .logo b{display:block;font-size:calc(var(--u)*42);font-weight:200;letter-spacing:calc(var(--u)*9);padding-left:calc(var(--u)*9);white-space:nowrap;line-height:1;text-shadow:0 0 calc(var(--u)*18) rgba(120,150,255,.45)}
  #menu .logo i{display:block;margin-top:calc(var(--u)*10);font-style:normal;font-size:max(10px,calc(var(--u)*9.5));letter-spacing:calc(var(--u)*5);color:#7e86a8}
  #menu .who{position:absolute;left:0;right:0;top:calc(var(--u)*158);text-align:center;pointer-events:none;text-shadow:0 0 calc(var(--u)*8) rgba(0,0,10,.85)}
  #menu .who .id{font-size:calc(var(--u)*19);font-weight:700;letter-spacing:calc(var(--u)*2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #menu .who .best{margin-top:calc(var(--u)*6);font-size:max(10px,calc(var(--u)*11));font-weight:600;letter-spacing:calc(var(--u)*1);color:#ffd166;white-space:nowrap}
  #menu .play{position:absolute;left:0;top:calc(var(--u)*236);width:100%;height:calc(var(--u)*62);border:2px solid transparent;border-radius:calc(var(--u)*4);transform:skewX(-14deg);background:linear-gradient(#0b0f2c,#0b0f2c) padding-box,linear-gradient(90deg,#4f7dff,#ff4d6a) border-box;color:#f2f2f2;font-family:inherit;font-size:calc(var(--u)*24);font-weight:800;font-style:italic;letter-spacing:calc(var(--u)*8);cursor:pointer;box-shadow:0 0 calc(var(--u)*22) rgba(90,110,255,.35);transition:transform .15s,box-shadow .15s,filter .15s}
  #menu .play span{display:inline-block;transform:skewX(14deg)}
  #menu .play:hover,#menu .play:focus-visible{filter:brightness(1.35);transform:skewX(-14deg) scale(1.04);box-shadow:0 0 calc(var(--u)*34) rgba(140,120,255,.65);outline:none}
  #menu .play:active{transform:skewX(-14deg) scale(.98)}
  #menu .enter{position:absolute;left:0;right:0;top:calc(var(--u)*304);text-align:center;font-size:max(10px,calc(var(--u)*10));letter-spacing:calc(var(--u)*3);color:#8d93a8;pointer-events:none}
  #menu .sub{position:absolute;left:0;right:0;top:calc(var(--u)*338);display:grid;grid-template-columns:repeat(6,1fr);gap:calc(var(--u)*8)}
  #menu .sub .ghost{grid-column:span 3}
  #menu .sub #continueBtn{grid-column:1/-1}
  #menu .sub [hidden]{display:none}
  #menu .sub .ghost{padding:calc(var(--u)*9) 0;border-radius:calc(var(--u)*8);letter-spacing:calc(var(--u)*1);white-space:nowrap;text-align:center}
  #menu .tag{position:absolute;left:0;right:0;bottom:calc(var(--u)*24);text-align:center;font-size:max(10px,calc(var(--u)*9.5));letter-spacing:calc(var(--u)*3);white-space:nowrap;color:#6d7490;pointer-events:none;border-top:1px solid rgba(255,255,255,.14);padding-top:calc(var(--u)*10)}
  .ghost{background:rgba(8,10,22,.6);border:1px solid rgba(255,255,255,.2);border-radius:calc(var(--u)*16);padding:calc(var(--u)*7) calc(var(--u)*20);color:#c4c9da;font-family:inherit;font-size:calc(var(--u)*12);font-weight:600;letter-spacing:calc(var(--u)*2);cursor:pointer;transition:color .15s,border-color .15s,background .15s}
  .ghost:hover,.ghost:focus-visible{color:#fff;border-color:rgba(255,255,255,.55);background:rgba(20,24,44,.75);outline:none}
  .ghost.gold{color:#ffd166;border-color:rgba(255,209,102,.45)}
  .ghost.gold:hover,.ghost.gold:focus-visible{color:#ffe29a;border-color:#ffd166;background:rgba(60,44,10,.6)}

  /* ----- 랭킹 화면 ----- */
  #rank{position:absolute;inset:0;pointer-events:none;font-family:system-ui,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:#f2f2f2;animation:menuIn .4s ease both}
  #rank.hidden{display:none}
  #rank .panel{pointer-events:auto;position:absolute;left:50%;top:calc(var(--u)*108);transform:translateX(-50%);width:calc(var(--u)*400);height:calc(var(--u)*388);box-sizing:border-box;padding:calc(var(--u)*16) calc(var(--u)*18) calc(var(--u)*14);background:rgba(6,8,20,.86);border:1px solid rgba(255,255,255,.14);border-radius:calc(var(--u)*14);-webkit-backdrop-filter:blur(calc(var(--u)*5));backdrop-filter:blur(calc(var(--u)*5));box-shadow:0 calc(var(--u)*14) calc(var(--u)*40) rgba(0,0,0,.55);display:flex;flex-direction:column}
  #rank .head{display:flex;align-items:center;justify-content:space-between}
  #rank .ttl{font-size:calc(var(--u)*19);font-weight:700;letter-spacing:calc(var(--u)*8);padding-left:calc(var(--u)*2)}
  #rank .live{display:flex;align-items:center;gap:calc(var(--u)*6);font-size:max(10px,calc(var(--u)*10));font-weight:700;letter-spacing:calc(var(--u)*2);color:#7e849a}
  #rank .live::before{content:'';width:calc(var(--u)*7);height:calc(var(--u)*7);border-radius:50%;background:#7e849a}
  #rank .live.on{color:#7dffa6}
  #rank .live.on::before{background:#35e07a;animation:livePulse 1.6s ease-in-out infinite}
  #rank .live.bump{animation:liveBump .8s ease}
  #rank .cols{display:grid;grid-template-columns:calc(var(--u)*46) 1fr calc(var(--u)*96);margin-top:calc(var(--u)*12);padding:0 calc(var(--u)*6) calc(var(--u)*6);font-size:max(10px,calc(var(--u)*10));letter-spacing:calc(var(--u)*2);color:#7e849a;border-bottom:1px solid rgba(255,255,255,.12)}
  #rank .cols span:last-child{text-align:right}
  #rank ol{list-style:none;margin:0;padding:0;flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.25) transparent}
  #rank li{display:grid;grid-template-columns:calc(var(--u)*46) 1fr calc(var(--u)*96);align-items:center;height:calc(var(--u)*28);padding:0 calc(var(--u)*6);font-size:calc(var(--u)*14);border-bottom:1px solid rgba(255,255,255,.05);border-left:calc(var(--u)*3) solid transparent}
  #rank li .no{display:inline-flex;align-items:center;justify-content:center;width:calc(var(--u)*22);height:calc(var(--u)*22);border-radius:50%;font-size:calc(var(--u)*12);font-weight:700;color:#aab0c4}
  #rank li.r1 .no{background:#ffd166;color:#241a00}
  #rank li.r2 .no{background:#c9ccd6;color:#1a1c24}
  #rank li.r3 .no{background:#d9955f;color:#2a1405}
  #rank li .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
  #rank li.r1 .nm{color:#ffd166}
  #rank li .st{text-align:right;font-size:calc(var(--u)*12);font-weight:700;letter-spacing:calc(var(--u)*1);color:#c4c9da}
  #rank li.me{background:rgba(81,133,255,.18);border-left-color:#5185ff}
  #rank li.flash{animation:rowFlash 1.6s ease}
  #rank [hidden]{display:none !important}   /* display:flex 인 .empty 가 hidden 속성을 무시하고 목록 아래에 계속 보이던 문제 방지 */
  #rank .empty{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.7;padding:0 calc(var(--u)*20);font-size:calc(var(--u)*13);color:#9aa0b4}
  #rank .foot{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--u)*10);margin-top:calc(var(--u)*10);padding-top:calc(var(--u)*10);border-top:1px solid rgba(255,255,255,.12)}
  #rank .foot .ghost{flex:none;white-space:nowrap}   /* 안내 문구가 길어도 버튼이 두 줄로 찌그러지지 않게 */
  #rank .mine{font-size:calc(var(--u)*12);color:#c4c9da;line-height:1.5;min-width:0;flex:1}
  #rank .mine b{color:#fff;font-size:calc(var(--u)*13)}
  #rank .mine .gold{color:#ffd166;font-weight:700}
  @keyframes livePulse{0%,100%{opacity:1}50%{opacity:.35}}
  @keyframes liveBump{0%{transform:scale(1.35);color:#fff}100%{transform:none}}
  @keyframes rowFlash{0%{background:rgba(255,209,102,.55)}100%{background:transparent}}
  #rank li.me.flash{animation-name:rowFlashMe}
  @keyframes rowFlashMe{0%{background:rgba(255,209,102,.55)}100%{background:rgba(81,133,255,.18)}}

  /* ----- 캐릭터 선택 창 (홈 화면에서 연다): 세 캐릭터가 링 위에 나란히 서 있고, 카드에는 이름·설명(위)과 능력치·기술(아래)이 있다 ----- */
  #menu .who .chr{margin-top:calc(var(--u)*5);font-size:calc(var(--u)*12);font-weight:600;letter-spacing:calc(var(--u)*2);color:#c4c9da}
  #chars{position:absolute;inset:0;pointer-events:none;font-family:system-ui,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:#f2f2f2;animation:menuIn .4s ease both}
  #chars.hidden{display:none}
  #chars .ttl{position:absolute;left:calc(var(--u)*30);top:calc(var(--u)*16);font-size:calc(var(--u)*15);font-weight:700;letter-spacing:calc(var(--u)*6);text-shadow:0 0 calc(var(--u)*8) rgba(0,0,10,.9)}
  #chars .ttl small{display:block;margin-top:calc(var(--u)*4);font-size:max(10px,calc(var(--u)*10));font-weight:500;letter-spacing:calc(var(--u)*1);color:#aab0c4}
  #chars .done{pointer-events:auto;position:absolute;right:calc(var(--u)*30);top:calc(var(--u)*18)}
  #chars .card{pointer-events:auto;cursor:pointer;position:absolute;top:calc(var(--u)*84);height:calc(var(--u)*452);width:calc(var(--u)*262);box-sizing:border-box;border:1px solid rgba(255,255,255,.14);border-radius:calc(var(--u)*14);transition:border-color .15s,box-shadow .15s,background .15s}
  #chars .card[data-ch=outfighter]{left:calc(var(--u)*59)} #chars .card[data-ch=infighter]{left:calc(var(--u)*349)} #chars .card[data-ch=slugger]{left:calc(var(--u)*639)}
  #chars .card:hover{border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.04)}
  #chars .card.on{border-color:#ffd166;box-shadow:0 0 calc(var(--u)*26) rgba(255,209,102,.28);background:rgba(255,209,102,.05)}
  #chars .ct,#chars .cb{position:absolute;left:0;right:0;box-sizing:border-box;padding:calc(var(--u)*12) calc(var(--u)*14);background:rgba(6,8,20,.74);-webkit-backdrop-filter:blur(calc(var(--u)*3));backdrop-filter:blur(calc(var(--u)*3))}
  #chars .ct{top:0;border-radius:calc(var(--u)*13) calc(var(--u)*13) 0 0;text-align:center}
  #chars .cb{bottom:0;border-radius:0 0 calc(var(--u)*13) calc(var(--u)*13)}
  #chars .nm{font-size:calc(var(--u)*20);font-weight:800;letter-spacing:calc(var(--u)*3)}
  #chars .tg{margin-top:calc(var(--u)*2);font-size:max(10px,calc(var(--u)*10));font-weight:600;letter-spacing:calc(var(--u)*3);color:#7e849a}
  #chars .ds{margin-top:calc(var(--u)*8);font-size:max(10px,calc(var(--u)*11.5));line-height:1.55;color:#c4c9da}
  #chars .badge{z-index:2;position:absolute;right:calc(var(--u)*10);top:calc(var(--u)*-11);padding:calc(var(--u)*3) calc(var(--u)*10);border-radius:calc(var(--u)*10);background:#ffd166;color:#241a00;font-size:max(10px,calc(var(--u)*10));font-weight:800;letter-spacing:calc(var(--u)*2);opacity:0;transition:opacity .15s}
  #chars .card.on .badge{opacity:1}
  #chars .stat{display:grid;grid-template-columns:calc(var(--u)*56) 1fr;align-items:center;height:calc(var(--u)*16);font-size:max(10px,calc(var(--u)*10.5));color:#aab0c4}
  #chars .bar{height:calc(var(--u)*6);border-radius:calc(var(--u)*3);background:rgba(255,255,255,.1);overflow:hidden}
  #chars .bar i{display:block;height:100%;border-radius:inherit;background:#5185ff}
  #chars .stat.p .bar i{background:#ff5a5f} #chars .stat.s .bar i{background:#8de0c4} #chars .stat.r .bar i{background:#ffd166}
  #chars .mv{margin-top:calc(var(--u)*7);font-size:max(10px,calc(var(--u)*10.5));color:#9aa0b4;line-height:1.5}
  #chars .mv b{color:#e6e9f5;font-weight:700}
  /* ----- 안내 문구 (메인 화면) ----- */
  #menu .toast{position:absolute;left:0;right:0;top:calc(var(--u)*430);text-align:center;font-size:calc(var(--u)*13);font-weight:600;letter-spacing:calc(var(--u)*1);color:#ffd166;opacity:0;pointer-events:none;text-shadow:0 0 calc(var(--u)*8) rgba(0,0,10,.9);transition:opacity .4s}
  #menu .toast.on{opacity:1}
  #menu .chip{pointer-events:auto;cursor:pointer;background:rgba(8,10,22,.55);font-family:inherit;transition:border-color .15s,background .15s,color .15s}
  #menu .chip:hover,#menu .chip:focus-visible{border-color:rgba(255,255,255,.6);background:rgba(20,24,44,.8);color:#fff;outline:none}
  /* ----- 오른쪽 위: 이름 표시 / CrazyGames 로그인 버튼 (게스트일 때만 버튼) ----- */
  #menu .chip{width:auto;min-width:calc(var(--u)*136);max-width:calc(var(--u)*260)}
  #menu .chip.static{pointer-events:none;cursor:default;background:transparent}
  #menu .privacy{position:absolute;left:0;right:0;bottom:calc(var(--u)*5);text-align:center;font-size:max(10px,calc(var(--u)*7.5));line-height:1.35;color:#596080;pointer-events:none}
  .ghost kbd{display:inline-block;margin-left:calc(var(--u)*8);padding:0 calc(var(--u)*5);border:1px solid currentColor;border-radius:calc(var(--u)*4);font:inherit;font-size:max(9px,.78em);line-height:1.5;opacity:.75}
  /* ----- 결과 화면 버튼 / 일시정지 (캔버스 위 HTML) ----- */
  #over,#pause{position:absolute;inset:0;pointer-events:none;font-family:system-ui,'Segoe UI',Arial,sans-serif;color:#f2f2f2}
  #over.hidden,#pause.hidden{display:none}
  #over .btns{position:absolute;left:0;right:0;top:calc(var(--u)*312);display:flex;justify-content:center;gap:calc(var(--u)*12)}
  #over .ghost,#pause .ghost{pointer-events:auto;font-size:calc(var(--u)*13);padding:calc(var(--u)*10) calc(var(--u)*18);min-width:calc(var(--u)*170);border-radius:calc(var(--u)*10);white-space:nowrap}
  #over .note{position:absolute;left:0;right:0;top:calc(var(--u)*366);text-align:center;font-size:max(10px,calc(var(--u)*11.5));color:#9aa0b4}
  #pause{background:rgba(2,3,10,.62);pointer-events:auto}
  #pause .box{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*12)}
  #pause .ttl{font-size:calc(var(--u)*34);font-weight:200;letter-spacing:calc(var(--u)*12);padding-left:calc(var(--u)*12);margin-bottom:calc(var(--u)*8)}
  /* ----- 첫 로딩 화면: 그림/캐릭터가 모두 불러와지기 전에는 게임 화면(뼈대 캐릭터 등)이 보이지 않도록 덮어 둔다 ----- */
  #boot{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#05060d;font-family:system-ui,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:#f2f2f2;transition:opacity .5s ease}
  #boot.out{opacity:0;pointer-events:none}
  #boot h1{margin:0 0 26px;font-weight:200;font-size:44px;letter-spacing:14px;padding-left:14px}
  #boot .bar{width:220px;height:2px;background:rgba(255,255,255,.12);overflow:hidden}
  #boot .bar i{display:block;height:100%;width:6%;background:#f2f2f2;transition:width .25s ease}
  #boot .msg{margin-top:14px;font-size:11px;letter-spacing:4px;color:#5f5f6e}
</style>
</head>
<body>
<div id="boot"><h1>UPBOX</h1><div class="bar"><i></i></div><div class="msg">LOADING</div></div>
<div id="wrap">
  <canvas id="c" width="960" height="540"></canvas>
  <!-- 메인 화면: 가장 먼저 보이고, PLAY 를 누르면 바로 STAGE 1 이 시작된다 -->
  <div id="menu" class="hidden">
    <button class="chip static" id="menuChip" type="button"></button>
    <div class="col">
      <div class="logo"><b>UPBOX</b></div>
      <div class="who"><div class="id" id="menuUser"></div><div class="best" id="menuBest"></div><div class="chr" id="menuChar"></div></div>
      <button class="play" id="playBtn" type="button"><span>▶ PLAY</span></button>
      <div class="enter">or press ENTER</div>
      <div class="sub">
        <button class="ghost gold" id="continueBtn" type="button" hidden>CONTINUE</button>
        <button class="ghost" id="charBtn" type="button">CHARACTER</button>
        <button class="ghost gold" id="rankBtn" type="button">RANKING</button>
      </div>
      <div class="toast" id="toast"></div>
      <div class="tag">FIGHT. CLIMB. BE THE BEST.</div>
      <div class="privacy" id="privacy"></div>
    </div>
  </div>
  <!-- 결과 화면 버튼: 승리 → 다음 상대 / 패배 → 이어하기, (가끔) 광고 보고 체력 가득 이어하기, 메인 화면 -->
  <div id="over" class="hidden"><div class="btns" id="overBtns"></div><div class="note" id="overNote"></div></div>
  <!-- 일시정지 (P) -->
  <div id="pause" class="hidden"><div class="box"><div class="ttl">PAUSED</div><button class="ghost gold" id="resumeBtn" type="button">RESUME <kbd>P</kbd></button><button class="ghost" id="quitBtn" type="button">MAIN MENU <kbd>M</kbd></button></div></div>
  <!-- 랭킹 화면: 베스트 스테이지가 높은 순서. 열려 있는 동안 1.2초마다 서버를 확인해 바뀌면 바로 갱신한다 -->
  <div id="rank" class="hidden">
    <div class="panel">
      <div class="head"><span class="ttl">RANKING</span><span class="live" id="rankLive">CONNECTING</span></div>
      <div class="cols"><span>RANK</span><span>PLAYER</span><span>BEST ROUND</span></div>
      <ol id="rankList"></ol>
      <div class="empty" id="rankEmpty">Loading…</div>
      <div class="foot">
        <div class="mine" id="rankMine"></div>
        <button class="ghost" id="rankBack" type="button">← MENU</button>
      </div>
    </div>
  </div>
  <!-- 캐릭터 선택 창: 카드(또는 ← →)로 고르면 바로 저장되고, 메인 화면의 내 캐릭터가 바뀐다 -->
  <div id="chars" class="hidden">
    <div class="ttl">CHARACTER<small>Click a card or use ← → · ENTER to go back</small></div>

<script>

   게임 좌표는 언제나 960x540 이다. 캔버스의 실제 픽셀 수만 화면에 보이는 크기(x 기기 픽셀 비율)에 맞춰 GFX.r 배로 키워서 그린다
   → 큰 화면에서도 브라우저가 늘려서 흐려지지 않는다. 판정·속도는 게임 좌표 기준이라 전혀 바뀌지 않는다.

   그림자 흐림(shadowBlur)과 필터의 blur(px) 는 변환(transform)의 영향을 받지 않는 '실제 픽셀' 단위라서, 같은 모양이 되도록 GFX.r 배로 바꿔 준다. */
const GFX = { r: 1, max: 3, slow: 0, n: 0 };     // max 3 = 2880x1620 (1440p · 4K 화면용). 그림은 이 배율에 맞춰 2배로 업스케일해 두었다
(function(){
  const P2 = CanvasRenderingContext2D.prototype, st = P2.setTransform;
  const sb = Object.getOwnPropertyDescriptor(P2, 'shadowBlur'), fl = Object.getOwnPropertyDescriptor(P2, 'filter');
  ctx.setTransform = function(a, b, c, d, e, f){ const r = GFX.r; return st.call(this, a*r, b*r, c*r, d*r, e*r, f*r); };
  if(sb) Object.defineProperty(ctx, 'shadowBlur', { configurable: true, get(){ return sb.get.call(this)/GFX.r; }, set(v){ sb.set.call(this, v*GFX.r); } });

  const w = cv.getBoundingClientRect().width || W, dpr = window.devicePixelRatio || 1;
  const r = Math.max(1, Math.min(GFX.max, Math.ceil(w*dpr/W*4)/4));          // 0.25 단위

}

function canAct(f){

   - 게임 진행 신호: 실제로 싸우는 동안만 gameplayStart, 결과 화면 · 메뉴 · 일시정지 · 광고 중에는 gameplayStop
   - 광고: 상대를 이긴 뒤 다음 상대가 나오기 전(중간 광고 — 너무 잦은 요청은 CrazyGames 가 알아서 무시한다),
           졌을 때 '광고 보고 체력 가득 이어하기'(보상형, 매번 권하지 않고 3분에 한 번까지). 광고 없이 이어하기(체력 RUN.cont)는 언제나 가능
   - 소리: CrazyGames 설정의 음소거, 그리고 광고가 실제로 나오는 동안은 소리를 끈다
   - 계정: CrazyGames 에 로그인한 사람은 자동으로 서버 계정에 연결(랭킹). 게스트는 이 기기(Data 모듈)에만 저장하고 바로 플레이 */
const CG = { on:false, sdk:null, env:'disabled', muted:false, adMute:false, adBusy:false, adblock:false, loggedIn:false, playing:false, loading:false, assets:false, deaths:0, offeredAt:-9, lastReward:-1e9 };
CG.call = fn => { if(!CG.on) return; try{ const r = fn(CG.sdk); if(r && r.catch) r.catch(e => console.warn('CrazyGames SDK', e)); }catch(e){ console.warn('CrazyGames SDK', e); } };
CG.init = async () => {
  const sdk = window.CrazyGames && window.CrazyGames.SDK;
  if(!sdk) return;
  try{
    await Promise.race([sdk.init(), new Promise((ok, no) => setTimeout(() => no(new Error('timeout')), 8000))]);
    CG.env = sdk.environment; CG.sdk = sdk;
    CG.on = CG.env === 'crazygames' || CG.env === 'local';
  }catch(e){ console.warn('CrazyGames SDK unavailable', e); CG.on = false; }
  if(!CG.on) return;
  if(!CG.assets){ CG.loading = true; CG.call(s => s.game.loadingStart()); }
  const apply = () => { try{ CG.muted = !!(sdk.game.settings && sdk.game.settings.muteAudio); }catch(e){} applyMute(); };
  apply(); CG.call(s => s.game.addSettingsChangeListener(apply));
  CG.call(s => s.ad.hasAdblock().then(v => { CG.adblock = !!v; }));
  CG.call(s => s.user.addAuthListener(u => { if(u && !CG.loggedIn) accountStart(); }));     // 게스트가 플레이 중에 CrazyGames 에 로그인했다
};
CG.assetsReady = () => { CG.assets = true; if(CG.loading){ CG.loading = false; CG.call(s => s.game.loadingStop()); } };
function cgPlaying(on){ if(on === CG.playing) return; CG.playing = on; CG.call(s => on ? s.game.gameplayStart() : s.game.gameplayStop()); }
function soundOff(){ return CG.muted || CG.adMute; }
function applyMute(){
  if(!AC) return;
  try{ if(soundOff() && AC.state === 'running') AC.suspend(); else if(!soundOff() && AC.state === 'suspended') AC.resume(); }catch(e){}
}
// 광고 요청: done(성공 여부, 오류 코드). 소리는 광고가 실제로 시작될 때만 끄고(요청만으로는 끄지 않음), 끝나거나 실패하면 다시 켠다. 그동안 게임은 멈춰 있다
function requestAd(type, done){
  if(!CG.on){ done(false, 'off'); return; }
  CG.adBusy = true;
  let fin = false, started = false, guard = 0;
  const end = (ok, err) => { if(fin) return; fin = true; clearTimeout(guard); CG.adBusy = false; CG.adMute = false; applyMute(); done(ok, err); };
  guard = setTimeout(() => { if(!started) end(false, 'timeout'); }, 12000);          // 광고가 시작도 안 하고 응답이 없으면 그냥 계속한다
  try{
    CG.sdk.ad.requestAd(type, {
      adStarted: () => { started = true; CG.adMute = true; applyMute(); },
      adFinished: () => end(true),
      adError: e => end(false, e && e.code || 'other'),
    });
  }catch(e){ end(false, 'other'); }
}
// 키 이름은 키보드 배열에 맞춰 보여 준다 (예: 프랑스 AZERTY 에서는 A 자리 키가 Q). 판정은 키의 위치(e.code)라서 어느 배열이든 같은 자리의 키로 조작한다

const keyLabel = code => KEYLBL[code] || (code.startsWith('Key') ? code.slice(3) : code);
try{

  }).catch(() => {});
}catch(e){}
let P, E, PV = [];                               // PV: 캐릭터 선택 화면에 세워 두는 미리보기 파이터 3명
const parts = [], rings = [], texts = [], stars = [];

/* ---------- 사운드 (WebAudio 합성) ---------- */
let AC = null;
function audio(){
  try{
    if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    applyMute();                                       // 음소거 중이 아니면 (사용자 입력 순간에) 소리를 다시 켠다
  }catch(e){}
}
// 모든 소리는 컴프레서를 거쳐 나가서 타격음이 뭉쳐서 묵직하게 들린다
function out(){
  if(!AC._out){
    const c = AC.createDynamicsCompressor();
    c.threshold.value = -16; c.knee.value = 8; c.ratio.value = 6; c.attack.value = .002; c.release.value = .14;
    const g = AC.createGain(); g.gain.value = 1.15;                        // 타격이 꽉 차게 들리도록 크게 키운 뒤,
    const sat = AC.createWaveShaper(), cv = new Float32Array(2048);        // 한계를 넘는 큰 소리는 부드럽게 눌러서(소프트 클리핑) 찢어지지 않고 묵직하게 만든다
    for(let i = 0; i < cv.length; i++) cv[i] = Math.tanh(i/(cv.length - 1)*2*2 - 2);
    sat.curve = cv; sat.oversample = '2x';
    c.connect(g); g.connect(sat); sat.connect(AC.destination); AC._out = c; AC._master = sat;
  }
  return AC._out;
}
// curve: 감쇠 곡선(클수록 빨리 사라짐) / poles: 로우패스를 몇 겹 걸지(2겹이면 훨씬 먹먹함)
function noise(dur, freq, q, vol, type='lowpass', curve=1, poles=1){
  const n = Math.floor(AC.sampleRate*dur), b = AC.createBuffer(1,n,AC.sampleRate), d = b.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/n, curve);
  const s = AC.createBufferSource(); s.buffer = b;
  let node = s;
  for(let p=0;p<poles;p++){
    const f = AC.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    node.connect(f); node = f;
  }
  const g = AC.createGain(); g.gain.value = vol;
  node.connect(g); g.connect(out()); s.start();
}
function tone(f0, f1, dur, vol, type='sine'){
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(vol,t+.004); g.gain.exponentialRampToValueAtTime(.001,t+dur);   // 4ms 어택으로 '틱' 소리 제거
  o.connect(g); g.connect(out()); o.start(); o.stop(t+dur);
}
function later(ms, fn){ setTimeout(() => { if(AC){ try{ fn(); }catch(e){} } }, ms); }
// 패딩이 눌리는 짧은 '쿵': 100Hz 안팎의 소리를 아주 조금만 내려앉히고(피치가 뚝 떨어지는 북소리가 되지 않게) 빠르게 끊는다. 살짝 찌그러뜨려 작은 스피커에서도 들리게 한다
let THUMP_CURVE = null;
function thump(f, dur, vol){
  if(!THUMP_CURVE){ THUMP_CURVE = new Float32Array(2048); for(let i = 0; i < 2048; i++) THUMP_CURVE[i] = Math.tanh((i/2047*2 - 1)*2.2); }
  const t = AC.currentTime, o = AC.createOscillator(), ws = AC.createWaveShaper(), g = AC.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(f*1.18, t); o.frequency.exponentialRampToValueAtTime(f, t + .03);
  ws.curve = THUMP_CURVE; ws.oversample = '2x';
  g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(vol, t + .003); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(ws); ws.connect(g); g.connect(out()); o.start(t); o.stop(t + dur + .02);
}
// 가죽 글러브가 '짝' 하고 닿는 소리: 중고음 대역의 아주 짧은 노이즈
function slap(freq, q, vol, dur){ freq *= SLAP_PITCH; noise(dur*1.4, freq, q, vol*1.4, 'bandpass', 2, 1); noise(dur*2.2, freq*.5, .7, vol*.85, 'bandpass', 2.4, 1); }
const SLAP_PITCH = .8;                                     // 슬랩(짝) 소리의 높이 배율: 낮출수록 덜 날카롭고 둔탁해진다 (1 = 이전 소리)
// 짧은 잔향(작은 방 울림): 무거운 타격에만 살짝 섞어 '퍽' 뒤에 공간감이 남게 한다
function rev(){
  if(!AC._rev){
    const len = Math.floor(AC.sampleRate*.55), ir = AC.createBuffer(2, len, AC.sampleRate);
    for(let ch=0; ch<2; ch++){
      const d = ir.getChannelData(ch); let lp = 0;
      for(let i=0;i<len;i++){ lp += ((Math.random()*2 - 1) - lp)*.18; d[i] = lp*Math.pow(1 - i/len, 3.2); }
    }
    const c = AC.createConvolver(); c.buffer = ir;
    const g = AC.createGain(); g.gain.value = .55;
    c.connect(g); g.connect(out()); AC._rev = c;
  }
  return AC._rev;
}
function tail(vol, freq=500, dur=.07){                       // 잔향으로만 보내는 짧은 저음 덩어리
  const n = Math.floor(AC.sampleRate*dur), b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = (Math.random()*2 - 1)*Math.pow(1 - i/n, 2);
  const s = AC.createBufferSource(); s.buffer = b;
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
  const g = AC.createGain(); g.gain.value = vol;
  s.connect(f); f.connect(g); g.connect(rev()); s.start();
}
function crack(vol, freq=2200, dur=.012){ noise(dur, freq, 1.1, vol, 'bandpass', 1.6, 1); }   // 가죽이 '탁' 닿는 아주 짧은 순간음 (실감을 위해 작게)
function sweepNoise(dur, f0, f1, vol, curve=2){               // 필터가 열리며 음색이 올라가는 '후웁' (음높이가 튀지 않는다)
  const n = Math.floor(AC.sampleRate*dur), b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = (Math.random()*2 - 1)*Math.pow(1 - i/n, curve);
  const t = AC.currentTime, s = AC.createBufferSource(); s.buffer = b;
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = .7;
  f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = AC.createGain(); g.gain.value = vol;
  s.connect(f); f.connect(g); g.connect(out()); s.start();
}

/* 타격음: 종류마다 다르게 쌓는다. 공통 원칙 — 음높이가 뚝 떨어지는 '통통' 소리는 쓰지 않고,
   ① 로우패스 노이즈(몸통 충격) ② 일정한 서브 베이스(무게) ③ 글러브 패딩 중저음 ④ 짧은 '탁' 순간음 ⑤ 몇십 ms 뒤 작은 되울림 ⑥ 강타는 잔향 을 조합한다.
   combo: 연속으로 맞을수록 아주 조금씩 높고 날카로워진다(최대 +7%). */
function sfx(k, p=1, combo=0){
  if(!AC || soundOff()) return;
  try{
    const j = .94 + Math.random()*.12, cj = 1 + Math.min(5, combo)*.014;
    if(k === 'thud' || k === 'hit') k = 'hit_straight';        // 예전 이름 호환
    /* 복싱 글러브로 때리는 소리: 가죽이 '짝' 하고 닿는 소리(슬랩) + 패딩이 눌리는 '퍽'(몸통 노이즈) + 짧은 '쿵'(100Hz 안팎) 로 쌓는다.
       북 같은 낮은 울림은 쓰지 않고, 소리가 남는 길이는 공격이 셀수록 조금씩 길어진다: 잽 ≈ 0.1초 < 스트레이트 ≈ 0.2초 < 훅·어퍼컷 ≈ 0.25초 < 바디 ≈ 0.3초 < 카운터 ≈ 0.4초 < 스킬 ≈ 0.55초. */
    if(k === 'hit_jab'){                                       // 잽: 짧게 끊는 '짝' — 가죽 슬랩 중심, 쿵은 아주 짧게
      slap(2600*j*cj, 1.0, 1.6, .022);
      noise(.06, 1300*j*cj, .7, .9, 'lowpass', 3, 2);
      thump(150*j, .06, .55);
    }
    else if(k === 'hit_straight'){                             // 스트레이트: '짝' + 묵직한 '퍽' + 짧은 '쿵'
      slap(2100*j, .9, 1.9, .03);
      noise(.13, 900*j*cj, .6, 1.25, 'lowpass', 3, 2);
      noise(.07, 1400*j, .8, .8, 'bandpass', 2.4, 1);
      thump(125*j, .13, .8);
      later(24, () => noise(.08, 420, .5, .45, 'lowpass', 3, 1));
      tail(.2, 900, .05);
    }
    else if(k === 'hit_upper'){                                // 어퍼컷: 올려치는 '후웁' + 턱에 닿는 '딱' + 쿵
      sweepNoise(.11, 400, 1800, 1.0, 2.2);
      slap(1700*j, .9, 1.9, .034);
      noise(.15, 800*j*cj, .6, 1.2, 'lowpass', 3, 2);
      thump(112*j, .16, .8);
      later(20, () => slap(1100*j, 1.0, .8, .02));
      tail(.22, 850, .06);
    }
    else if(k === 'hit_hook'){                                 // 훅: 옆에서 휘두르는 '짜악' — 슬랩이 가장 크고 선명하다
      slap(1900*j, .9, 2.1, .036);
      slap(3200*j, 1.2, .8, .016);
      noise(.14, 950*j*cj, .6, 1.2, 'lowpass', 3, 2);
      thump(125*j, .13, .75);
      later(26, () => noise(.09, 450, .5, .45, 'lowpass', 3, 1));
      tail(.22, 880, .06);
    }
    else if(k === 'hit_body'){                                 // 바디: 배에 박히는 둔한 '푹' — 슬랩은 낮고 작게, 쿵이 더 길다
      slap(1400*j, .8, 1.4, .04);
      noise(.19, 800*j, .5, 1.4, 'lowpass', 2.6, 2);
      thump(110*j, .19, .85);
      later(28, () => noise(.12, 900, .5, .3, 'lowpass', 1.6, 1));
      tail(.26, 550, .06);
    }
    else if(k === 'hit_counter'){                              // 카운터: 같은 타격을 더 크고 길게 — 슬랩 두 겹 + 큰 퍽 + 끝에 아주 작은 금속성 여운
      slap(2200*j, .9, 2.3, .042);
      slap(1000*j, .9, 1.2, .045);
      noise(.2, 950*j, .6, 1.55, 'lowpass', 2.6, 2);
      thump(115*j, .24, 1.0);
      later(32, () => noise(.13, 420, .5, .7, 'lowpass', 3, 1));
      later(70, () => tone(1180, 1560, .14, .07, 'triangle'));
      tail(.38, 800, .08);
    }
    else if(k === 'guardbreak'){                               // 가드 깨짐: 단단한 것이 갈라지는 '쩍'
      slap(1700, .9, 1.8, .042);
      noise(.17, 650, .5, 1.4, 'lowpass', 3, 2);
      thump(105, .22, .9);
      later(45, () => noise(.12, 380, .5, .6, 'lowpass', 3, 1));
      tail(.33, 700, .07);
    }
    else if(k==='skill'){                                      // 카운터 스킬: 가장 크고 가장 길다
      slap(2000, .9, 2.5, .05);
      slap(900, .9, 1.4, .06);
      noise(.4, 650, .5, 1.7, 'lowpass', 2.2, 2);
      thump(98, .38, 1.1);
      later(60, () => noise(.22, 420, .5, .9, 'lowpass', 3, 1));
      later(140, () => noise(.14, 330, .5, .4, 'lowpass', 3, 1));
      tail(.5, 750, .1);
    }
    else if(k==='charge'){ tone(110,220,.25,.18,'triangle'); }
    else if(k==='ready'){ tone(660,990,.18,.18,'triangle'); }
    else if(k==='block'){ noise(.08, 360*j, .6, .8, 'lowpass', 3, 2); tone(105*j, 88, .08, .5); crack(.1, 1400, .008); }   // 팔로 막는 둔한 '툭' (맞는 소리보다 작고 짧다)
    else if(k==='whoosh'){ noise(.12, 1800, .6, .07, 'bandpass', 1.5); }
    else if(k==='slip'){ tone(520,900,.14,.14,'triangle'); }
    else if(k==='ko'){ thump(70, .5, 1.3); tone(60,32,.9,1); noise(.6,200,.6,1,'lowpass',2,2); }
    else if(k==='bell'){ tone(1250,1200,.9,.22,'triangle'); }
    else if(k==='dodge'){ noise(.1,2200,.6,.05,'bandpass',1.5); }
  }catch(e){}
}

    state:'idle', t:0, atk:null, hitDone:false, connected:false, sw:false, stun:0,

function setState(f, s){ f.state = s; f.t = 0; }

// 스테이지가 시작되면 서버에 티켓을 요청한다. 서버는 티켓이 있어야, 그리고 실제 한 판이 걸릴 만한 시간이 지난 뒤에만 클리어/승리를 인정한다 (조작된 요청으로 기록을 올리는 것을 막는다)
function stageTicket(level){
  if(!game.token || game.autoP) return;
  const go = n => api('/api/stage', { token: game.token, level }).catch(() => { if(n > 0) setTimeout(() => go(n - 1), 2000); });   // 접속이 잠깐 끊겼으면 한 번 더 시도
  go(1);
}
/* ---------- 연속 라운드 (한 판씩 새로 시작하지 않는다) ----------
   상대를 쓰러뜨리면 화면이 끊기지 않고 이어진다: 나는 서 있던 자리 그대로, 쓰러진 상대는 사라지고 다음 상대가 넓은 쪽에서 걸어 들어온다.
   내 체력은 그대로 이어지고(조금만 회복), 스태미나/가드만 새로 찬다. 카운터 게이지도 그대로 남는다. 화면에는 'ROUND n' 으로 보인다 (서버 기록은 그대로 stage).
   쓰러지면 '이어하기' 로 같은 라운드를 체력 RUN.cont 로 다시 시작한다. 처음부터 시작하려면 메인 화면의 PLAY. */
const RUN = { heal: lv => lv % BOSS.every === 0 ? BOSS.heal : 8, cont: 50, pity: 20 };
/* 보스 라운드: BOSS.every 라운드마다 (10, 20, 30 …). 체력이 많고(일반 + BOSS.hp), AI 실력이 BOSS.lv 라운드만큼 앞서 있다.
   체력이 BOSS.rageAt 아래로 떨어지면 '분노': 펀치가 빨라지고(BOSS.rageSpeed) 더 공격적이 된다. 이기면 체력을 BOSS.heal 만큼 회복 */
const BOSS = { every: 10, hp: 25, lv: 3, rageAt: .4, rageSpeed: .92, rageLv: 2, heal: 35 };     // 밸런스 시뮬레이션으로 정한 값 (전문가 수준 반응이면 거의 이기지만 체력을 36~42 잃는다)
const isBoss = lv => lv % BOSS.every === 0;               // heal: 상대를 이길 때마다 회복하는 체력 / cont: 이어하기 체력 (밸런스 시뮬레이션으로 정한 값)
function nextOpponent(){ start(Math.min(99, game.level + 1), { hp: P.hp + RUN.heal(game.level), keepP: true }); }
// 이어하기 체력: 처음은 RUN.cont(50). 같은 라운드에서 연달아 지면 한 번마다 RUN.pity 씩 더 준다 (50 → 70 → 90 → …) — 깊은 라운드에서 끝없이 막히지 않게
function contHp(level){ return Math.min(CHARS[game.char].hp, RUN.cont + RUN.pity*Math.max(0, (game.deathLv === level ? game.deathStreak : 1) - 1)); }
function continueRun(level){ start(level, { hp: contHp(level), slide: true }); }
function start(level, opts){
  opts = opts || {};
  hideMenu(); hideResult(); stageTicket(level);
  game.paused = false; game.adWait = false; $('pause').classList.add('hidden');
  game.level = level; game.newBest = false; game.rank = null; game.saveError = null; game.escAt = 0;
  game.oldE = null; game.entry = null;
  if(opts.keepP && P && P.player){                                   // 이어지는 라운드: 내 파이터는 자리·방향·카운터 게이지 그대로, 동작만 대기 상태로
    const cg = P.cg, keepX = Math.max(100, Math.min(860, P.x)), hp = P.hp;
    game.oldE = E;                                                   // 쓰러진 상대는 잠깐 남았다가 사라진다
    P = Object.assign(mk(keepX, P.face, true, 1, game.char), { cg, lag: Math.max(hp, P.lag || hp) });
    P.hp = hp;
    const side = keepX <= 480 ? 1 : -1, to = Math.max(100, Math.min(860, keepX + side*300));   // 다음 상대는 넓은 쪽에서 들어온다
    E = mk(side > 0 ? 1080 : -120, -side, false, level, cpuChar(level));
    game.entry = { from: E.x, to }; P.face = side;
  } else {
    P = mk(310, 1, true, 1, game.char);
    E = mk(650, -1, false, level, cpuChar(level));
    if(opts.slide) game.entry = { from: 1080, to: 650 };               // 이어하기: 상대가 오른쪽에서 슥 들어온다
  }
  if(typeof opts.hp === 'number') P.hp = P.lag = Math.max(1, Math.min(P.maxhp, opts.hp));         // 이어지는 체력
  // 스테이지가 올라가도 CPU의 체력·공격력·이동속도는 그대로(그 캐릭터의 기본값). 달라지는 건 AI의 '실력'뿐이다 (aiProfile 참고)
  E.spd = 1;
  // 10스테이지부터 CPU 체력이 오른다: 10~19 → 110, 20~29 → 120, 30 이상 → 130 (이후 고정). 공격력/속도는 그대로
  const hpUp = level >= 30 ? 130 : level >= 20 ? 120 : level >= 10 ? 110 : 0;
  if(hpUp){ E.maxhp = E.hp = E.lag = hpUp; }
  if(isBoss(level)){ E.boss = true; E.lvl = level + BOSS.lv; E.maxhp = E.hp = E.lag = (hpUp || E.maxhp) + BOSS.hp; }
  game.state = 'intro'; game.introT = 0; game.koT = 0; game.slow = 0; game.freeze = 0;
  parts.length = rings.length = texts.length = stars.length = 0; buf = [];
}

function perform(f, act){
  if(act === 'dodge'){
    if(f.ctrl.move){                                   // 코너 탈출: 필드 쪽 방향키를 누른 채 회피 → 피벗 (조건이 안 맞으면 아래의 평범한 회피)
      const o = f === P ? E : P, dir = pivotDir(f, o);
      if(dir && f.ctrl.move === dir && pivotReady(f, o)){ startPivot(f, o, dir); return true; }
    }
    if(f.dodgeCd > 0 || f.st < 12*STAM_USE) return false;
    f.st -= 12*STAM_USE; f.dodgeCd = f.cd.dodgeCd; f.dodgeInv = DODGE_INV; setState(f,'dodge'); sfx('dodge');
    return true;
  }
  const k = (f.player || f.human) ? f.chATK[act] : cpuAtk(f.lvl, f.ch, act, f.rage);    // CPU는 스테이지 초반일수록 준비/후딜레이가 길다
  if(!k || f.st < k.stamina*STAM_USE) return false;
  if(f.atkCd[act] > 0) return false;
  if(k.name === 'skill'){
    if(f.cg < 100) return false;                      // 카운터 게이지가 가득 차야 사용 가능
    f.cg = 0;
    addText(f.x, GY-250, 'COUNTER SKILL!', COL.gold, 20); sfx('charge');
    game.flash = Math.max(game.flash, .12);
  }
  f.st -= k.stamina*STAM_USE; f.atk = k; f.hitDone = false; f.connected = false; f.sw = false; f.vx = 0;
  if(k.rd !== undefined) f.atkCd[act] = k.windup + k.active + k.recover + k.rd;
  setState(f,'attack');
  f.counterAtk = f.counter > 0;       // 회피(SLIP) 직후의 카운터 기회를 잡고 낸 공격인지 — 궤적을 더 강하게 그린다 (적중하면 counter 값은 소모되므로 미리 기억해 둔다)
  return true;
}

// 펀치 글러브가 지나가는 길: pull = 준비 동작에서 뒤로 당긴 위치, ext = 가장 멀리 뻗은 위치 (몸 중심 기준 x, y). 그리기와 타격 판정이 같은 값을 쓴다
function punchGeom(k){
  const up = k.style === 'up', sk = k.style === 'skill', hk = k.style === 'hook', bd = k.style === 'body';
  return {
    pull: k.pull || (up ? { x:12, y:-58 } : sk ? { x:-14, y:-150 } : hk ? { x:-18, y:-158 } : bd ? { x:8, y:-92 } : { x:6, y:-140 }),
    ext:  up ? { x:k.reach - 40, y:-214 } : hk ? { x:k.reach - 26, y:-166 } : bd ? { x:k.reach - 24, y:-108 } : { x:k.reach - 24, y:k.glove==='lead' ? -158 : -162 }
  };
}
const HIT_BODY = 30;                                    // 상대 중심에서 이만큼 앞(몸통 앞면 + 글러브 반지름)까지 글러브가 와야 '닿은' 것으로 본다
// 이 순간 글러브가 상대 몸에 닿았는가: 팔이 뻗는 동안(준비 동작이 끝난 뒤) 글러브의 실제 위치로 판정한다
function gloveTouches(k, t, dist){
  const { pull, ext } = punchGeom(k), u = easeOut(Math.min(1, (t - k.windup)/k.active));
  const gx = lerp(pull.x, ext.x, u);
  return gx >= Math.min(dist - HIT_BODY, lerp(pull.x, ext.x, .93));      // 사거리 안이면 늦어도 뻗는 동작 끝무렵에는 반드시 닿는다
}

function updF(f, o, dt){
  f.t += dt; f.dodgeInv = Math.max(0, (f.dodgeInv||0) - dt); f.pivotCd = Math.max(0, (f.pivotCd||0) - dt); f.flash = Math.max(0, f.flash-dt); f.dodgeCd = Math.max(0, f.dodgeCd-dt); for(const a in f.atkCd) f.atkCd[a] = Math.max(0, f.atkCd[a]-dt);
  f.counter = Math.max(0, f.counter-dt); f.comboT -= dt; if(f.comboT <= 0) f.combo = 0;
  f.bob += dt*5;
  f.squash = Math.max(0, f.squash - dt*6);
  if(f.z > 0 || f.vz !== 0){                          // 어퍼컷에 맞고 뜬 높이
    f.vz -= 2600*dt; f.z += f.vz*dt;
    if(f.z <= 0){ f.z = 0; f.vz = 0; }
  }
  f.lag = f.lag > f.hp ? Math.max(f.hp, f.lag - dt*28) : f.hp;
  const c = f.ctrl;

  // 가드 게이지: 가드 중이 아니면 잠시 후 회복, 0이 되면 40까지 찰 때까지 가드 불능
  f.gdT = Math.max(0, f.gdT - dt);
  if(!(f.state === 'idle' && c.guard) && f.gdT <= 0 && f.state !== 'ko'){
    f.gd = Math.min(100, f.gd + (f.gdBroken ? 14 : 20)*dt);
    if(f.gdBroken && f.gd >= 40) f.gdBroken = false;
  }

  if(f.state === 'idle'){
    f.face = o.x >= f.x ? 1 : -1;
    // 가드 게이지가 남아 있는 동안 가드하면 스태미나(초당 18.4 = 이전 16의 115%)와 체력(최대 체력의 2%/s)이 회복된다
    const guarding = c.guard && !f.gdBroken && f.gd > 0;
    f.st = Math.min(100, f.st + (guarding ? 16*1.15 : c.guard ? 10 : 24)*dt);
    if(guarding && f.hp > 0) f.hp = Math.min(f.maxhp, f.hp + f.maxhp*.02*dt);
    // 가드 중에도 앞뒤로 움직일 수 있다(플레이어만): 가드를 유지한 채 평소 속도의 60%로 이동. CPU는 예전처럼 가드 중엔 멈춘다(난이도 곡선 유지)
    f.vx = c.move * (c.move*f.face > 0 ? f.cd.mv.f : f.cd.mv.b) * f.spd * (c.guard ? (f.player || f.human ? .6 : 0) : 1);
    if(c.act) perform(f, c.act);
  }
  else if(f.state === 'attack'){
    const k = f.atk, w = k.windup, e = w + k.active;
    if(f.t >= w && !f.sw){ f.sw = true; sfx('whoosh'); }
    if(f.t >= w && f.t < e && !f.hitDone && Math.abs(o.x - f.x) <= k.reach && gloveTouches(k, f.t, Math.abs(o.x - f.x))){ f.hitDone = true; resolve(f, o, k); }   // 준비 동작(글러브를 뒤로 당기는 중)엔 맞지 않고, 글러브가 상대 몸에 닿는 순간 맞는다
    f.vx = (f.t >= w && f.t < e) ? f.face*70 : 0;
    if(f.connected && c.act){                           // 적중 후 딜레이 취소: 입력된 다음 행동을 곧바로 실행
      const next = c.act; f.atk = null; setState(f,'idle'); perform(f, next);
    }
    else if(f.connected && f.guardForce > 0){ f.atk = null; setState(f,'idle'); }   // 적중 후 가드 입력도 즉시 반영
    else if(f.t >= e + k.recover){ f.atk = null; setState(f,'idle'); }
  }
  else if(f.state === 'hit'){
    f.vx -= f.vx*Math.min(1, dt*8);
    if(f.t >= f.stun) setState(f,'idle');
  }
  else if(f.state === 'dodge'){
    // 아웃파이터: 뒤로 물러남 / 인파이터: 앞으로 더킹하며 돌진 / 슬러거: 제자리에서 숙이기만 함
    const dk = f.cd.dodge, fade = Math.max(0, 1 - f.t/.34);
    f.vx = dk === 'back' ? -f.face*420*fade : dk === 'dash' ? f.face*f.cd.dashV*fade : 0;
    if(f.t >= DODGE_CANCEL && c.act && c.act !== 'dodge'){ const next = c.act; f.vx = 0; setState(f,'idle'); perform(f, next); }   // 피한 직후 곧바로 반격
    else if(f.t >= .34) setState(f,'idle');
  }
  else if(f.state === 'pivot'){
    // 코너 탈출: 상대를 돌아 지나 반대편으로. 도착점은 매 프레임 '상대의 현재 위치 + 사정거리 바깥'으로 다시 계산해서 상대가 움직여도 항상 펀치가 닿지 않는 곳에 선다
    const pv = f.pv, u = Math.min(1, f.t/PIVOT.t), s = u*u*(3 - 2*u);          // 부드럽게 출발해 부드럽게 멈춘다
    const x1 = Math.max(100, Math.min(860, o.x + pv.dir*(maxReach(o) + PIVOT.gap)));
    f.x = pv.x0 + (x1 - pv.x0)*s; f.vx = 0;
    f.face = u < .5 ? pv.face0 : -pv.face0;                                      // 몸을 돌리는 한가운데(상대와 겹치는 순간)에 방향이 바뀐다
    if(u >= 1){ f.pv = null; setState(f, 'idle'); dust(f.x, 5, -pv.dir); }
  }
  else if(f.state === 'ko'){
    f.vx -= f.vx*Math.min(1, dt*3);
  }
  f.x = Math.max(100, Math.min(860, f.x + f.vx*dt));
  if(f.recoilV){                                          // 때린 직후의 반동: 빠르게 줄어들며 몸이 살짝 뒤로 밀린다
    f.x = Math.max(100, Math.min(860, f.x + f.recoilV*dt));
    f.recoilV *= Math.pow(.0004, dt);
    if(Math.abs(f.recoilV) < 4) f.recoilV = 0;
  }
}

/* ---------- 타격 처리 ---------- */
function resolve(a, d, k){
  if(d.state === 'ko') return;
  const dir = a.face, hx = d.x - dir*20;
  const hy = GY - d.z - (k.style === 'up' ? 192 : k.style === 'body' ? 112 : k.glove === 'lead' ? 168 : 172)*sprVY(d);   // 맞는 높이(이펙트 위치만): 어퍼컷은 턱, 바디는 복부. 스프라이트 몸 크기에 맞춘다

  // 회피 성공 (무적 프레임)
  if(d.dodgeInv > 0){
    d.counter = 1.3; game.slow = .5;
    addText(d.x, GY-235, 'SLIP!', COL.gold, 22); sfx('slip');
    return;
  }

  // 가드
  if(d.state === 'idle' && d.ctrl.guard && !d.gdBroken && !k.pierce){
    d.gd -= k.dmg*2.2*k.gm; d.gdT = 1.0; d.hp -= k.dmg*.08; d.squash = .5;
    d.vx = dir*k.kb*.4;
    addText(d.x, GY-225, 'BLOCK', '#9aa0b4', 14);
    game.freeze = Math.max(game.freeze, .03); game.shake = Math.max(game.shake, 3);
    sfx('block');
    if(d.gd <= 0){
      d.gd = 0; d.gdBroken = true; d.gdT = 1.4;
      addText(d.x, GY-250, 'GUARD BROKEN', COL.red, 20);
      game.freeze = .1; game.shake = 8; sfx('guardbreak');
    }
    koCheck(a, d, dir);
    return;
  }

  // 정타 (가드 게이지가 0이면 가드 자세여도 그대로 맞음)
  const brokenGuard = d.state === 'idle' && d.ctrl.guard && d.gdBroken;
  a.combo++; a.comboT = 1.6;
  let dmg = k.dmg * Math.max(.5, 1 - .08*(a.combo-1));
  let tag = '';
  if(a.counter > 0){ dmg *= 1.6; a.counter = 0; tag = 'COUNTER!'; }
  else if(d.state === 'attack' && d.t < d.atk.windup + d.atk.active){ dmg *= 1.3; tag = 'CLEAN HIT'; }
  if(k.pierce && d.state === 'idle' && d.ctrl.guard){   // 카운터 스킬은 가드를 부수고 들어간다
    d.gd = 0; d.gdBroken = true; d.gdT = 1.4; tag = 'GUARD CRUSH';
  }
  if(brokenGuard && !tag) tag = 'NO GUARD';
  d.gdT = Math.max(d.gdT, 1.0);
  a.connected = true;                                    // 적중 성공: 남은 후딜레이는 다음 입력으로 즉시 취소 가능
  d.hp -= dmg; d.atk = null; setState(d,'hit'); d.stun = k.stun*(d.cd.stunMul||1); d.vx = dir*k.kb; d.flash = .14; d.squash = 1;
  d.hitKind = k.style === 'body' ? 'body' : '';                       // 바디 블로우는 몸이 앞으로 접히는 반응
  if(k.stDrain) d.st = Math.max(0, d.st - k.stDrain*STAM_USE);                  // 바디 블로우: 대미지 외에 스태미나도 깎는다
  if(k.launch){ d.vz = k.launch; d.z = 1; }
  if(d.player) buf.length = 0;                           // 맞으면 저장된 입력은 비운다

  // 적중 게이지 (가드가 아닌 정타일 때만 충전)
  if(k.cg){
    const before = a.cg; a.cg = Math.min(100, a.cg + k.cg);
    if(before < 100 && a.cg >= 100){ addText(a.x, GY-250, 'COUNTER READY', COL.gold, 16); if(a.player || a.human) sfx('ready'); }
  }

  // ----- 타격감 -----
  // 일반 타격: 종류별로 히트스톱·타격음·피격 반응이 다르고(잽은 가볍고 빠르게, 스트레이트/어퍼컷은 묵직하게), 이펙트는 작게 절제한다.
  // 카운터: 같은 타격에 더 긴 정지, 더 큰 소리, 금빛 이펙트와 아주 짧은 슬로모션을 얹어 확실히 짜릿하게 만든다.
  const big = k.name === 'skill', counterHit = big || tag === 'COUNTER!';
  const F0 = HIT_FEEL[k.name] || HIT_FEEL.straight, fxm = k.fx || 1;     // fx: 슬러거처럼 한 방이 센 공격은 정지·흔들림·스파크가 조금 더 크다
  const F = fxm === 1 ? F0 : Object.assign({}, F0, { freeze:Math.min(.08, F0.freeze*fxm), shake:F0.shake*fxm, sparks:Math.round(F0.sparks*fxm), ring:F0.ring*Math.min(1.15, fxm), recoil:F0.recoil*fxm });
  d.hitPow = counterHit ? 1 : F.snap;                                 // 맞은 쪽 고개가 젖혀지는 정도 (drawFighter가 사용)
  d.squash = counterHit ? 1 : .55 + .45*F.snap;
  d.vx = dir*k.kb*(counterHit && !big ? 1.35 : 1);
  a.recoilV = -dir*F.recoil*(counterHit ? 1.4 : 1);                   // 때린 쪽도 반동으로 살짝 밀린다
  addText(d.x + dir*10, GY-d.z-215, String(Math.max(1,Math.round(dmg))), counterHit ? COL.gold : '#fff', counterHit ? (big ? 40 : 30) : (k.name === 'jab' ? 17 : 22));
  if(tag && tag !== 'COUNTER!') addText(d.x, GY-d.z-248, tag, '#9aa0b4', 13);
  game.freeze = Math.max(game.freeze, counterHit ? (big ? .2 : .13) : F.freeze);
  game.shake = Math.max(game.shake, counterHit ? (big ? 18 : 10) : F.shake);
  game.kick = Math.max(game.kick, counterHit ? (big ? .07 : .03) : F.kick);
  // 맞는 자리 이펙트: 날카로운 흰색 스파크(얇고 길쭉하며 0.1~0.2초 만에 사라짐) + 짧고 얇은 원형 충격파. 강타만 아주 짧은 임팩트 별과 먼지
  // 이 코드는 실제 적중이 판정된 이 한 곳에서만 실행되므로, 빗나가거나 막힌 공격에서는 절대 나오지 않는다
  if(F.sparks) burst(hx, hy, dir, F.sparks + Math.min(3, a.combo - 1), '#ffffff', 430 + F.ring*4, { life:[.1, .2], w:2, k:.055 });
  if(F.ring) ring(hx, hy, '#ffffff', F.ring, .15, 2.4);
  if(F.star && !counterHit) stars.push({ x:hx, y:hy, r:F.star, life:.07, max:.07, rot:Math.random()*3 });
  if(F.dust && !counterHit) dust(d.x, F.dust, dir);
  if(counterHit){
    burst(hx, hy, dir, big ? 30 : 20, COL.gold, big ? 850 : 650);
    burst(hx, hy, dir, big ? 16 : 10, '#ffffff', big ? 950 : 750, { life:[.1, .22], w:2.4, k:.06 });
    ring(hx, hy, COL.gold, big ? 150 : 96, .2, 3.4);
    ring(hx, hy, '#ffffff', big ? 96 : 62, .16, 2.6);
    stars.push({ x:hx, y:hy, r:big ? 110 : 66, life:.09, max:.09, rot:Math.random()*3 });
    dust(d.x, 8, dir);
    if(tag === 'COUNTER!') addText(d.x, GY-d.z-250, tag, COL.gold, 16);
    game.flash = big ? .25 : .12;
    game.slow = Math.max(game.slow, big ? .3 : .12);
  }
  sfx(big ? 'skill' : counterHit ? 'hit_counter' : F.sfx, 1, a.combo);
  koCheck(a, d, dir);
}
function koCheck(a, d, dir){
  if(d.hp > 0 || d.state === 'ko') return;
  d.hp = 0; setState(d,'ko'); d.vx = dir*420; if(d.player) buf.length = 0;
  if(d.player){ reportResult(false); if(game.deathLv === game.level) game.deathStreak++; else { game.deathLv = game.level; game.deathStreak = 1; } }
  else { recordWin(); reportResult(true); }
  game.state = 'ko'; game.koT = 0; game.slow = 1.5; game.freeze = .22; game.shake = 24; game.flash = .5;
  sfx('ko');
}

/* ---------- 이펙트 ---------- */
// o: { life:[최소,최대], w:선 굵기, k:꼬리 길이 } — 일반 타격의 스파크는 짧게 살고(0.1~0.2초) 얇고 길쭉해서 '날카롭게' 보이고, 기본값은 예전 스파크
function burst(x, y, dir, n, color, spd, o){
  o = o || {}; const lf = o.life || [.28, .53];
  for(let i=0;i<n;i++){
    const a = (Math.random()-.5)*2.4, s = spd*(.3+Math.random()*.7);
    parts.push({ x, y, vx:Math.cos(a)*s*dir + (Math.random()-.5)*80, vy:Math.sin(a)*s - 80, life:lf[0] + Math.random()*(lf[1]-lf[0]), max:lf[1], color, w:o.w || 3, k:o.k || .03 });
  }
}
function dust(x, n, dir){
  for(let i=0;i<n;i++) parts.push({ x:x + (Math.random()-.5)*50, y:GY-2, vx:dir*(40+Math.random()*180) + (Math.random()-.5)*60, vy:-60-Math.random()*160, life:.3+Math.random()*.3, max:.6, color:'#8b8b9a', dot:true, size:2+Math.random()*3 });
}
function ring(x, y, color, r, life, w){ life = life || .22; rings.push({ x, y, r:8, R:r, life, max:life, color, w:w || 3 }); }
function addText(x, y, s, color, size){ texts.push({ x, y, s, color, size, life:.9, max:.9 }); }

/* ---------- AI ---------- */
/* CPU 난이도: 체력·공격력·이동속도는 모든 스테이지에서 똑같고, AI의 '실력'만 올라간다.
   스테이지 1 → 반응과 판단이 매우 느리고, 펀치 준비/후딜레이가 길며, 헛스윙도 잦다
   스테이지 3 → 내가 가드를 내린 순간을 노리기 시작
   스테이지 4 → 가드 게이지가 바닥나기 직전이면 몰아붙임
   스테이지 5 이상 → 내가 가드를 쥐고 있는 시간을 학습해서, 가드가 풀리는 순간에 주먹이 닿도록 미리 휘두름 */
/* 깊은 라운드 (AIDEEP): 4라운드 이후에도 천천히 계속 강해진다 (예전에는 4~15라운드에서 멈췄다 → 후반이 다 비슷했다).
   deep = 0 (4라운드) → 1 (AIDEEP.full 라운드). 펀치 준비·후딜레이가 조금씩 짧아지고, 반응이 빨라지고,
   '회피 → 카운터' 만 노리는 플레이를 읽어서 짧은 펀치로 회피를 유도한 뒤 카운터를 가드/회피로 받아낸다. */
const AIDEEP = { full: 30, windup: 1.22, recover: 1.0, react: .035, guardBack: .75, bait: .7, readDodge: .85 };
function aiProfile(lv){
  const deep = Math.min(1, Math.max(0, (lv - 4)/(AIDEEP.full - 4)));
  const c = Math.min(1, (lv-1)/4);               // 스테이지 1 → 0, 스테이지 5 이상 → 1
  const cs = Math.min(1, (lv-1)/3);              // 펀치 속도 곡선: 스테이지 1 → 0, 스테이지 4 이상 → 1
  const late = Math.min(3, Math.max(0, lv-5));   // 6스테이지부터는 반응 속도만 조금씩 더 빨라진다
  const p = Math.min(1, Math.max(0, (lv-3)/2));  // 가드 타이밍 읽기 숙련도 (스테이지 3 → 0, 5 → 1)
  return {
    react: Math.max(.05, lerp(.62, .10, c) - .012*late - AIDEEP.react*deep),        // 내 공격을 본 뒤 반응하기까지 걸리는 시간
    defend: Math.min(.97, lerp(.10, .90, c) + .008*Math.min(10, Math.max(0, lv-5))),   // 반응(회피/가드)을 시도할 확률 (스테이지 6 이후에도 15까지 조금씩 오른다)
    think: Math.max(.05, lerp(.85, .10, c) - .005*Math.min(10, Math.max(0, lv-5))),   // 다음 판단까지 걸리는 시간
    thinkJit: lerp(.60, .10, c),
    aggr: lerp(.32, .88, c),
    windupMul: cs < 1 ? lerp(2.1, 1.4625, cs) : lerp(1.4625, AIDEEP.windup, deep),            // CPU 펀치의 준비 동작 길이 배율 (길수록 눈에 보인다). 스테이지 1 → 4에서만 빨라지고, 4 이상은 같은 속도로 고정 → 사람이 보고 반응할 여지를 남긴다
    recoverMul: cs < 1 ? lerp(1.7, 1.175, cs) : lerp(1.175, AIDEEP.recover, deep),            // CPU 펀치의 후딜레이 배율 (마찬가지로 스테이지 4에서 멈춘다)
    whiff: lerp(.5, 0, c),                       // 사거리 밖에서 헛스윙할 확률
    punishP: lv < 3 ? 0 : lerp(.25, .97, p),     // 내가 가드를 내린 순간 공격할 확률
    punishDelay: lerp(.55, .08, p),              // 가드가 내려간 걸 보고 공격하기까지의 시간
    pressure: lv >= 4,
    patience: lv < 4 ? 0 : lv === 4 ? .5 : .9,   // 내가 가드 중일 때 공격을 참고 기다릴 확률
    read: lv >= 4,                               // 4스테이지부터 가드 유지 시간을 학습하지만, 예측이 부정확(오차 ±0.14초) → 5스테이지 ±0.03초 → 6스테이지 이상 ±0.01초
    readJitter: lv === 4 ? .14 : lv === 5 ? .03 : .01,
    deep,
    guardBack: lv >= 8 ? AIDEEP.guardBack*deep : 0,   // 내 공격이 회피당했으면, 후딜레이가 끝나자마자 카운터를 막으려 가드/회피할 확률
    bait: lv >= 8 ? AIDEEP.bait*deep : 0,             // 상대가 회피만 노리면 짧은 잽으로 회피를 끌어낼 확률
  };
}
const cpuAtkCache = {};
function cpuAtk(lv, ch, act, rage){
  const key = lv + ch + act + (rage ? 'R' : '');
  if(!cpuAtkCache[key]){
    const pf = aiProfile(lv), k = CHARS[ch].atk[act], rm = rage ? BOSS.rageSpeed : 1;
    cpuAtkCache[key] = Object.assign({}, k, { windup: k.windup*pf.windupMul*rm, recover: k.recover*pf.recoverMul*rm });
  }
  return cpuAtkCache[key];
}

// 판마다 다른 '싸우는 스타일'과 오프닝 대기 시간을 무작위로 정한다 → 시작하자마자 똑같은 타이밍으로 달려드는 패턴이 사라진다
const AIX = { open:1, pend:1, step:1, ext:1, mid:1 };           // 새 AI 동작 강도 (1 = 켬, 0 = 끔). 밸런스 점검용 조절값
function aiInit(A){
  const r = Math.random();
  A.style = r < .30 ? 'rush' : r < .55 ? 'wait' : r < .80 ? 'probe' : 'guard';     // rush: 바로 압박 / wait: 기다림 / probe: 스텝으로 간격 재기 / guard: 가드 올리고 접근
  const span = { rush:[.1, .7], wait:[1.0, 2.4], probe:[.5, 1.3], guard:[.6, 1.5] }[A.style];
  A.open = AIX.open*(span[0] + Math.random()*(span[1] - span[0]));       // 이 시간 동안은 먼저 공격하지 않는다 (반응/가드/회피는 그대로)
  A.seq = []; A.pend = null; A.chain = 0; A.last = ''; A.dpun = false; A.firstDone = false;
}
function runAI(f, o, dt){
  if(f.boss && !f.rage && f.hp > 0 && f.hp < f.maxhp*BOSS.rageAt){ f.rage = true; addText(f.x, GY - 260, 'RAGE!', COL.red, 26); sfx('charge'); }
  const c = f.ctrl, A = f.ai, d = Math.abs(o.x - f.x), lv = f.lvl + (f.rage ? BOSS.rageLv : 0), pf = aiProfile(lv);
  if(A.style === undefined) aiInit(A);
  A.open = Math.max(0, A.open - dt);
  let pre = false;                                        // true: 타이밍이 정확해야 하는 공격(가드 풀림 노리기, 회피 직후 반격 등)은 무작위 지연/오프닝 대기를 적용하지 않는다
  if(f.state !== 'attack') A.chain = 0;
  // 이 CPU 캐릭터의 공격 사정거리 기준으로 판단한다 (아웃파이터는 멀리서, 인파이터는 파고들어서)
  const fa = s => f.chATK[s], R = s => fa(s).reach, far = R('straight') + 10, cai = f.cd.ai;
  c.act = null;
  const now = game.t;                                     // 히트스톱 중에도 흐르는 실제 시간 (사람이 가드를 쥔 시간과 같은 기준)

  // ① 내 가드를 관찰: 가드를 올린 시점/내린 시점 기록, 가드 유지 시간 학습
  const pg = o.state === 'idle' && o.ctrl.guard && !o.gdBroken;
  if(pg && !A.pg){ A.pgStart = now; A.fired = false; A.jit = (Math.random()*2 - 1)*pf.readJitter; }
  if(!pg && A.pg){
    const released = o.state === 'idle' && !o.ctrl.guard;  // 맞아서/가드가 깨져서 풀린 건 '내가 내린 타이밍'이 아니므로 학습하지 않는다
    if(released){
      const held = now - A.pgStart;
      if(held > .1){ A.holds.push(held); if(A.holds.length > 6) A.holds.shift(); }
    }
    if(Math.random() < pf.punishP) A.punishT = pf.punishDelay * (.8 + Math.random()*.4);   // 가드를 내렸다! → 곧 공격
  }
  A.pg = pg;

  // ② 내 공격에 대한 반응 (회피 / 가드). 반응이 느린 초반엔 공격이 끝난 뒤에야 반응한다
  if(o.state === 'attack' && d < o.atk.reach + 30){
    if(!A.reacting){ A.reacting = true; A.did = false; A.react = pf.react*(.85 + Math.random()*.3); A.choice = Math.random(); A.willReact = Math.random() < pf.defend; }
    else {
      A.react -= dt;
      if(A.react <= 0 && !A.did){
        A.did = true;
        if(A.willReact && f.state === 'idle'){
          const sk = o.atk.name === 'skill';              // 카운터 스킬은 막아도 뚫리니 피하려 한다
          if(A.choice < (sk ? .65 : lerp(.15, .40, Math.min(1, (lv-1)/4)) + .015*Math.min(10, Math.max(0, lv-5)))) c.act = 'dodge';   // 높은 스테이지일수록 막기보다 회피를 더 쓴다
          else A.hold = .55;
        }
      }
    }
  } else { A.reacting = false; A.did = false; }

  // ②-b (8라운드~, 점점 강하게) '회피 → 카운터' 읽기: 내 펀치가 회피당하면 기억하고(A.dodged), 후딜레이가 끝나는 순간 카운터를 가드/회피로 받는다
  if(f.state === 'attack'){ if(!A.inAtk){ A.inAtk = true; A.wasDodged = false; } if(o.state === 'dodge') A.wasDodged = true; }
  else if(A.inAtk){ A.inAtk = false; A.hist = (A.hist || []).concat(A.wasDodged ? 1 : 0).slice(-6); }
  const habit = A.hist && A.hist.length >= 3 ? A.hist.reduce((a, b) => a + b, 0)/A.hist.length : 0;     // 최근 공격 중 회피당한 비율
  if(pf.guardBack && o.counter > 0 && f.state === 'idle' && !A.gb){
    A.gb = true;
    if(Math.random() < pf.guardBack*(.5 + habit)) { if(o.state === 'attack' && Math.random() < .5) c.act = 'dodge'; else A.hold = .5; }
  }
  if(o.counter <= 0) A.gb = false;

  // ③ 가드를 내린 순간 공격
  if(A.punishT >= 0){ A.punishT -= dt; if(A.punishT < 0) A.punishWait = .35; }   // 반응 시간이 지나면, 행동 가능해질 때까지 최대 0.35초 기다렸다 공격
  if(A.punishWait > 0){
    A.punishWait -= dt;
    if(f.state === 'idle' && !c.act){
      if(d <= R('jab') - 4) c.act = (lv >= 5 && Math.random() < .4) ? 'straight' : 'jab';
      else if(d <= R('straight') - 8) c.act = 'straight';
      else A.move = 1;                                     // 간격이 멀면 일단 붙는다
      if(c.act){ A.punishWait = 0; pre = true; }
    }
  }

  // ④ (5스테이지~) 가드 유지 시간을 학습해서 가드가 풀리는 순간에 주먹이 닿도록 미리 휘두른다
  if(pf.read && pg && !A.fired && A.holds.length >= 2 && f.state === 'idle' && !c.act){
    // 상위 30% 지점 값: 가끔 짧게 끊긴 가드에 휘둘리지 않고, 예측이 빗나가도 '가드가 풀리기 전에 막히는' 쪽보다 '풀린 직후 맞는' 쪽이 되도록 살짝 늦게 잡는다
    const sorted = A.holds.slice().sort((a, b) => a - b), avg = sorted[Math.min(sorted.length - 1, Math.floor(sorted.length*.7))];
    let use = d <= R('jab') - 4 ? 'jab' : d <= R('straight') - 8 ? 'straight' : null;
    if(use && f.st < fa(use).stamina) use = null;                                        // 스태미나가 모자라면 이 타이밍은 포기
    // 준비 동작이 끝나 주먹이 나가는 순간(= 평균 가드 유지 시간 + 0.03초)이 내가 가드를 내린 직후가 되도록 시작 시점을 계산
    const realWind = (f.player || f.human) ? fa(use || 'jab').windup : cpuAtk(lv, f.ch, use || 'jab', f.rage).windup;      // CPU는 스테이지별로 늘어난 준비 동작 길이로 계산한다
    if(use && now - A.pgStart >= avg - realWind + .03 + A.jit){ c.act = use; A.fired = true; pre = true; }
  }

  // ⑤ (스테이지 5~) 사람처럼 노린다: 회피 직후 바로 반격 / 상대가 회피하는 순간 공격 / 맞춘 뒤 이어치기. 스테이지가 오를수록 더 자주, 더 빠르게
  const late6 = Math.min(10, Math.max(0, lv - 5));       // 스테이지 6~15에 걸쳐 조금씩 더 어려워진다 (15 이후는 고정)
  if(AIX.ext && lv >= 5 && !c.act && f.state === 'idle'){
    if(f.counter > 0 && d <= R('straight') - 6 && Math.random() < dt*(8 + late6*1.5)){ c.act = f.atkCd.straight > 0 ? 'jab' : 'straight'; pre = true; }       // 내가 피했다 → 곧바로 카운터
    else if(o.state === 'dodge' && o.t > .14 && !A.dpun && d <= R('straight') - 10){ A.dpun = true; if(Math.random() < Math.min(.85, .25 + .06*late6 + AIDEEP.readDodge*pf.deep*habit)){ c.act = 'straight'; pre = true; } }   // 상대 회피 끝자락을 노린다 (회피를 자주 하는 상대일수록 더 자주)
  }
  if(o.state !== 'dodge') A.dpun = false;
  if(lv >= 6 && f.state === 'attack' && f.connected && !c.act && A.chain < (lv >= 9 ? 2 : 1) && Math.random() < Math.min(.6, .1 + .05*late6)){
    const cand = ATTACK_SLOTS.filter(s => s !== A.last && f.atkCd[s] <= 0 && d <= R(s) && f.st >= fa(s).stamina*STAM_USE);
    if(cand.length){ c.act = cand[Math.floor(Math.random()*cand.length)]; A.chain++; pre = true; }                                                         // 맞춘 직후 이어치기 (콤보)
  }

  A.hold -= dt; A.think -= dt;
  c.guard = A.hold > 0 && !f.gdBroken;

  if(A.think <= 0 && f.state === 'idle' && !c.act){
    A.think = pf.think + Math.random()*pf.thinkJit;
    const r = Math.random();
    const stunned = o.state === 'hit' || (o.state === 'attack' && o.t > o.atk.windup + o.atk.active);
    const pressing = pf.pressure && pg && o.gd < 40 && d <= R('straight') - 8;         // 내 가드가 거의 바닥났다
    // 내가 가드를 올리고 있으면, 숙련된 CPU는 가드에 막히는 헛수고를 줄이고 풀리는 순간을 기다린다
    const waiting = pg && !pressing && A.holds.length >= 2 && Math.random() < pf.patience;
    const tired = pf.read && f.st < 34;                  // 숙련된 CPU는 스태미나를 바닥내지 않고 아껴 둔다 (결정적인 순간 휘두르려고)
    const stepP = A.style === 'probe' ? .5 : A.style === 'wait' ? .38 : A.style === 'guard' ? .2 : .12;
    const mid = d > R('jab') + 6 && d <= far + 70;
    if(AIX.step && !stunned && !pressing && !A.seq.length && mid && (A.open > 0 || Math.random() < stepP + .05*Math.min(1, (lv-1)/4))){
      // 스텝: 앞뒤로 발을 움직이며 간격을 잰다 (가만히 서서 달려들지 않는다)
      const pats = [[[1, .16], [-1, .2]], [[-1, .2], [1, .18]], [[1, .14], [0, .1], [1, .14]], [[-1, .16], [0, .12], [-1, .16]], [[0, .3]]];
      A.seq = pats[Math.floor(Math.random()*pats.length)].map(s => [s[0], s[1]*(.8 + Math.random()*.5)]);
      if(A.style === 'guard' && Math.random() < .5) A.hold = .4;
    } else if(A.open > 0 && !stunned){
      // 오프닝 대기 중: 스타일에 맞게 간격만 맞춘다 (먼저 공격하지 않는다)
      A.move = d > far + 20 ? (A.style === 'wait' && Math.random() < .5 ? 0 : 1) : 0;
      if(A.style === 'guard' && d <= far + 40 && Math.random() < .5) A.hold = .45;
    } else if(waiting || tired){
      A.move = d > far ? 1 : 0;
    } else if(f.cg >= 100 && lv >= 3 && d <= R('skill') - 10 && r < .55){
      c.act = 'skill'; A.move = 0;
    } else if(stunned && d <= R('straight') - 6 && r < pf.aggr){
      c.act = (d <= R('uppercut') && lv >= 2 && Math.random() < .25 + cai.upper) ? 'uppercut'
            : (d <= R('jab') && Math.random() < .55 + (.3 - cai.strong)*.5) ? 'jab' : 'straight';
    } else if(pressing && r < .85){
      c.act = (d <= R('jab') - 4 && Math.random() < .5) ? 'jab' : 'straight'; A.move = 0;
    } else if(d > far){ A.move = 1; }
    else if(d > R('jab')){
      if(r < pf.aggr){
        if((d <= R('straight') - 6 && Math.random() < AIX.mid && (A.firstDone || Math.random() >= .35)) || Math.random() < pf.whiff){ c.act = 'straight'; A.move = 0; }   // 초반엔 사거리 밖에서도 헛스윙. 사거리 안이어도 가끔은 한 걸음 더 붙어서 다른 펀치를 낸다
        else A.move = 1;
      } else A.move = 0;
    } else {
      const rt = .16*cai.retreat;                         // 뒤로 빠지는 성향: 아웃파이터는 그대로, 인파이터는 거의 안 물러난다
      if(f.st < 14){ A.move = -1; A.hold = .5; }
      else if(r < pf.aggr*.62){
        const pS = Math.min(.9, cai.strong + .03*Math.min(lv, 8));
        c.act = (cai.upper > 0 && Math.random() < cai.upper && d <= R('uppercut')) ? 'uppercut' : Math.random() < pS ? 'straight' : 'jab'; A.move = 0;
      }
      else if(r < pf.aggr*.62 + rt){ A.move = -1; }
      else if(r < pf.aggr*.62 + rt + .14){ A.hold = .4; A.move = 0; }
      else A.move = 0;
    }
  }
  if(c.act && c.act !== 'dodge' && c.act !== 'jab' && c.act !== 'skill' && pf.bait && habit >= .5 && d <= R('jab') + 4 && f.atkCd.jab <= 0 && Math.random() < pf.bait*habit) c.act = 'jab';   // 회피 유도용 잽

  // 재사용 대기 중인 공격은 낼 수 없으니 가까우면 기본기(J 슬롯)로 대신하고, 아니면 이번 판단은 넘긴다
  if(c.act && f.atkCd[c.act] > 0) c.act = (f.atkCd.jab === 0 && d <= R('jab') - 4) ? 'jab' : null;
  // 오프닝 대기 / 무작위 지연: 같은 타이밍으로 달려드는 패턴을 없앤다 (정확한 타이밍이 필요한 공격은 제외). 판단한 공격의 약 70%는 잠깐 뜸을 들였다가 나간다
  if(c.act && c.act !== 'dodge' && !pre){
    if(A.open > 0) c.act = null;
    else if(Math.random() < Math.min(1, .7*AIX.pend*cai.delay)){ A.pend = { act:c.act, t:Math.random()*lerp(.36, .18, Math.min(1, (lv-1)/6))*cai.delay }; c.act = null; }   // cai.delay: 캐릭터마다 뜸 들이는 정도 (밸런스 값)
  }
  if(A.pend){
    A.pend.t -= dt;
    if(c.act && c.act !== 'dodge') A.pend = null;
    else if(A.pend.t <= 0){ if(f.state === 'idle' && f.atkCd[A.pend.act] <= 0 && d <= R(A.pend.act) + 6) c.act = A.pend.act; A.pend = null; }
  }
  if(c.act && c.act !== 'dodge'){ A.last = c.act; A.seq.length = 0; A.firstDone = true; }
  if(A.seq.length){
    const s = A.seq[0]; c.move = s[0]*f.face; s[1] -= dt;
    if(s[1] <= 0) A.seq.shift();
    if(f.state !== 'idle') A.seq.length = 0;
  } else c.move = A.move * f.face;
  // 코너 탈출(피벗): 높은 스테이지(PIVOT.cpuLevel~)의 CPU는 코너에서 펀치가 닿는 거리에 몰려 있으면, 반응 시간(.35~.8초)만큼 뜸을 들인 뒤 피벗으로 빠져나온다
  if(!f.player && !f.human && lv >= PIVOT.cpuLevel && !game.autoP){
    const pd = f.state === 'idle' ? pivotDir(f, o) : 0;
    if(pd && pivotReady(f, o)){
      A.cornerT = (A.cornerT || 0) + dt; if(!A.cornerWait) A.cornerWait = .35 + Math.random()*.45;
      if(A.cornerT >= A.cornerWait){ c.move = pd; c.act = 'dodge'; A.cornerT = 0; A.cornerWait = 0; A.seq.length = 0; }
    } else { A.cornerT = 0; A.cornerWait = 0; }
  }
}

/* ---------- 업데이트 ---------- */
function step(dt){
  if(game.paused || CG.adBusy) return;                 // 일시정지 / 광고 중에는 시간이 멈춘다
  game.t += dt;
  if(game.state === 'ko') game.koT += dt;
  if(game.state === 'ko' && E.hp <= 0 && P.hp > 0 && game.koT > 2.3){ advanceRun(); if(game.state !== 'ko') return; }   // 이기면 잠시 뒤 다음 상대가 걸어 들어온다 (Enter 로 바로 넘어갈 수도 있음)
  game.shake *= Math.pow(.0008, dt);
  game.flash = Math.max(0, game.flash - dt);

  game.kick = Math.max(0, game.kick - dt*.35);
  if(game.freeze > 0){ game.freeze -= dt; return; }
  let ts = 1;
  if(game.slow > 0){ game.slow -= dt; ts = game.state === 'ko' ? .2 : .3; }
  const rdt = dt;                                       // 입력 버퍼는 슬로모션과 무관한 실제 프레임 기준
  dt *= ts;

  for(const p of parts){ p.life -= dt; p.vy += 1100*dt; p.x += p.vx*dt; p.y += p.vy*dt; }
  for(const r of rings){ r.life -= dt; }
  for(const s of stars){ s.life -= dt; }
  for(let i=stars.length-1;i>=0;i--) if(stars[i].life<=0) stars.splice(i,1);
  for(const t of texts){ t.life -= dt; t.y -= 38*dt; }
  for(let i=parts.length-1;i>=0;i--) if(parts[i].life<=0) parts.splice(i,1);
  for(let i=rings.length-1;i>=0;i--) if(rings[i].life<=0) rings.splice(i,1);
  for(let i=texts.length-1;i>=0;i--) if(texts[i].life<=0) texts.splice(i,1);

  if(game.state === 'title' || game.state === 'auth' || game.state === 'ranking' || game.state === 'charsel' || game.state === 'stagesel'){ P.bob += dt*5; E.bob += dt*5; for(const v of PV) v.bob += dt*5; return; }

  if(game.state === 'intro'){
    game.introT += dt; P.bob += dt*5; E.bob += dt*5;
    const quick = !!game.oldE || game.level > 1 && !!game.entry;      // 이어지는 라운드는 짧게 (끊기는 느낌이 없게)
    if(game.entry){
      const nx = lerp(game.entry.from, game.entry.to, easeOut(Math.min(1, game.introT/.85)));
      E.vx = dt > 0 ? (nx - E.x)/dt : 0; E.x = nx;                    // 걸어 들어오는 동작
      if(game.introT >= .85) E.vx = 0;
    }
    if(game.introT > (quick ? .7 : .9) && !game.bell){ game.bell = true; sfx('bell'); }
    if(game.introT > (quick ? 1.15 : 1.6)){ game.state = 'fight'; game.bell = false; game.oldE = null; E.vx = 0; }
    return;
  }

  if(game.state === 'fight'){
    if(game.autoP){                                     // (밸런스 시뮬레이션 전용) 플레이어 쪽도 CPU 두뇌로 움직인다. 평소엔 꺼져 있다
      runAI(P, E, dt);
    } else {
      // 플레이어 입력
      P.ctrl.move = (keys.KeyD||keys.ArrowRight ? 1 : 0) - (keys.KeyA||keys.ArrowLeft ? 1 : 0);
      P.ctrl.act = null;
      P.guardForce = Math.max(0, P.guardForce - rdt);
      let a;
      while((a = takeBuffered(P))){                       // 행동 가능한 순간에 저장된 입력 실행
        if(a === 'guard') P.guardForce = .18;             // 가드 탭은 짧게라도 가드 자세를 취함
        else { P.ctrl.act = a; break; }
      }
      P.ctrl.guard = GUARD_KEYS.some(k => keys[k]) || P.guardForce > 0;
      ageBuffer(rdt);
    }
    runAI(E, P, dt);
  } else {
    P.ctrl.move = E.ctrl.move = 0; P.ctrl.guard = E.ctrl.guard = false; P.ctrl.act = E.ctrl.act = null; buf.length = 0;
  }

  updF(P, E, dt); updF(E, P, dt);

  const dx = E.x - P.x, minD = 66;
  if(Math.abs(dx) < minD && P.state !== 'pivot' && E.state !== 'pivot'){            // (피벗으로 돌아 지나가는 동안은 서로를 밀어내지 않는다)
    const push = (minD - Math.abs(dx))/2, s = dx >= 0 ? 1 : -1;
    E.x += s*push; P.x -= s*push;
    P.x = Math.max(100, Math.min(860, P.x)); E.x = Math.max(100, Math.min(860, E.x));
  }
}

/* ---------- 그리기 ---------- */
const lerp = (a,b,u) => a + (b-a)*u;
const easeIn = u => u*u, easeOut = u => 1 - (1-u)*(1-u);

/* ---------- 글러브 (블루: 플레이어 / 레드: 상대) ---------- */
const GLOVE = {
  blue: { main:'#4f84ff', shade:'#3a67e0', dark:'#2b4fb8', light:'#9bb8ff', trim:'#5b8dff' },
  red:  { main:'#ff5a5f', shade:'#d2414a', dark:'#a8323a', light:'#ffa3a6', trim:'#ff6b70' }
};
function rrPath(x, y, w, h, r){
  ctx.beginPath(); ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath();
}
// (x,y)=주먹 중심, ang=팔 방향. 로컬 +x가 팔이 뻗는 방향이라 어떤 자세에서도 손목→주먹 방향으로 자연스럽게 회전한다
const GLOVE_CFG = { scale: 1.1, tilt: -.75 };   // scale: 글러브 크기, tilt: 팔을 접었을 때 글러브가 위로 기울어지는 각도
function drawGlove(x, y, ang, th, flash, back, sMul){
  const main = flash ? '#ffffff' : back ? th.shade : th.main;
  const shade = flash ? '#d4d4de' : back ? th.dark : th.shade;
  const gs = GLOVE_CFG.scale*(sMul || 1);                  // 캐릭터별 글러브 크기 (슬러거는 조금 더 크다)
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.scale(gs, gs);
  // 손목 스트랩: 검정 + 포인트 라인
  ctx.fillStyle = '#12121a'; ctx.strokeStyle = flash ? '#fff' : th.trim; ctx.lineWidth = 2;
  rrPath(-29, -11, 18, 22, 4); ctx.fill(); ctx.stroke();
  // 주먹 본체
  ctx.fillStyle = main; ctx.strokeStyle = COL.bg; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.ellipse(0, 0, 18, 15.5, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  // 엄지(아래쪽)
  ctx.fillStyle = shade; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(5, 10.5, 9, 5.5, -.25, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  // 하이라이트
  ctx.globalAlpha = .45; ctx.fillStyle = flash ? '#fff' : th.light;
  ctx.beginPath(); ctx.ellipse(1, -7.5, 9, 3.6, -.15, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha = 1;
  // 로고(흰 사선 두 줄)
  ctx.fillStyle = 'rgba(255,255,255,.92)';
  ctx.beginPath(); ctx.moveTo(-6, 1); ctx.lineTo(-2, -6); ctx.lineTo(2, -6); ctx.lineTo(-2, 1); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(1, 4); ctx.lineTo(5, -3); ctx.lineTo(9, -3); ctx.lineTo(5, 4); ctx.closePath(); ctx.fill();
  ctx.restore();
}

/* ---------- 스프라이트 캐릭터: 관절 리그 ----------
   몸 그림 한 장을 높이별 가로 띠로 나눠 띠마다 따로 휘게 그린다 (띠 경계가 정확히 이어지는 아핀 변형이라 이음새가 없다).
   그래서 그림 한 장으로도 골반 이동(체중 이동) / 무릎 굽힘 / 척추 굽힘 / 머리 움직임이 따로 움직인다. 팔은 어깨-팔꿈치-글러브 2관절로 코드가 그린다.
   자세 q: hx 골반 앞뒤(+앞) / hy 골반 내림(무릎 굽힘, +아래) / bend 척추 굽힘(목 높이에서 골반보다 앞선 거리) / hd 머리 추가 이동(+y 아래) /
           sf·sb 앞·뒤 어깨 이동(몸통 회전) / elF·elB 팔꿈치 방향(1 아래로 굽음 ~ -1 위로 들림) / gl·gr 앞·뒤 글러브 위치
   모두 그림 전용이다: 판정은 punchGeom/gloveTouches 그대로이고, 펀치가 뻗는 동안 글러브의 가로 위치도 판정 경로와 똑같다.
   멀티플레이 손님 화면도 동기화되는 값(state, t, atk, vx, connected, ctrl)만으로 같은 자세를 계산한다. */
const RIG = {};
function rigOf(f){                                         // 캐릭터 그림별 고정 값 (골반/목 높이, 띠를 나누는 높이들)
  const L = f.cd.look, key = L.sprite + ':' + (L.sprS || 1);
  if(RIG[key]) return RIG[key];
  const S = SPR[L.sprite], sc = SPR_SC*(L.sprS || 1);
  const hipH = (S.gy - S.hip)*sc, neckH = (S.gy - S.neck)*sc, top = S.gy*sc, bot = -(S.h - S.gy)*sc;
  const ks = [bot, 0, hipH, neckH - 6, neckH + 12, top];
  for(let i = 1; i < 18; i++) ks.push(bot + (top - bot)*i/18);
  ks.sort((a, b) => a - b);
  const knots = ks.filter((h, i) => i === 0 || h - ks[i - 1] > 2.5);
  knots[knots.length - 1] = top;
  return RIG[key] = { L, S, sc, hipH, neckH, top, knots };
}
// 자세 q 로 몸을 휘는 함수: 높이 h(발=0, 위로 +)에서의 가로 이동 X(h), 휘고 난 뒤의 높이 Y(h), 몸 위의 한 점을 옮기는 D(p)
function rigWarp(R, q){
  const { hipH, neckH } = R, tl = neckH - hipH;
  const legC = 1/Math.sqrt(1 + (q.hx/hipH)**2), torC = 1/Math.sqrt(1 + (q.bend/tl)**2);   // 기울어진 만큼 세로 길이가 줄어든다 (몸이 늘어나 보이지 않게)
  const hh = Math.max(hipH*.6, hipH*legC - q.hy);                                       // 무릎을 굽힌 뒤의 골반 높이
  const hw = h => { const u = Math.max(0, Math.min(1, (h - neckH + 6)/18)); return u*u*(3 - 2*u); };   // 목 위(머리)로 갈수록 1
  const X = h => h <= 0 ? 0 : h <= hipH ? q.hx*h/hipH : q.hx + q.bend*Math.pow((h - hipH)/tl, 1.25) + q.hd.x*hw(h);
  const Y = h => h <= 0 ? h : h <= hipH ? h*hh/hipH : hh + (h - hipH)*torC - q.hd.y*hw(h);
  return { X, Y, D: p => ({ x:p.x + X(-p.y), y:-Y(-p.y) }) };
}

   키 자세 채널: [골반 x, 골반 내림, 척추 굽힘, 머리 x, 머리 y, 치는 쪽 어깨 x, y, 반대 어깨 x, y, 치는 팔 팔꿈치(1 아래 ~ -1 위), 반대 손 가드 정도(0~1), 반대 손 y]
   A = 준비 동작의 끝(장전) / I = 타격 순간 / F = 타격 직후 따라가는 동작(팔로스루) / S = 가드로 돌아오며 자리 잡는 자세
