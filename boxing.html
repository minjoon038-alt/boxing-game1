function setState(f, s){ f.state = s; f.t = 0; }

function start(level){
  hideMenu();
  game.level = level; game.newBest = false; game.rank = null; game.saveError = null; game.escAt = 0;
  P = mk(310, 1, true, 1, game.char);
  E = mk(650, -1, false, level, cpuChar(level));
  // 스테이지가 올라가도 CPU의 체력·공격력·이동속도는 그대로(그 캐릭터의 기본값). 달라지는 건 AI의 '실력'뿐이다 (aiProfile 참고)
  E.spd = 1;
  // 10스테이지부터 CPU 체력이 오른다: 10~19 → 110, 20~29 → 120, 30 이상 → 130 (이후 고정). 공격력/속도는 그대로
  const hpUp = level >= 30 ? 130 : level >= 20 ? 120 : level >= 10 ? 110 : 0;
  if(hpUp){ E.maxhp = E.hp = E.lag = hpUp; }
  game.state = 'intro'; game.introT = 0; game.koT = 0; game.slow = 0; game.freeze = 0;
  parts.length = rings.length = texts.length = stars.length = 0; buf = [];
}

function perform(f, act){
  if(act === 'dodge'){
    if(f.ctrl.move){                                   // 코너 탈출: 필드 쪽 방향키를 누른 채 회피 → 피벗 (조건이 안 맞으면 아래의 평범한 회피)
      const o = f === P ? E : P, dir = pivotDir(f, o);
      if(dir && f.ctrl.move === dir && pivotReady(f, o)){ startPivot(f, o, dir); return true; }
    }
    if(f.dodgeCd > 0 || f.st < 12*STAM_USE) return false;
    f.st -= 12*STAM_USE; f.dodgeCd = f.cd.dodgeCd; f.dodgeInv = DODGE_INV; setState(f,'dodge'); sfx('dodge');
    return true;
  }
  const k = (f.player || f.human) ? f.chATK[act] : cpuAtk(f.lvl, f.ch, act);    // CPU는 스테이지 초반일수록 준비/후딜레이가 길다
  if(!k || f.st < k.stamina*STAM_USE) return false;
  if(f.atkCd[act] > 0) return false;
  if(k.name === 'skill'){
    if(f.cg < 100) return false;                      // 카운터 게이지가 가득 차야 사용 가능
    f.cg = 0;
    addText(f.x, GY-250, 'COUNTER SKILL!', COL.gold, 20); sfx('charge');
    game.flash = Math.max(game.flash, .12);
  }
  f.st -= k.stamina*STAM_USE; f.atk = k; f.hitDone = false; f.connected = false; f.sw = false; f.vx = 0;
  if(k.rd !== undefined) f.atkCd[act] = k.windup + k.active + k.recover + k.rd;
  setState(f,'attack');
  f.counterAtk = f.counter > 0;       // 회피(SLIP) 직후의 카운터 기회를 잡고 낸 공격인지 — 궤적을 더 강하게 그린다 (적중하면 counter 값은 소모되므로 미리 기억해 둔다)
  return true;
}

// 펀치 글러브가 지나가는 길: pull = 준비 동작에서 뒤로 당긴 위치, ext = 가장 멀리 뻗은 위치 (몸 중심 기준 x, y). 그리기와 타격 판정이 같은 값을 쓴다
function punchGeom(k){
  const up = k.style === 'up', sk = k.style === 'skill', hk = k.style === 'hook', bd = k.style === 'body';
  return {
    pull: k.pull || (up ? { x:12, y:-58 } : sk ? { x:-14, y:-150 } : hk ? { x:-18, y:-158 } : bd ? { x:8, y:-92 } : { x:6, y:-140 }),
    ext:  up ? { x:k.reach - 40, y:-214 } : hk ? { x:k.reach - 26, y:-166 } : bd ? { x:k.reach - 24, y:-108 } : { x:k.reach - 24, y:k.glove==='lead' ? -158 : -162 }
  };
}
const HIT_BODY = 30;                                    // 상대 중심에서 이만큼 앞(몸통 앞면 + 글러브 반지름)까지 글러브가 와야 '닿은' 것으로 본다
// 이 순간 글러브가 상대 몸에 닿았는가: 팔이 뻗는 동안(준비 동작이 끝난 뒤) 글러브의 실제 위치로 판정한다
function gloveTouches(k, t, dist){
  const { pull, ext } = punchGeom(k), u = easeOut(Math.min(1, (t - k.windup)/k.active));
  const gx = lerp(pull.x, ext.x, u);
  return gx >= Math.min(dist - HIT_BODY, lerp(pull.x, ext.x, .93));      // 사거리 안이면 늦어도 뻗는 동작 끝무렵에는 반드시 닿는다
}

function updF(f, o, dt){
  f.t += dt; f.dodgeInv = Math.max(0, (f.dodgeInv||0) - dt); f.pivotCd = Math.max(0, (f.pivotCd||0) - dt); f.flash = Math.max(0, f.flash-dt); f.dodgeCd = Math.max(0, f.dodgeCd-dt); for(const a in f.atkCd) f.atkCd[a] = Math.max(0, f.atkCd[a]-dt);
  f.counter = Math.max(0, f.counter-dt); f.comboT -= dt; if(f.comboT <= 0) f.combo = 0;
  f.bob += dt*5;
  f.squash = Math.max(0, f.squash - dt*6);
  if(f.z > 0 || f.vz !== 0){                          // 어퍼컷에 맞고 뜬 높이
    f.vz -= 2600*dt; f.z += f.vz*dt;
    if(f.z <= 0){ f.z = 0; f.vz = 0; }
  }
  f.lag = f.lag > f.hp ? Math.max(f.hp, f.lag - dt*28) : f.hp;
  const c = f.ctrl;

  // 가드 게이지: 가드 중이 아니면 잠시 후 회복, 0이 되면 40까지 찰 때까지 가드 불능
  f.gdT = Math.max(0, f.gdT - dt);
  if(!(f.state === 'idle' && c.guard) && f.gdT <= 0 && f.state !== 'ko'){
    f.gd = Math.min(100, f.gd + (f.gdBroken ? 14 : 20)*dt);
    if(f.gdBroken && f.gd >= 40) f.gdBroken = false;
  }

  if(f.state === 'idle'){
    f.face = o.x >= f.x ? 1 : -1;
    // 가드 게이지가 남아 있는 동안 가드하면 스태미나(초당 18.4 = 이전 16의 115%)와 체력(최대 체력의 2%/s)이 회복된다
    const guarding = c.guard && !f.gdBroken && f.gd > 0;
    f.st = Math.min(100, f.st + (guarding ? 16*1.15 : c.guard ? 10 : 24)*dt);
    if(guarding && f.hp > 0) f.hp = Math.min(f.maxhp, f.hp + f.maxhp*.02*dt);
    // 가드 중에도 앞뒤로 움직일 수 있다(플레이어만): 가드를 유지한 채 평소 속도의 60%로 이동. CPU는 예전처럼 가드 중엔 멈춘다(난이도 곡선 유지)
    f.vx = c.move * (c.move*f.face > 0 ? f.cd.mv.f : f.cd.mv.b) * f.spd * (c.guard ? (f.player || f.human ? .6 : 0) : 1);
    if(c.act) perform(f, c.act);
  }
  else if(f.state === 'attack'){
    const k = f.atk, w = k.windup, e = w + k.active;
    if(f.t >= w && !f.sw){ f.sw = true; sfx('whoosh'); }
    if(f.t >= w && f.t < e && !f.hitDone && Math.abs(o.x - f.x) <= k.reach && gloveTouches(k, f.t, Math.abs(o.x - f.x))){ f.hitDone = true; resolve(f, o, k); }   // 준비 동작(글러브를 뒤로 당기는 중)엔 맞지 않고, 글러브가 상대 몸에 닿는 순간 맞는다
    f.vx = (f.t >= w && f.t < e) ? f.face*70 : 0;
    if(f.connected && c.act){                           // 적중 후 딜레이 취소: 입력된 다음 행동을 곧바로 실행
      const next = c.act; f.atk = null; setState(f,'idle'); perform(f, next);
    }
    else if(f.connected && f.guardForce > 0){ f.atk = null; setState(f,'idle'); }   // 적중 후 가드 입력도 즉시 반영
    else if(f.t >= e + k.recover){ f.atk = null; setState(f,'idle'); }
  }
  else if(f.state === 'hit'){
    f.vx -= f.vx*Math.min(1, dt*8);
    if(f.t >= f.stun) setState(f,'idle');
  }
  else if(f.state === 'dodge'){
    // 아웃파이터: 뒤로 물러남 / 인파이터: 앞으로 더킹하며 돌진 / 슬러거: 제자리에서 숙이기만 함
    const dk = f.cd.dodge, fade = Math.max(0, 1 - f.t/.34);
    f.vx = dk === 'back' ? -f.face*420*fade : dk === 'dash' ? f.face*f.cd.dashV*fade : 0;
    if(f.t >= DODGE_CANCEL && c.act && c.act !== 'dodge'){ const next = c.act; f.vx = 0; setState(f,'idle'); perform(f, next); }   // 피한 직후 곧바로 반격
    else if(f.t >= .34) setState(f,'idle');
  }
  else if(f.state === 'pivot'){
    // 코너 탈출: 상대를 돌아 지나 반대편으로. 도착점은 매 프레임 '상대의 현재 위치 + 사정거리 바깥'으로 다시 계산해서 상대가 움직여도 항상 펀치가 닿지 않는 곳에 선다
    const pv = f.pv, u = Math.min(1, f.t/PIVOT.t), s = u*u*(3 - 2*u);          // 부드럽게 출발해 부드럽게 멈춘다
    const x1 = Math.max(100, Math.min(860, o.x + pv.dir*(maxReach(o) + PIVOT.gap)));
    f.x = pv.x0 + (x1 - pv.x0)*s; f.vx = 0;
    f.face = u < .5 ? pv.face0 : -pv.face0;                                      // 몸을 돌리는 한가운데(상대와 겹치는 순간)에 방향이 바뀐다
    if(u >= 1){ f.pv = null; setState(f, 'idle'); dust(f.x, 5, -pv.dir); }
  }
  else if(f.state === 'ko'){
    f.vx -= f.vx*Math.min(1, dt*3);
  }
  f.x = Math.max(100, Math.min(860, f.x + f.vx*dt));
  if(f.recoilV){                                          // 때린 직후의 반동: 빠르게 줄어들며 몸이 살짝 뒤로 밀린다
    f.x = Math.max(100, Math.min(860, f.x + f.recoilV*dt));
    f.recoilV *= Math.pow(.0004, dt);
    if(Math.abs(f.recoilV) < 4) f.recoilV = 0;
  }
}

/* ---------- 타격 처리 ---------- */
function resolve(a, d, k){
  if(d.state === 'ko') return;
  const dir = a.face, hx = d.x - dir*20;
  const hy = GY - d.z - (k.style === 'up' ? 192 : k.style === 'body' ? 112 : k.glove === 'lead' ? 168 : 172)*sprVY(d);   // 맞는 높이(이펙트 위치만): 어퍼컷은 턱, 바디는 복부. 스프라이트 몸 크기에 맞춘다

  // 회피 성공 (무적 프레임)
  if(d.dodgeInv > 0){
    d.counter = 1.3; game.slow = .5;
    addText(d.x, GY-235, 'SLIP!', COL.gold, 22); sfx('slip');
    return;
  }

  // 가드
  if(d.state === 'idle' && d.ctrl.guard && !d.gdBroken && !k.pierce){
    d.gd -= k.dmg*2.2*k.gm; d.gdT = 1.0; d.hp -= k.dmg*.08; d.squash = .5;
    d.vx = dir*k.kb*.4;
    addText(d.x, GY-225, 'BLOCK', '#9aa0b4', 14);
    game.freeze = Math.max(game.freeze, .03); game.shake = Math.max(game.shake, 3);
    sfx('block');
    if(d.gd <= 0){
      d.gd = 0; d.gdBroken = true; d.gdT = 1.4;
      addText(d.x, GY-250, 'GUARD BROKEN', COL.red, 20);
      game.freeze = .1; game.shake = 8; sfx('guardbreak');
    }
    koCheck(a, d, dir);
    return;
  }

  // 정타 (가드 게이지가 0이면 가드 자세여도 그대로 맞음)
  const brokenGuard = d.state === 'idle' && d.ctrl.guard && d.gdBroken;
  a.combo++; a.comboT = 1.6;
  let dmg = k.dmg * Math.max(.5, 1 - .08*(a.combo-1));
  let tag = '';
  if(a.counter > 0){ dmg *= 1.6; a.counter = 0; tag = 'COUNTER!'; }
  else if(d.state === 'attack' && d.t < d.atk.windup + d.atk.active){ dmg *= 1.3; tag = 'CLEAN HIT'; }
  if(k.pierce && d.state === 'idle' && d.ctrl.guard){   // 카운터 스킬은 가드를 부수고 들어간다
    d.gd = 0; d.gdBroken = true; d.gdT = 1.4; tag = 'GUARD CRUSH';
  }
  if(brokenGuard && !tag) tag = 'NO GUARD';
  d.gdT = Math.max(d.gdT, 1.0);
  a.connected = true;                                    // 적중 성공: 남은 후딜레이는 다음 입력으로 즉시 취소 가능
  d.hp -= dmg; d.atk = null; setState(d,'hit'); d.stun = k.stun*(d.cd.stunMul||1); d.vx = dir*k.kb; d.flash = .14; d.squash = 1;
  d.hitKind = k.style === 'body' ? 'body' : '';                       // 바디 블로우는 몸이 앞으로 접히는 반응
  if(k.stDrain) d.st = Math.max(0, d.st - k.stDrain*STAM_USE);                  // 바디 블로우: 대미지 외에 스태미나도 깎는다
  if(k.launch){ d.vz = k.launch; d.z = 1; }
  if(d.player) buf.length = 0;                           // 맞으면 저장된 입력은 비운다

  // 적중 게이지 (가드가 아닌 정타일 때만 충전)
  if(k.cg){
    const before = a.cg; a.cg = Math.min(100, a.cg + k.cg);
    if(before < 100 && a.cg >= 100){ addText(a.x, GY-250, 'COUNTER READY', COL.gold, 16); if(a.player || a.human) sfx('ready'); }
  }

  // ----- 타격감 -----
  // 일반 타격: 종류별로 히트스톱·타격음·피격 반응이 다르고(잽은 가볍고 빠르게, 스트레이트/어퍼컷은 묵직하게), 이펙트는 작게 절제한다.
  // 카운터: 같은 타격에 더 긴 정지, 더 큰 소리, 금빛 이펙트와 아주 짧은 슬로모션을 얹어 확실히 짜릿하게 만든다.
  const big = k.name === 'skill', counterHit = big || tag === 'COUNTER!';
  const F0 = HIT_FEEL[k.name] || HIT_FEEL.straight, fxm = k.fx || 1;     // fx: 슬러거처럼 한 방이 센 공격은 정지·흔들림·스파크가 조금 더 크다
  const F = fxm === 1 ? F0 : Object.assign({}, F0, { freeze:Math.min(.08, F0.freeze*fxm), shake:F0.shake*fxm, sparks:Math.round(F0.sparks*fxm), ring:F0.ring*Math.min(1.15, fxm), recoil:F0.recoil*fxm });
  d.hitPow = counterHit ? 1 : F.snap;                                 // 맞은 쪽 고개가 젖혀지는 정도 (drawFighter가 사용)
  d.squash = counterHit ? 1 : .55 + .45*F.snap;
  d.vx = dir*k.kb*(counterHit && !big ? 1.35 : 1);
  a.recoilV = -dir*F.recoil*(counterHit ? 1.4 : 1);                   // 때린 쪽도 반동으로 살짝 밀린다
  addText(d.x + dir*10, GY-d.z-215, String(Math.max(1,Math.round(dmg))), counterHit ? COL.gold : '#fff', counterHit ? (big ? 40 : 30) : (k.name === 'jab' ? 17 : 22));
  if(tag && tag !== 'COUNTER!') addText(d.x, GY-d.z-248, tag, '#9aa0b4', 13);
  game.freeze = Math.max(game.freeze, counterHit ? (big ? .2 : .13) : F.freeze);
  game.shake = Math.max(game.shake, counterHit ? (big ? 18 : 10) : F.shake);
  game.kick = Math.max(game.kick, counterHit ? (big ? .07 : .03) : F.kick);
  // 맞는 자리 이펙트: 날카로운 흰색 스파크(얇고 길쭉하며 0.1~0.2초 만에 사라짐) + 짧고 얇은 원형 충격파. 강타만 아주 짧은 임팩트 별과 먼지
  // 이 코드는 실제 적중이 판정된 이 한 곳에서만 실행되므로, 빗나가거나 막힌 공격에서는 절대 나오지 않는다
  if(F.sparks) burst(hx, hy, dir, F.sparks + Math.min(3, a.combo - 1), '#ffffff', 430 + F.ring*4, { life:[.1, .2], w:2, k:.055 });
  if(F.ring) ring(hx, hy, '#ffffff', F.ring, .15, 2.4);
  if(F.star && !counterHit) stars.push({ x:hx, y:hy, r:F.star, life:.07, max:.07, rot:Math.random()*3 });
  if(F.dust && !counterHit) dust(d.x, F.dust, dir);
  if(counterHit){
    burst(hx, hy, dir, big ? 30 : 20, COL.gold, big ? 850 : 650);
    burst(hx, hy, dir, big ? 16 : 10, '#ffffff', big ? 950 : 750, { life:[.1, .22], w:2.4, k:.06 });
    ring(hx, hy, COL.gold, big ? 150 : 96, .2, 3.4);
    ring(hx, hy, '#ffffff', big ? 96 : 62, .16, 2.6);
    stars.push({ x:hx, y:hy, r:big ? 110 : 66, life:.09, max:.09, rot:Math.random()*3 });
    dust(d.x, 8, dir);
    if(tag === 'COUNTER!') addText(d.x, GY-d.z-250, tag, COL.gold, 16);
    game.flash = big ? .25 : .12;
    game.slow = Math.max(game.slow, big ? .3 : .12);
  }
  sfx(big ? 'skill' : counterHit ? 'hit_counter' : F.sfx, 1, a.combo);
  koCheck(a, d, dir);
}
function koCheck(a, d, dir){
  if(d.hp > 0 || d.state === 'ko') return;
  d.hp = 0; setState(d,'ko'); d.vx = dir*420; if(d.player) buf.length = 0;
  if(!d.player && !net.on) recordWin();
  game.state = 'ko'; game.koT = 0; game.slow = 1.5; game.freeze = .22; game.shake = 24; game.flash = .5;
  sfx('ko');
}

/* ---------- 이펙트 ---------- */
// o: { life:[최소,최대], w:선 굵기, k:꼬리 길이 } — 일반 타격의 스파크는 짧게 살고(0.1~0.2초) 얇고 길쭉해서 '날카롭게' 보이고, 기본값은 예전 스파크
function burst(x, y, dir, n, color, spd, o){
  o = o || {}; const lf = o.life || [.28, .53];
  for(let i=0;i<n;i++){
    const a = (Math.random()-.5)*2.4, s = spd*(.3+Math.random()*.7);
    parts.push({ x, y, vx:Math.cos(a)*s*dir + (Math.random()-.5)*80, vy:Math.sin(a)*s - 80, life:lf[0] + Math.random()*(lf[1]-lf[0]), max:lf[1], color, w:o.w || 3, k:o.k || .03 });
  }
}
function dust(x, n, dir){
  for(let i=0;i<n;i++) parts.push({ x:x + (Math.random()-.5)*50, y:GY-2, vx:dir*(40+Math.random()*180) + (Math.random()-.5)*60, vy:-60-Math.random()*160, life:.3+Math.random()*.3, max:.6, color:'#8b8b9a', dot:true, size:2+Math.random()*3 });
}
function ring(x, y, color, r, life, w){ life = life || .22; rings.push({ x, y, r:8, R:r, life, max:life, color, w:w || 3 }); }
function addText(x, y, s, color, size){ texts.push({ x, y, s, color, size, life:.9, max:.9 }); }

/* ---------- AI ---------- */
/* CPU 난이도: 체력·공격력·이동속도는 모든 스테이지에서 똑같고, AI의 '실력'만 올라간다.
   스테이지 1 → 반응과 판단이 매우 느리고, 펀치 준비/후딜레이가 길며, 헛스윙도 잦다
   스테이지 3 → 내가 가드를 내린 순간을 노리기 시작
   스테이지 4 → 가드 게이지가 바닥나기 직전이면 몰아붙임
   스테이지 5 이상 → 내가 가드를 쥐고 있는 시간을 학습해서, 가드가 풀리는 순간에 주먹이 닿도록 미리 휘두름 */
function aiProfile(lv){
  const c = Math.min(1, (lv-1)/4);               // 스테이지 1 → 0, 스테이지 5 이상 → 1
  const cs = Math.min(1, (lv-1)/3);              // 펀치 속도 곡선: 스테이지 1 → 0, 스테이지 4 이상 → 1
  const late = Math.min(3, Math.max(0, lv-5));   // 6스테이지부터는 반응 속도만 조금씩 더 빨라진다
  const p = Math.min(1, Math.max(0, (lv-3)/2));  // 가드 타이밍 읽기 숙련도 (스테이지 3 → 0, 5 → 1)
  return {
    react: lerp(.62, .10, c) - .012*late,        // 내 공격을 본 뒤 반응하기까지 걸리는 시간
    defend: Math.min(.97, lerp(.10, .90, c) + .008*Math.min(10, Math.max(0, lv-5))),   // 반응(회피/가드)을 시도할 확률 (스테이지 6 이후에도 15까지 조금씩 오른다)
    think: Math.max(.05, lerp(.85, .10, c) - .005*Math.min(10, Math.max(0, lv-5))),   // 다음 판단까지 걸리는 시간
    thinkJit: lerp(.60, .10, c),
    aggr: lerp(.32, .88, c),
    windupMul: lerp(2.1, 1.4625, cs),            // CPU 펀치의 준비 동작 길이 배율 (길수록 눈에 보인다). 스테이지 1 → 4에서만 빨라지고, 4 이상은 같은 속도로 고정 → 사람이 보고 반응할 여지를 남긴다
    recoverMul: lerp(1.7, 1.175, cs),            // CPU 펀치의 후딜레이 배율 (마찬가지로 스테이지 4에서 멈춘다)
    whiff: lerp(.5, 0, c),                       // 사거리 밖에서 헛스윙할 확률
    punishP: lv < 3 ? 0 : lerp(.25, .97, p),     // 내가 가드를 내린 순간 공격할 확률
    punishDelay: lerp(.55, .08, p),              // 가드가 내려간 걸 보고 공격하기까지의 시간
    pressure: lv >= 4,
    patience: lv < 4 ? 0 : lv === 4 ? .5 : .9,   // 내가 가드 중일 때 공격을 참고 기다릴 확률
    read: lv >= 4,                               // 4스테이지부터 가드 유지 시간을 학습하지만, 예측이 부정확(오차 ±0.14초) → 5스테이지 ±0.03초 → 6스테이지 이상 ±0.01초
    readJitter: lv === 4 ? .14 : lv === 5 ? .03 : .01
  };
}
const cpuAtkCache = {};
function cpuAtk(lv, ch, act){
  const key = Math.min(lv, 5) + ch + act;
  if(!cpuAtkCache[key]){
    const pf = aiProfile(lv), k = CHARS[ch].atk[act];
    cpuAtkCache[key] = Object.assign({}, k, { windup: k.windup*pf.windupMul, recover: k.recover*pf.recoverMul });
  }
  return cpuAtkCache[key];
}

// 판마다 다른 '싸우는 스타일'과 오프닝 대기 시간을 무작위로 정한다 → 시작하자마자 똑같은 타이밍으로 달려드는 패턴이 사라진다
const AIX = { open:1, pend:1, step:1, ext:1, mid:1 };           // 새 AI 동작 강도 (1 = 켬, 0 = 끔). 밸런스 점검용 조절값
function aiInit(A){
  const r = Math.random();
  A.style = r < .30 ? 'rush' : r < .55 ? 'wait' : r < .80 ? 'probe' : 'guard';     // rush: 바로 압박 / wait: 기다림 / probe: 스텝으로 간격 재기 / guard: 가드 올리고 접근
  const span = { rush:[.1, .7], wait:[1.0, 2.4], probe:[.5, 1.3], guard:[.6, 1.5] }[A.style];
  A.open = AIX.open*(span[0] + Math.random()*(span[1] - span[0]));       // 이 시간 동안은 먼저 공격하지 않는다 (반응/가드/회피는 그대로)
  A.seq = []; A.pend = null; A.chain = 0; A.last = ''; A.dpun = false; A.firstDone = false;
}
function runAI(f, o, dt){
  const c = f.ctrl, A = f.ai, d = Math.abs(o.x - f.x), lv = f.lvl, pf = aiProfile(lv);
  if(A.style === undefined) aiInit(A);
  A.open = Math.max(0, A.open - dt);
  let pre = false;                                        // true: 타이밍이 정확해야 하는 공격(가드 풀림 노리기, 회피 직후 반격 등)은 무작위 지연/오프닝 대기를 적용하지 않는다
  if(f.state !== 'attack') A.chain = 0;
  // 이 CPU 캐릭터의 공격 사정거리 기준으로 판단한다 (아웃파이터는 멀리서, 인파이터는 파고들어서)
  const fa = s => f.chATK[s], R = s => fa(s).reach, far = R('straight') + 10, cai = f.cd.ai;
  c.act = null;
  const now = game.t;                                     // 히트스톱 중에도 흐르는 실제 시간 (사람이 가드를 쥔 시간과 같은 기준)

  // ① 내 가드를 관찰: 가드를 올린 시점/내린 시점 기록, 가드 유지 시간 학습
  const pg = o.state === 'idle' && o.ctrl.guard && !o.gdBroken;
  if(pg && !A.pg){ A.pgStart = now; A.fired = false; A.jit = (Math.random()*2 - 1)*pf.readJitter; }
  if(!pg && A.pg){
    const released = o.state === 'idle' && !o.ctrl.guard;  // 맞아서/가드가 깨져서 풀린 건 '내가 내린 타이밍'이 아니므로 학습하지 않는다
    if(released){
      const held = now - A.pgStart;
      if(held > .1){ A.holds.push(held); if(A.holds.length > 6) A.holds.shift(); }
    }
    if(Math.random() < pf.punishP) A.punishT = pf.punishDelay * (.8 + Math.random()*.4);   // 가드를 내렸다! → 곧 공격
  }
  A.pg = pg;

  // ② 내 공격에 대한 반응 (회피 / 가드). 반응이 느린 초반엔 공격이 끝난 뒤에야 반응한다
  if(o.state === 'attack' && d < o.atk.reach + 30){
    if(!A.reacting){ A.reacting = true; A.did = false; A.react = pf.react*(.85 + Math.random()*.3); A.choice = Math.random(); A.willReact = Math.random() < pf.defend; }
    else {
      A.react -= dt;
      if(A.react <= 0 && !A.did){
        A.did = true;
        if(A.willReact && f.state === 'idle'){
          const sk = o.atk.name === 'skill';              // 카운터 스킬은 막아도 뚫리니 피하려 한다
          if(A.choice < (sk ? .65 : lerp(.15, .40, Math.min(1, (lv-1)/4)) + .015*Math.min(10, Math.max(0, lv-5)))) c.act = 'dodge';   // 높은 스테이지일수록 막기보다 회피를 더 쓴다
          else A.hold = .55;
        }
      }
    }
  } else { A.reacting = false; A.did = false; }

  // ③ 가드를 내린 순간 공격
  if(A.punishT >= 0){ A.punishT -= dt; if(A.punishT < 0) A.punishWait = .35; }   // 반응 시간이 지나면, 행동 가능해질 때까지 최대 0.35초 기다렸다 공격
  if(A.punishWait > 0){
    A.punishWait -= dt;
    if(f.state === 'idle' && !c.act){
      if(d <= R('jab') - 4) c.act = (lv >= 5 && Math.random() < .4) ? 'straight' : 'jab';
      else if(d <= R('straight') - 8) c.act = 'straight';
      else A.move = 1;                                     // 간격이 멀면 일단 붙는다
      if(c.act){ A.punishWait = 0; pre = true; }
    }
  }

  // ④ (5스테이지~) 가드 유지 시간을 학습해서 가드가 풀리는 순간에 주먹이 닿도록 미리 휘두른다
  if(pf.read && pg && !A.fired && A.holds.length >= 2 && f.state === 'idle' && !c.act){
    // 상위 30% 지점 값: 가끔 짧게 끊긴 가드에 휘둘리지 않고, 예측이 빗나가도 '가드가 풀리기 전에 막히는' 쪽보다 '풀린 직후 맞는' 쪽이 되도록 살짝 늦게 잡는다
    const sorted = A.holds.slice().sort((a, b) => a - b), avg = sorted[Math.min(sorted.length - 1, Math.floor(sorted.length*.7))];
    let use = d <= R('jab') - 4 ? 'jab' : d <= R('straight') - 8 ? 'straight' : null;
    if(use && f.st < fa(use).stamina) use = null;                                        // 스태미나가 모자라면 이 타이밍은 포기
    // 준비 동작이 끝나 주먹이 나가는 순간(= 평균 가드 유지 시간 + 0.03초)이 내가 가드를 내린 직후가 되도록 시작 시점을 계산
    const realWind = (f.player || f.human) ? fa(use || 'jab').windup : cpuAtk(lv, f.ch, use || 'jab').windup;      // CPU는 스테이지별로 늘어난 준비 동작 길이로 계산한다
    if(use && now - A.pgStart >= avg - realWind + .03 + A.jit){ c.act = use; A.fired = true; pre = true; }
  }

  // ⑤ (스테이지 5~) 사람처럼 노린다: 회피 직후 바로 반격 / 상대가 회피하는 순간 공격 / 맞춘 뒤 이어치기. 스테이지가 오를수록 더 자주, 더 빠르게
  const late6 = Math.min(10, Math.max(0, lv - 5));       // 스테이지 6~15에 걸쳐 조금씩 더 어려워진다 (15 이후는 고정)
  if(AIX.ext && lv >= 5 && !c.act && f.state === 'idle'){
    if(f.counter > 0 && d <= R('straight') - 6 && Math.random() < dt*(8 + late6*1.5)){ c.act = f.atkCd.straight > 0 ? 'jab' : 'straight'; pre = true; }       // 내가 피했다 → 곧바로 카운터
    else if(o.state === 'dodge' && o.t > .14 && !A.dpun && d <= R('straight') - 10){ A.dpun = true; if(Math.random() < Math.min(.85, .25 + .06*late6)){ c.act = 'straight'; pre = true; } }   // 상대 회피 끝자락을 노린다
  }
  if(o.state !== 'dodge') A.dpun = false;
  if(lv >= 6 && f.state === 'attack' && f.connected && !c.act && A.chain < (lv >= 9 ? 2 : 1) && Math.random() < Math.min(.6, .1 + .05*late6)){
    const cand = ATTACK_SLOTS.filter(s => s !== A.last && f.atkCd[s] <= 0 && d <= R(s) && f.st >= fa(s).stamina*STAM_USE);
    if(cand.length){ c.act = cand[Math.floor(Math.random()*cand.length)]; A.chain++; pre = true; }                                                         // 맞춘 직후 이어치기 (콤보)
  }

  A.hold -= dt; A.think -= dt;
  c.guard = A.hold > 0 && !f.gdBroken;

  if(A.think <= 0 && f.state === 'idle' && !c.act){
    A.think = pf.think + Math.random()*pf.thinkJit;
    const r = Math.random();
    const stunned = o.state === 'hit' || (o.state === 'attack' && o.t > o.atk.windup + o.atk.active);
    const pressing = pf.pressure && pg && o.gd < 40 && d <= R('straight') - 8;         // 내 가드가 거의 바닥났다
    // 내가 가드를 올리고 있으면, 숙련된 CPU는 가드에 막히는 헛수고를 줄이고 풀리는 순간을 기다린다
    const waiting = pg && !pressing && A.holds.length >= 2 && Math.random() < pf.patience;
    const tired = pf.read && f.st < 34;                  // 숙련된 CPU는 스태미나를 바닥내지 않고 아껴 둔다 (결정적인 순간 휘두르려고)
    const stepP = A.style === 'probe' ? .5 : A.style === 'wait' ? .38 : A.style === 'guard' ? .2 : .12;
    const mid = d > R('jab') + 6 && d <= far + 70;
    if(AIX.step && !stunned && !pressing && !A.seq.length && mid && (A.open > 0 || Math.random() < stepP + .05*Math.min(1, (lv-1)/4))){
      // 스텝: 앞뒤로 발을 움직이며 간격을 잰다 (가만히 서서 달려들지 않는다)
      const pats = [[[1, .16], [-1, .2]], [[-1, .2], [1, .18]], [[1, .14], [0, .1], [1, .14]], [[-1, .16], [0, .12], [-1, .16]], [[0, .3]]];
      A.seq = pats[Math.floor(Math.random()*pats.length)].map(s => [s[0], s[1]*(.8 + Math.random()*.5)]);
      if(A.style === 'guard' && Math.random() < .5) A.hold = .4;
    } else if(A.open > 0 && !stunned){
      // 오프닝 대기 중: 스타일에 맞게 간격만 맞춘다 (먼저 공격하지 않는다)
      A.move = d > far + 20 ? (A.style === 'wait' && Math.random() < .5 ? 0 : 1) : 0;
      if(A.style === 'guard' && d <= far + 40 && Math.random() < .5) A.hold = .45;
    } else if(waiting || tired){
      A.move = d > far ? 1 : 0;
    } else if(f.cg >= 100 && lv >= 3 && d <= R('skill') - 10 && r < .55){
      c.act = 'skill'; A.move = 0;
    } else if(stunned && d <= R('straight') - 6 && r < pf.aggr){
      c.act = (d <= R('uppercut') && lv >= 2 && Math.random() < .25 + cai.upper) ? 'uppercut'
            : (d <= R('jab') && Math.random() < .55 + (.3 - cai.strong)*.5) ? 'jab' : 'straight';
    } else if(pressing && r < .85){
      c.act = (d <= R('jab') - 4 && Math.random() < .5) ? 'jab' : 'straight'; A.move = 0;
    } else if(d > far){ A.move = 1; }
    else if(d > R('jab')){
      if(r < pf.aggr){
        if((d <= R('straight') - 6 && Math.random() < AIX.mid && (A.firstDone || Math.random() >= .35)) || Math.random() < pf.whiff){ c.act = 'straight'; A.move = 0; }   // 초반엔 사거리 밖에서도 헛스윙. 사거리 안이어도 가끔은 한 걸음 더 붙어서 다른 펀치를 낸다
        else A.move = 1;
      } else A.move = 0;
    } else {
      const rt = .16*cai.retreat;                         // 뒤로 빠지는 성향: 아웃파이터는 그대로, 인파이터는 거의 안 물러난다
      if(f.st < 14){ A.move = -1; A.hold = .5; }
      else if(r < pf.aggr*.62){
        const pS = Math.min(.9, cai.strong + .03*Math.min(lv, 8));
        c.act = (cai.upper > 0 && Math.random() < cai.upper && d <= R('uppercut')) ? 'uppercut' : Math.random() < pS ? 'straight' : 'jab'; A.move = 0;
      }
      else if(r < pf.aggr*.62 + rt){ A.move = -1; }
      else if(r < pf.aggr*.62 + rt + .14){ A.hold = .4; A.move = 0; }
      else A.move = 0;
    }
  }
  // 재사용 대기 중인 공격은 낼 수 없으니 가까우면 기본기(J 슬롯)로 대신하고, 아니면 이번 판단은 넘긴다
  if(c.act && f.atkCd[c.act] > 0) c.act = (f.atkCd.jab === 0 && d <= R('jab') - 4) ? 'jab' : null;
  // 오프닝 대기 / 무작위 지연: 같은 타이밍으로 달려드는 패턴을 없앤다 (정확한 타이밍이 필요한 공격은 제외). 판단한 공격의 약 70%는 잠깐 뜸을 들였다가 나간다
  if(c.act && c.act !== 'dodge' && !pre){
    if(A.open > 0) c.act = null;
    else if(Math.random() < Math.min(1, .7*AIX.pend*cai.delay)){ A.pend = { act:c.act, t:Math.random()*lerp(.36, .18, Math.min(1, (lv-1)/6))*cai.delay }; c.act = null; }   // cai.delay: 캐릭터마다 뜸 들이는 정도 (밸런스 값)
  }
  if(A.pend){
    A.pend.t -= dt;
    if(c.act && c.act !== 'dodge') A.pend = null;
    else if(A.pend.t <= 0){ if(f.state === 'idle' && f.atkCd[A.pend.act] <= 0 && d <= R(A.pend.act) + 6) c.act = A.pend.act; A.pend = null; }
  }
  if(c.act && c.act !== 'dodge'){ A.last = c.act; A.seq.length = 0; A.firstDone = true; }
  if(A.seq.length){
    const s = A.seq[0]; c.move = s[0]*f.face; s[1] -= dt;
    if(s[1] <= 0) A.seq.shift();
    if(f.state !== 'idle') A.seq.length = 0;
  } else c.move = A.move * f.face;
  // 코너 탈출(피벗): 높은 스테이지(PIVOT.cpuLevel~)의 CPU는 코너에서 펀치가 닿는 거리에 몰려 있으면, 반응 시간(.35~.8초)만큼 뜸을 들인 뒤 피벗으로 빠져나온다
  if(!f.player && !f.human && lv >= PIVOT.cpuLevel && !game.autoP){
    const pd = f.state === 'idle' ? pivotDir(f, o) : 0;
    if(pd && pivotReady(f, o)){
      A.cornerT = (A.cornerT || 0) + dt; if(!A.cornerWait) A.cornerWait = .35 + Math.random()*.45;
      if(A.cornerT >= A.cornerWait){ c.move = pd; c.act = 'dodge'; A.cornerT = 0; A.cornerWait = 0; A.seq.length = 0; }
    } else { A.cornerT = 0; A.cornerWait = 0; }
  }
}

/* ---------- 업데이트 ---------- */
function step(dt){
  game.t += dt;
  if(game.state === 'ko') game.koT += dt;
  if(game.state === 'ko' && P.hp <= 0 && game.koT > 3.6 && !net.on){ toTitle(); return; }   // 패배하면 잠시 결과를 보여준 뒤 자동으로 메인 화면으로 (Enter로 바로 넘어갈 수도 있음)
  game.shake *= Math.pow(.0008, dt);
  game.flash = Math.max(0, game.flash - dt);

  game.kick = Math.max(0, game.kick - dt*.35);
  if(game.freeze > 0){ game.freeze -= dt; return; }
  let ts = 1;
  if(game.slow > 0){ game.slow -= dt; ts = game.state === 'ko' ? .2 : .3; }
  const rdt = dt;                                       // 입력 버퍼는 슬로모션과 무관한 실제 프레임 기준
  dt *= ts;

  for(const p of parts){ p.life -= dt; p.vy += 1100*dt; p.x += p.vx*dt; p.y += p.vy*dt; }
  for(const r of rings){ r.life -= dt; }
  for(const s of stars){ s.life -= dt; }
  for(let i=stars.length-1;i>=0;i--) if(stars[i].life<=0) stars.splice(i,1);
  for(const t of texts){ t.life -= dt; t.y -= 38*dt; }
  for(let i=parts.length-1;i>=0;i--) if(parts[i].life<=0) parts.splice(i,1);
  for(let i=rings.length-1;i>=0;i--) if(rings[i].life<=0) rings.splice(i,1);
  for(let i=texts.length-1;i>=0;i--) if(texts[i].life<=0) texts.splice(i,1);

  if(game.state === 'title' || game.state === 'auth' || game.state === 'ranking' || game.state === 'charsel' || game.state === 'stagesel'){ P.bob += dt*5; E.bob += dt*5; for(const v of PV) v.bob += dt*5; return; }

  if(game.state === 'intro'){
    game.introT += dt; P.bob += dt*5; E.bob += dt*5;
    if(game.introT > .9 && !game.bell){ game.bell = true; sfx('bell'); }
    if(game.introT > 1.6){ game.state = 'fight'; game.bell = false; }
    return;
  }

  if(game.state === 'fight'){
    if(game.autoP){                                     // (밸런스 시뮬레이션 전용) 플레이어 쪽도 CPU 두뇌로 움직인다. 평소엔 꺼져 있다
      runAI(P, E, dt);
    } else {
      // 플레이어 입력
      P.ctrl.move = (keys.KeyD||keys.ArrowRight ? 1 : 0) - (keys.KeyA||keys.ArrowLeft ? 1 : 0);
      P.ctrl.act = null;
      P.guardForce = Math.max(0, P.guardForce - rdt);
      let a;
      while((a = takeBuffered(P))){                       // 행동 가능한 순간에 저장된 입력 실행
        if(a === 'guard') P.guardForce = .18;             // 가드 탭은 짧게라도 가드 자세를 취함
        else { P.ctrl.act = a; break; }
      }
      P.ctrl.guard = GUARD_KEYS.some(k => keys[k]) || P.guardForce > 0;
      ageBuffer(rdt);
    }
    runAI(E, P, dt);
  } else {
    P.ctrl.move = E.ctrl.move = 0; P.ctrl.guard = E.ctrl.guard = false; P.ctrl.act = E.ctrl.act = null; buf.length = 0;
  }

  updF(P, E, dt); updF(E, P, dt);

  const dx = E.x - P.x, minD = 66;
  if(Math.abs(dx) < minD && P.state !== 'pivot' && E.state !== 'pivot'){            // (피벗으로 돌아 지나가는 동안은 서로를 밀어내지 않는다)
    const push = (minD - Math.abs(dx))/2, s = dx >= 0 ? 1 : -1;
    E.x += s*push; P.x -= s*push;
    P.x = Math.max(100, Math.min(860, P.x)); E.x = Math.max(100, Math.min(860, E.x));
  }
}

/* ---------- 배경 (링 이미지: ring-bg.webp) ----------
   이미지는 0.72배로 줄여 가로 중앙에 두고, 링 매트의 한가운데(원본 y=808)가 캐릭터 발 위치(GY)에 오도록 세로 위치를 맞춘다.
   이렇게 하면 좌우 코너 패드가 캐릭터 이동 범위(x 100~860) 끝에 맞닿고, 좌우로 30px씩 여유가 있어 가장 센 화면 흔들림(±21px)에도 가장자리가 비지 않는다. */
const BG = { scale: .72, feetY: 808, canvas: null };
const TB = { img: null };                                  // 메인 화면 배경 (title-bg.jpg, 16:9 전체 화면 그림)

/* ---------- 캐릭터 스프라이트 ----------
   몸 그림(spr-*.png)은 원본 그림에서 팔·글러브만 지운 것이고(원본의 절반 크기로 저장), 팔과 글러브는 코드가 그려서 펀치 동작을 만든다.
   좌표는 모두 '원본 그림 픽셀' 기준: ax = 두 발 사이 가운데 x, gy = 발바닥 y, mirror = 그림이 왼쪽을 보고 있음 (게임 안에서는 앞쪽이 항상 +x).
   shF = 앞팔 어깨(몸 앞에 보이는 쪽), shB = 뒷팔 어깨(몸 뒤에 가려지는 쪽), upper/fore = 위팔·팔뚝 길이, armW = 팔 굵기 배율.
   idle / guard = 평소 / 가드(S) 자세의 글러브 위치. 이 값으로 각 캐릭터의 look.lead/rear/guard 를 정한다 (그림 전용, 판정과 무관).
   인파이터 = 원본 그림 그대로의 자세 / 아웃파이터 = 마르고 긴 몸에 앞손을 살짝 굽혀 내민 자세 / 슬러거 = 어깨를 끌어올린 두꺼운 몸
   tall = 그림을 세로로 늘인 배율 (펀치 높이를 그만큼 맞춘다) */
const SPR = {
  out:  { w:768, h:866, ax:392, gy:832, mirror:false, shF:{ x:415, y:235 }, shB:{ x:392, y:210 }, upper:140, fore:196, armW:.74, tall:1.14,  // 오른쪽을 봄. 몸을 가로 .82배·세로 1.14배로 늘인 날렵한 체형, 가늘고 긴 팔 (얼굴은 인파이터와 같은 맨머리)
          idle:{ lead:{ x:666, y:265 }, rear:{ x:616, y:247 } }, guard:{ lead:{ x:638, y:177 }, rear:{ x:616, y:215 } }, img:{} },   // 앞손을 앞으로 내밀되 팔꿈치는 살짝 굽힌 자세
  in:   { w:760, h:773, ax:378, gy:748, mirror:true,  shF:{ x:392, y:228 }, shB:{ x:428, y:206 }, upper:110, fore:150, armW:1.18,  // 맨머리, 왼쪽을 봄. 짧고 굵은 팔
          idle:{ lead:{ x:190, y:215 }, rear:{ x:262, y:222 } }, guard:{ lead:{ x:196, y:160 }, rear:{ x:254, y:176 } }, img:{} },   // 피커부: 두 글러브를 양 볼에 붙이고 눈만 내놓는다 (가드 때는 얼굴을 다 가림)
  slug: { w:760, h:773, ax:378, gy:748, mirror:true,  shF:{ x:348, y:262 }, shB:{ x:440, y:196 }, upper:140, fore:186, armW:1.3,   // 인파이터 그림 + 끌어올린 어깨, 머리를 어깨 사이에 묻음
          idle:{ lead:{ x:132, y:252 }, rear:{ x:236, y:262 } }, guard:{ lead:{ x:166, y:178 }, rear:{ x:216, y:212 } }, img:{} }
};
const SPR_SC = .245;                                       // 원본 그림 1px = 게임 0.245px (키 약 177px — 판정 거리에 맞춘 크기)
const SPR_VY = SPR_SC/.3;                                  // 펀치 경로·타격 이펙트의 '높이'를 몸 크기에 맞춰 줄이는 배율 (가로 위치 = 판정은 그대로)
const GLV = { img:{}, size:160, base:-.71 };               // 글러브 그림(원본 크기, 160x160, 가운데가 글러브 중심). base: 그림 속 팔뚝 방향(앞을 보게 뒤집은 뒤)
const SPR_COL = {                                          // 코드로 그리는 팔 색 (몸 그림과 같은 색)
  blue: { body:'#376cfd', shade:'#2245c4', wrap:'#0a1036', ol:'#050a20', glow:'rgba(40,100,255,.85)', stripe:'#4f84ff' },
  red:  { body:'#fc3252', shade:'#c01c3c', wrap:'#1c0712', ol:'#12030a', glow:'rgba(255,40,80,.85)', stripe:'#ff5a6e' }
};
(function(){
  const load = src => { const i = new Image(); i.src = src; return i; };
  for(const k in SPR) for(const c of ['blue', 'red']) SPR[k].img[c] = load(`spr-${k}-${c}.png`);   // 진영 색: 플레이어 파랑 / 상대 빨강
  for(const c of ['blue', 'red']) GLV.img[c] = load(`glove-${c}.png`);
  // 각 캐릭터의 평소/가드 글러브 위치(look)를 그림 좌표에서 게임 좌표로 옮겨 둔다 (공격 준비 동작이 이 위치에서 시작한다)
  for(const key of CHAR_KEYS){
    const L = CHARS[key].look, S = SPR[L.sprite], sc = SPR_SC*(L.sprS || 1);
    const loc = p => ({ x:Math.round((S.mirror ? S.ax - p.x : p.x - S.ax)*sc), y:Math.round((p.y - S.gy)*sc) });
    L.lead = loc(S.idle.lead); L.rear = loc(S.idle.rear); L.guard.lead = loc(S.guard.lead); L.guard.rear = loc(S.guard.rear);
  }
})();
const imgReady = i => i && i.complete && i.naturalWidth > 0;
const sprOn = f => { const S = SPR[f.cd.look.sprite]; return !!S && imgReady(S.img[f.player ? 'blue' : 'red']) && imgReady(GLV.img[f.player ? 'blue' : 'red']); };
const sprVY = f => sprOn(f) ? SPR_VY*(f.cd.look.sprS || 1)*(SPR[f.cd.look.sprite].tall || 1) : 1;   // 스프라이트 키에 맞춘 높이 배율 (그림 전용)
(function(){
  const t = new Image();
  t.onload = () => { TB.img = t; };
  t.src = 'title-bg.jpg';
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth*BG.scale); c.height = Math.round(img.naturalHeight*BG.scale);
    const g = c.getContext('2d'); g.imageSmoothingQuality = 'high'; g.drawImage(img, 0, 0, c.width, c.height);
    BG.canvas = c;
  };
  img.src = 'ring-bg.webp';
})();

/* ---------- 그리기 ---------- */
const lerp = (a,b,u) => a + (b-a)*u;
const easeIn = u => u*u, easeOut = u => 1 - (1-u)*(1-u);

/* ---------- 글러브 (블루: 플레이어 / 레드: 상대) ---------- */
const GLOVE = {
  blue: { main:'#4f84ff', shade:'#3a67e0', dark:'#2b4fb8', light:'#9bb8ff', trim:'#5b8dff' },
  red:  { main:'#ff5a5f', shade:'#d2414a', dark:'#a8323a', light:'#ffa3a6', trim:'#ff6b70' }
};
function rrPath(x, y, w, h, r){
  ctx.beginPath(); ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath();
}
// (x,y)=주먹 중심, ang=팔 방향. 로컬 +x가 팔이 뻗는 방향이라 어떤 자세에서도 손목→주먹 방향으로 자연스럽게 회전한다
const GLOVE_CFG = { scale: 1.1, tilt: -.75 };   // scale: 글러브 크기, tilt: 팔을 접었을 때 글러브가 위로 기울어지는 각도
function drawGlove(x, y, ang, th, flash, back, sMul){
  const main = flash ? '#ffffff' : back ? th.shade : th.main;
  const shade = flash ? '#d4d4de' : back ? th.dark : th.shade;
  const gs = GLOVE_CFG.scale*(sMul || 1);                  // 캐릭터별 글러브 크기 (슬러거는 조금 더 크다)
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.scale(gs, gs);
  // 손목 스트랩: 검정 + 포인트 라인
  ctx.fillStyle = '#12121a'; ctx.strokeStyle = flash ? '#fff' : th.trim; ctx.lineWidth = 2;
  rrPath(-29, -11, 18, 22, 4); ctx.fill(); ctx.stroke();
  // 주먹 본체
  ctx.fillStyle = main; ctx.strokeStyle = COL.bg; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.ellipse(0, 0, 18, 15.5, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  // 엄지(아래쪽)
  ctx.fillStyle = shade; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(5, 10.5, 9, 5.5, -.25, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  // 하이라이트
  ctx.globalAlpha = .45; ctx.fillStyle = flash ? '#fff' : th.light;
  ctx.beginPath(); ctx.ellipse(1, -7.5, 9, 3.6, -.15, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha = 1;
  // 로고(흰 사선 두 줄)
  ctx.fillStyle = 'rgba(255,255,255,.92)';
  ctx.beginPath(); ctx.moveTo(-6, 1); ctx.lineTo(-2, -6); ctx.lineTo(2, -6); ctx.lineTo(-2, 1); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(1, 4); ctx.lineTo(5, -3); ctx.lineTo(9, -3); ctx.lineTo(5, 4); ctx.closePath(); ctx.fill();
  ctx.restore();
}

/* ---------- 스프라이트 캐릭터 그리기 ----------
   P: drawFighter 가 계산한 자세 값 (lean/crouch/headSnap/bob, 글러브 위치 lead/rear). 그림이 아직 안 불러와졌으면 false (예전 도형 그리기로 대신)
   - 몸: 기울기(lean)는 발을 땅에 붙인 채 위쪽만 앞뒤로 미는 기울임, 웅크림(crouch)은 위아래로 살짝 눌림. 평소 자세(look.lean/crouch)일 때 원본 그림 그대로
   - 팔: 어깨 → 팔꿈치(아래로 굽음) → 손목. 위팔은 몸 색, 팔뚝은 원본처럼 검은 손목 밴드, 끝에 글러브 그림
     뒷팔은 몸 뒤쪽 어깨(shB)에서 나와 몸에 가려지고, 앞팔만 몸 앞쪽 어깨(shF)에서 몸 위로 그려진다 (두 팔이 한 어깨에 붙어 보이지 않게)
   - 펀치 중인 글러브는 판정과 같은 가로 위치(punchGeom 경로)에 그대로 그린다. 나머지 글러브는 몸을 따라 움직인다 */
function drawSpriteFighter(f, P){
  if(!sprOn(f)){
    // 아직 불러오는 중이면 잠깐 그리지 않는다 (느린 접속에서 예전 도형 캐릭터가 번쩍 보이지 않게). 불러오기에 실패했을 때만 예전 도형으로 대신
    const S = SPR[f.cd.look.sprite], side = f.player ? 'blue' : 'red', bad = i => !i || (i.complete && i.naturalWidth === 0);
    return !(S && !bad(S.img[side]) && !bad(GLV.img[side]));
  }
  const L = f.cd.look, S = SPR[L.sprite], side = f.player ? 'blue' : 'red';
  const img = S.img[side], gimg = GLV.img[side], C = SPR_COL[side];
  const sc = SPR_SC*(L.sprS || 1), m = sc/.3, flash = f.flash > 0, FLASH = 'brightness(2.2) saturate(0)';
  const c = Math.max(-4, P.crouch - L.crouch);
  // 몸 기울기: 공격 중에는 더 크게 (준비 때 뒤로 젖혔다가 칠 때 앞으로 크게 내딛는 느낌) — 그림만 바뀐다
  const k = (P.lean - L.lean)*(f.state === 'attack' ? .014 : .009) + P.headSnap*.004;
  const sx = 1 + c*.002, sy = (1 - c*.0045)*(1 + P.bob*.004);
  const T = p => ({ x:p.x*sx - k*p.y*sy, y:p.y*sy });
  const loc = p => ({ x:(S.mirror ? S.ax - p.x : p.x - S.ax)*sc, y:(p.y - S.gy)*sc });
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;

  // 글러브 위치: 펀치 중인 손은 계산된 경로 그대로, 그 밖에는 상태별 자세를 몸의 움직임에 맞춰 옮긴다
  let gl = { x:P.lead.x, y:P.lead.y }, gr = { x:P.rear.x, y:P.rear.y };
  if(f.state === 'hit'){ gl = { x:L.lead.x - 14*m, y:L.lead.y + 12*m }; gr = { x:L.rear.x - 12*m, y:L.rear.y + 14*m }; }      // 맞으면 가드가 흐트러진다
  else if(f.state === 'ko'){ gl = { x:L.lead.x - 24*m, y:L.lead.y + 32*m }; gr = { x:L.rear.x - 20*m, y:L.rear.y + 34*m }; }   // 팔이 풀린다
  else if(f.state === 'dodge' || f.state === 'pivot'){ gl = { x:L.guard.lead.x, y:L.guard.lead.y }; gr = { x:L.guard.rear.x, y:L.guard.rear.y }; }   // 피할 때(피벗 포함)는 얼굴을 가린다
  const punch = f.state === 'attack' ? f.atk.glove : null;
  if(punch !== 'lead') gl = T(gl);
  if(punch !== 'rear') gr = T(gr);
  const shF = T(loc(S.shF)), shB = T(loc(S.shB));

  const line = (a, b) => { ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); };
  // 펀치를 뻗는 동안(active)의 글러브 크기 강조: 가운데에서 최대 1.22배
  const atkK = f.state === 'attack' ? f.atk : null, actU = atkK ? (f.t - atkK.windup)/atkK.active : -1;
  const pop = actU >= 0 && actU <= 1.4 ? 1 + .22*Math.sin(Math.PI*Math.min(1, actU/1.4)) : 1;
  let pg = null;
  const arm = (g, back) => {
    const a = back ? shB : shF, l1 = S.upper*sc, l2 = S.fore*sc;
    // 2관절 IK: 팔꿈치는 어깨-글러브를 잇는 선의 아래쪽으로 굽는다 (팔을 다 뻗으면 일직선)
    const dx = g.x - a.x, dy = g.y - a.y, d = Math.hypot(dx, dy) || 1, ux = dx/d, uy = dy/d;
    let e;
    if(d >= l1 + l2) e = { x:a.x + dx*l1/(l1 + l2), y:a.y + dy*l1/(l1 + l2) };
    else { const t = (l1*l1 - l2*l2 + d*d)/(2*d), h = Math.sqrt(Math.max(0, l1*l1 - t*t)); e = { x:a.x + ux*t - uy*h, y:a.y + uy*t + ux*h }; }
    const fx = g.x - e.x, fy = g.y - e.y, fl = Math.hypot(fx, fy) || 1, ang = Math.atan2(fy, fx);
    const wb = Math.min(50*sc*L.gloveS, fl*.8), w = { x:g.x - fx/fl*wb, y:g.y - fy/fl*wb };
    const uw = 52*sc*S.armW, fw = 44*sc*S.armW, ow = 4.2;
    const seg = (p, q, wid, col, gloss) => {           // 외곽선(+네온 빛) → 색 → 광택 한 마디
      ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      if(!flash){ ctx.shadowColor = C.glow; ctx.shadowBlur = 9; }
      ctx.strokeStyle = C.ol; ctx.lineWidth = wid + ow; line(p, q);
      ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
      ctx.strokeStyle = flash ? '#fff' : col; ctx.lineWidth = wid; line(p, q);
      if(gloss && !flash){ ctx.strokeStyle = 'rgba(255,255,255,.32)'; ctx.lineWidth = wid*.22; line({ x:p.x, y:p.y - wid*.26 }, { x:q.x, y:q.y - wid*.26 }); }
      ctx.restore();
    };
    return {
      upper: () => seg(a, e, uw, back ? C.shade : C.body, !back),       // 위팔 (뒷팔은 그늘이라 어둡게)
      fore: () => {                                                      // 팔뚝: 검은 손목 밴드 + 팀 색 줄
        seg(e, w, fw, C.wrap, false);
        if(flash) return;
        const mm = { x:lerp(e.x, w.x, .6), y:lerp(e.y, w.y, .6) }, nx = -fy/fl*fw*.5, ny = fx/fl*fw*.5;
        ctx.save(); ctx.strokeStyle = C.stripe; ctx.lineWidth = 1.8; line({ x:mm.x - nx, y:mm.y - ny }, { x:mm.x + nx, y:mm.y + ny }); ctx.restore();
      },
      glove: () => {                                                     // 글러브 그림: 원본은 왼쪽을 보고 있으므로 뒤집은 뒤, 팔뚝 방향에 맞춰 돌린다
        ctx.save(); ctx.translate(g.x, g.y); ctx.rotate(ang - GLV.base); ctx.scale(-1, 1);
        if(flash) ctx.filter = FLASH; else { if(back) ctx.filter = 'brightness(.82)'; ctx.shadowColor = C.glow; ctx.shadowBlur = 10; }
        const gs = GLV.size*sc*L.gloveS*(g === pg ? pop : 1);   // 뻗는 순간의 글러브는 살짝 커진다 (타격 순간 강조)
        ctx.drawImage(gimg, -gs/2, -gs/2, gs, gs);
        ctx.restore();
      }
    };
  };

  // 뒷팔: 뒤쪽 어깨에서 나와 몸통에 가려진다. 뒷손으로 펀치를 내는 동안에만 팔뚝을 몸 앞으로 꺼내 글러브와 이어 보이게 한다
  pg = punch === 'lead' ? gl : punch === 'rear' ? gr : null;
  const R = arm(gr, true), F = arm(gl, false), rearOut = punch === 'rear';
  R.upper(); if(!rearOut) R.fore();                    // 1) 뒷팔 (몸 뒤)

  ctx.save();                                          // 2) 몸
  ctx.transform(1, 0, -k, 1, 0, 0); ctx.scale(sx, sy);
  if(S.mirror) ctx.scale(-1, 1);
  if(flash) ctx.filter = FLASH;
  ctx.drawImage(img, -S.ax*sc, -S.gy*sc, S.w*sc, S.h*sc);
  ctx.restore();

  if(rearOut) R.fore();                                // 3) 뒷손 글러브는 원본 그림처럼 몸 앞에
  R.glove();
  F.upper(); F.fore(); F.glove();                      // 4) 앞팔 + 앞손 글러브: 몸 앞
  return true;
}

/* ---------- 펀치 궤적 ----------
   주먹이 나가는 동안(active 구간) 글러브의 실제 위치를 매 프레임 기록해서, 그 점들을 이은 짧고 날렵한 잔상을 그린다.
   그래서 궤적은 공격 모션(곧게 뻗는 잽/스트레이트, 아래에서 위로 휘는 어퍼컷)을 그대로 따라가고, 0.08~0.14초 만에 사라진다.
   중심은 밝은 흰색, 바깥은 공격별 색: 잽=얇은 파랑 / 스트레이트=흰색+파랑 / 어퍼컷(휘는 공격)=굵은 빨강 / 카운터·스킬=굵은 금빛.
   기록은 파이터 객체(f.trail)에 따로 저장되어 서로 간섭하지 않고, 수명이 지나면 지워진다 (최대 길이도 제한). */
// 색: 일반 공격은 주인의 색(파란 캐릭터=파랑, 빨간 캐릭터=빨강, outer:null), 카운터와 스킬은 둘 다 똑같이 노란빛. 공격 종류는 굵기로 구분한다
const TRAIL = {
  jab:      { life:.085, w:14, core:4,    outer:null,      glow:.12 },
  straight: { life:.10,  w:22, core:7.5,  outer:null,      glow:.28 },
  uppercut: { life:.11,  w:29, core:9.5,  outer:null,      glow:.36 },     // 휘는 궤적에 가장 굵게
  hook:     { life:.11,  w:27, core:9,    outer:null,      glow:.34 },     // 인파이터의 훅: 호를 그리며 굵게
  body:     { life:.09,  w:19, core:6.5,  outer:null,      glow:.2 },      // 인파이터의 바디: 낮은 높이로 찌르는 짧은 궤적
  counter:  { life:.12,  w:33, core:11,   outer:'#ffc94d', glow:.45 },     // 카운터 기회를 잡고 낸 공격
  skill:    { life:.15,  w:42, core:14,   outer:'#ffc94d', glow:.55 }      // 카운터 스킬
};
function pushTrail(f, x, y, style){
  const T = f.trail, now = game.t, last = T[T.length - 1];
  if(last && Math.hypot(x - last.x, y - last.y) < .5) return;        // 히트스톱 중처럼 제자리면 점을 늘리지 않는다
  if(last && now - last.t < .08){                                     // 프레임 사이가 벌어졌으면 사이를 채워 부드럽게 이어 준다
    const d = Math.hypot(x - last.x, y - last.y), n = Math.min(6, Math.floor(d/12));
    for(let i = 1; i <= n; i++){ const u = i/(n + 1); T.push({ x:lerp(last.x, x, u), y:lerp(last.y, y, u), t:lerp(last.t, now, u), s:style }); }
  }
  T.push({ x, y, t:now, s:style });
  while(T.length && now - T[0].t > .2) T.shift();                     // 오래된 점은 버린다
  while(T.length > 40) T.shift();
}
function drawTrail(f){
  const T = f.trail, now = game.t;
  while(T.length && now - T[0].t > .2) T.shift();
  if(T.length < 2) return;
  const S = TRAIL[T[T.length - 1].s] || TRAIL.jab;
  const outer = S.outer || (f.player ? '#3d8bff' : '#ff3d4b');                  // 파란 캐릭터는 파란 불빛, 빨간 캐릭터는 빨간 불빛
  let pts = T.filter(p => now - p.t < S.life).map(p => ({ x:(p.x - f.x)*f.face, y:p.y - GY + f.z, t:p.t }));   // 월드 → 이 파이터의 좌우 반전/높이가 적용된 좌표
  if(pts.length < 2) return;
  let rem = 17;                                                                   // 글러브 중심에서 17px 뒤(글러브 둘레 근처)에서 시작해 글러브를 가리지 않는다
  while(rem > 0 && pts.length > 1){
    const p = pts[pts.length - 1], q = pts[pts.length - 2], d = Math.hypot(p.x - q.x, p.y - q.y);
    if(d <= rem){ rem -= d; pts.pop(); } else { const u = rem/d; pts[pts.length - 1] = { x:p.x + (q.x - p.x)*u, y:p.y + (q.y - p.y)*u, t:p.t }; rem = 0; }
  }
  if(pts.length < 2) return;
  ctx.save();
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.globalCompositeOperation = 'lighter';
  for(let pass = 0; pass < 2; pass++){                                            // 0: 바깥 색 빛 / 1: 밝은 흰색 중심
    for(let i = 1; i < pts.length; i++){
      const a = pts[i - 1], b = pts[i], fresh = Math.max(0, 1 - (now - b.t)/S.life), pos = i/(pts.length - 1);
      if(fresh <= 0) continue;
      const k = Math.pow(fresh, .7)*pos;                                          // 최신(글러브 쪽)일수록 굵고 진하고, 꼬리로 갈수록 가늘어지며 사라진다
      ctx.globalAlpha = (pass ? .95 : .6)*Math.min(1, k*1.4);
      ctx.strokeStyle = pass ? '#ffffff' : outer;
      ctx.lineWidth = Math.max(.8, (pass ? S.core : S.w)*k);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
  }
  if(S.glow){                                                                     // 주먹 둘레의 은은한 빛 (밝게 번쩍이지 않도록 작고 약하게)
    const h = T[T.length - 1], fr = Math.max(0, 1 - (now - h.t)/S.life);
    if(fr > 0){
      const hx = (h.x - f.x)*f.face, hy = h.y - GY + f.z, R = S.w*1.7;
      const gr = ctx.createRadialGradient(hx, hy, 0, hx, hy, R);
      gr.addColorStop(0, 'rgba(255,255,255,' + (S.glow*fr) + ')'); gr.addColorStop(.45, outer + '55'); gr.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.globalAlpha = 1; ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(hx, hy, R, 0, Math.PI*2); ctx.fill();
    }
  }
  ctx.restore();
}

function drawFighter(f){
  const base = f.player ? '#5185ff' : COL.red;          // 블루는 참고 이미지에서 측정한 색, 빨강은 같은 형태를 좌우 반전(face=-1)한 상대
  const col = f.flash > 0 ? '#fff' : base;
  ctx.save();
  ctx.translate(f.x, GY); ctx.scale(f.face, 1);

  // 그림자
  ctx.fillStyle = 'rgba(0,0,0,.4)';
  const sh0 = Math.max(.4, 1 - f.z/260);
  ctx.beginPath(); ctx.ellipse(-3, 2, 78*sh0, 7*sh0, 0, 0, Math.PI*2); ctx.fill();    // 스프라이트의 넓은 보폭에 맞춘 폭

  // 배경이 밝은 링/조명 위에서도 캐릭터 윤곽이 묻히지 않도록 은은한 어두운 테두리 그림자
  ctx.shadowColor = 'rgba(0,0,10,.6)'; ctx.shadowBlur = 9;

  // 코너 탈출(피벗): 몸을 팽이처럼 돌려 세운다 (가운데에서 가장 얇게 — 이때 방향이 바뀐다). 살짝 떠올랐다 내려앉는다
  if(f.state === 'pivot'){
    const pu = Math.min(1, f.t/PIVOT.t);
    ctx.scale(Math.max(.24, Math.abs(Math.cos(Math.PI*pu))), 1);
    ctx.translate(0, -9*Math.sin(Math.PI*pu));
  }
  // 공중에 뜬 높이 / 피격 찌그러짐 / 히트스톱 중 떨림
  ctx.translate(0, -f.z);
  if(f.squash > 0){ ctx.scale(1 - .14*f.squash, 1 + .1*f.squash); }
  if(game.freeze > 0 && f.state === 'hit') ctx.translate((Math.random()-.5)*7, (Math.random()-.5)*4);

  // 캐릭터별 외형(CHARS[..].look). 아웃파이터는 참고 이미지 그대로: 머리가 몸통보다 앞으로 나오고, 글러브 두 개가 턱 높이에 붙어 있다
  const L = f.cd.look;
  let lean = L.lean, crouch = 0, headSnap = 0, lead = { x:L.lead.x, y:L.lead.y }, rear = { x:L.rear.x, y:L.rear.y };
  const bob = Math.sin(f.bob)*2.2;
  const guarding = f.state === 'idle' && f.ctrl.guard;
  let trail = null;

  if(guarding){ const G = L.guard; lean = G.lean; crouch = G.crouch; lead = { x:G.lead.x, y:G.lead.y }; rear = { x:G.rear.x, y:G.rear.y }; }
  if(f.state === 'attack'){
    const k = f.atk, w = k.windup, e = w + k.active;
    const idle = k.glove === 'lead' ? lead : rear;
    const up = k.style === 'up', sk = k.style === 'skill', hk = k.style === 'hook', bd = k.style === 'body';
    // 어퍼컷은 아래에서 위로 쓸어올리고, 훅은 옆에서 휘둘러 호를 그리고, 바디는 낮게 복부로 찌르고, 스킬은 크게 뒤로 당겼다가 내지른다
    // 스프라이트일 때는 몸이 작아진 만큼 경로의 '높이'만 줄인다. 가로 위치는 판정(gloveTouches)과 같은 값 그대로
    const pg = punchGeom(k), vy = sprVY(f);
    const pull = { x:pg.pull.x, y:pg.pull.y*vy }, ext = { x:pg.ext.x, y:pg.ext.y*vy };
    const wl = 1.5*(k.windLean !== undefined ? k.windLean : (sk ? -16 : hk ? -12 : -6));  // 준비 동작에서 몸을 뒤로 젖히는 정도 (펀치가 잘 보이도록 크게)
    let g, cr = 2;
    if(f.t < w){
      // 준비 동작: 주먹을 출발점(pull)보다 한 번 더 깊이 뒤로 당겼다가(deep) 출발점으로 — 펀치가 나온다는 신호를 크게 보여준다.
      // 그리는 위치만 바뀌고, 준비가 끝나는 순간에는 정확히 pull 에 있으므로 판정 경로(pull → ext)는 그대로
      const t0 = f.t/w, u = easeIn(t0), deep = { x:pull.x - 24, y:pull.y + 12*vy };
      g = t0 < .7 ? { x:lerp(idle.x, deep.x, easeOut(t0/.7)), y:lerp(idle.y, deep.y, easeOut(t0/.7)) }
                  : { x:lerp(deep.x, pull.x, (t0 - .7)/.3), y:lerp(deep.y, pull.y, (t0 - .7)/.3) };
      lean = L.lean*(1-u) + wl*u; cr = up ? 2 + 18*u : sk ? 2 + 8*u : bd ? 2 + 16*u : hk ? 2 + 5*u : 2;
      if(sk){ ctx.strokeStyle = COL.gold; ctx.globalAlpha = .5*u; ctx.lineWidth = 3;   // 기 모으는 오라
        ctx.beginPath(); ctx.arc(0, -110*vy, 40 + 60*(1-u), 0, Math.PI*2); ctx.stroke(); ctx.globalAlpha = 1; }
    }
    else if(f.t < e){
      const u = easeOut((f.t-w)/k.active); g = { x:lerp(pull.x,ext.x,u), y:lerp(pull.y,ext.y,u) };
      if(hk) g.y -= 24*vy*Math.sin(Math.PI*u);                                              // 훅: 가운데에서 가장 높이 올라갔다 내려오는 호
      lean = lerp(wl, k.lean, u); cr = up ? lerp(20, -8, u) : bd ? lerp(18, 6, u) : hk ? lerp(7, 0, u) : 2;
      // 궤적 종류: 스킬 > (카운터 기회를 잡고 낸 공격) > 공격 종류. 이 구간의 글러브 위치를 기록해 둔다
      trail = { g, style: sk ? 'skill' : f.counterAtk ? 'counter' : up ? 'uppercut' : k.name };
    }
    else {
      const u = (f.t-e)/k.recover, s = u*u*(3-2*u); g = { x:lerp(ext.x,idle.x,s), y:lerp(ext.y,idle.y,s) };
      lean = lerp(k.lean, L.lean, s); cr = up ? lerp(-8, 2, s) : bd ? lerp(6, 2, s) : 2;
    }
    if(k.glove === 'lead') lead = g; else rear = g;
    crouch = cr;
  }
  if(f.state === 'dodge'){
    const u = Math.sin(Math.PI*Math.min(1, f.t/.34)), dk = f.cd.dodge;
    if(dk === 'back'){ lean = -40*u; crouch = 18*u; lead = { x:30 - 12*u, y:-170 }; rear = { x:16, y:-160 }; }        // 아웃파이터: 몸을 뒤로 젖히며 물러남
    else if(dk === 'dash'){ lean = L.lean + 22*u; crouch = 34*u; lead = { x:42, y:-150 + 8*u }; rear = { x:28, y:-146 + 8*u }; headSnap = 8*u; }   // 인파이터: 머리를 숙이고 앞으로 파고듦
    else { lean = L.lean - 6*u; crouch = 40*u; lead = { x:30, y:-168 + 22*u }; rear = { x:18, y:-160 + 22*u }; }       // 슬러거: 제자리에서 그냥 숙임
  }
  if(f.state === 'pivot'){                                           // 가드를 올린 채 낮게 웅크려 돌아 나온다
    const pu = Math.sin(Math.PI*Math.min(1, f.t/PIVOT.t));
    lean = L.lean + 8*pu; crouch = 22*pu; lead = { x:L.guard.lead.x, y:L.guard.lead.y }; rear = { x:L.guard.rear.x, y:L.guard.rear.y };
  }
  if(f.state === 'hit'){
    // 맞은 세기(hitPow)에 따라 몸이 젖혀지는 정도가 다르고, 맞은 직후 0.12초 동안 고개가 한 번 더 꺾였다가 돌아온다. 바디 블로우는 몸이 앞으로 접힌다
    const u = Math.max(0, 1 - f.t/f.stun), pw = f.hitPow, sn = Math.max(0, 1 - f.t/.12);
    if(f.hitKind === 'body'){ lean = (12 + 12*pw)*u + 6*pw*sn; crouch = (10 + 10*pw)*u; headSnap = 8*pw*sn; }
    else { lean = -(10 + 16*pw)*u - 8*pw*sn; crouch = (2 + 4*pw)*u; headSnap = -9*pw*sn; }
    crouch += L.crouch*u;                                            // 낮은 자세(인파이터)는 경직이 풀리면서 천천히 원래 높이로 돌아간다
    lead = { x:22, y:-128 }; rear = { x:8, y:-124 };
  }
  if(f.state === 'ko'){
    const u = Math.min(1, f.t*2.2);
    ctx.rotate(-u*1.4); lean = -20; lead = { x:20, y:-120 }; rear = { x:6, y:-116 };
  }
  if(f.state !== 'ko' && f.state !== 'hit') crouch += L.crouch;       // 인파이터의 낮은 자세 (피격·KO 연출은 건드리지 않는다)

  if(trail) pushTrail(f, f.x + f.face*trail.g.x, GY - f.z + trail.g.y, trail.style);   // 글러브의 월드 좌표를 기록 (이펙트가 글러브에 그대로 연결된다)

  // 캐릭터 스프라이트 (그림을 불러오기 전에는 아래의 도형 그리기를 쓴다)
  if(drawSpriteFighter(f, { lean, crouch, headSnap, bob, lead, rear })){ drawTrail(f); ctx.restore(); return; }

  // 참고 이미지 실측 비율(0.88배): 어깨 y≈-153, 골반 y≈-96, 머리 중심 (몸통보다 +13 앞, y≈-191), 머리 반지름 21
  const hip = { x:0, y:-96 + crouch*.4 }, sh = { x:lean*.7 - 7, y:-153 + crouch + bob*.4 }, head = { x:lean + 8 + headSnap, y:-191 + crouch + bob*.6 };
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  const theme = f.player ? GLOVE.blue : GLOVE.red;
  const arm = g => {
    const dx = g.x - sh.x, dy = g.y - sh.y, dist = Math.hypot(dx, dy), ang0 = Math.atan2(dy, dx);
    // ext: 0 = 팔을 접어 글러브만 보이는 가드 자세(이미지처럼 위로 기울어진 글러브), 1 = 팔을 쭉 뻗은 펀치
    const ext = Math.max(0, Math.min(1, (dist - L.armTh)/20));
    const ang = lerp(GLOVE_CFG.tilt, ang0, ext);
    if(ext > 0){
      ctx.strokeStyle = col; ctx.lineWidth = L.armW*ext;
      ctx.beginPath(); ctx.moveTo(sh.x, sh.y); ctx.lineTo(g.x - Math.cos(ang0)*16, g.y - Math.sin(ang0)*16); ctx.stroke();
    }
    drawGlove(g.x, g.y, ang, theme, f.flash > 0, false, L.gloveS);
  };

  // 뒷팔 → 다리 → 몸통 → 머리 → 앞팔
  arm(rear);
  // 다리: 이미지처럼 뒷다리는 뒤로, 앞다리는 앞으로 벌린 역V 자세 + 작은 발 (낮은 자세일수록 더 넓게 벌어진다)
  ctx.strokeStyle = col; ctx.lineWidth = L.legW;
  const bf = -52 - crouch*.5, ff = 46 + crouch*.5, ly = hip.y + 14;
  ctx.beginPath(); ctx.moveTo(hip.x - 6, ly); ctx.lineTo(bf, -4); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(hip.x + 22, ly); ctx.lineTo(ff, -4); ctx.stroke();
  ctx.lineWidth = 10;
  ctx.beginPath(); ctx.moveTo(bf, -3); ctx.lineTo(bf + 8, -3); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ff, -3); ctx.lineTo(ff + 9, -3); ctx.stroke();
  // 몸통: 어깨(shR)는 좁고 골반(hipR)은 넓은 둥근 테이퍼형. 인파이터·슬러거는 더 두껍다
  ctx.fillStyle = col;
  const tdx = sh.x - hip.x, tdy = sh.y - hip.y, tl = Math.hypot(tdx, tdy) || 1, tnx = -tdy/tl, tny = tdx/tl;
  ctx.beginPath();
  ctx.moveTo(hip.x + tnx*L.hipR, hip.y + tny*L.hipR); ctx.lineTo(sh.x + tnx*L.shR, sh.y + tny*L.shR);
  ctx.lineTo(sh.x - tnx*L.shR, sh.y - tny*L.shR); ctx.lineTo(hip.x - tnx*L.hipR, hip.y - tny*L.hipR); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.arc(hip.x, hip.y, L.hipR, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(sh.x, sh.y, L.shR, 0, Math.PI*2); ctx.fill();
  if(L.neck){                                           // 슬러거: 목의 경계가 없다 — 어깨(승모근)에서 머리까지 하나로 이어진 굵은 목
    ctx.beginPath();
    ctx.moveTo(sh.x - L.shR*1.15, sh.y + 2); ctx.lineTo(head.x - L.headR*.8, head.y + 6);
    ctx.lineTo(head.x + L.headR*.8, head.y + 6); ctx.lineTo(sh.x + L.shR*1.15, sh.y + 2); ctx.closePath(); ctx.fill();
  }
  ctx.beginPath(); ctx.arc(head.x, head.y, L.headR, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = COL.bg; ctx.beginPath(); ctx.arc(head.x + L.headR*.52, head.y + 2, 4.4, 0, Math.PI*2); ctx.fill();
  arm(lead);
  drawTrail(f);                                        // 펀치 궤적: 팔 위에, 글러브 가장자리 뒤에서 시작하므로 글러브를 가리지 않는다
  ctx.restore();
}

function txt(s, x, y, size, color, align='left', weight=400, spacing=0){
  ctx.font = `${weight} ${size}px ${FONT}`; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if('letterSpacing' in ctx) ctx.letterSpacing = spacing + 'px';
  ctx.shadowColor = 'rgba(0,0,10,.8)'; ctx.shadowBlur = 6;           // 배경 위에서도 글자가 읽히도록
  ctx.fillText(s, x, y);
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
  if('letterSpacing' in ctx) ctx.letterSpacing = '0px';
}

function drawBar(x, w, y, h, f, right){
  const pct = Math.max(0, f.hp/f.maxhp), lagp = Math.max(0, f.lag/f.maxhp);
  ctx.fillStyle = 'rgba(255,255,255,.1)'; ctx.fillRect(x, y, w, h);
  const px = v => right ? x + w - w*v : x;
  ctx.fillStyle = COL.gold; ctx.fillRect(px(lagp), y, w*lagp, h);
  ctx.fillStyle = f.player ? COL.fg : COL.red; ctx.fillRect(px(pct), y, w*pct, h);
  // 가드 게이지 (0이 되면 붉게 깜빡이며 가드 불능)
  const gy = y + h + 5;
  ctx.fillStyle = 'rgba(255,255,255,.07)'; ctx.fillRect(x, gy, w, 4);
  const gp = Math.max(0, f.gd/100);
  ctx.fillStyle = f.gdBroken ? (Math.sin(game.t*20) > 0 ? COL.red : '#7a2d30') : '#8de0c4';
  ctx.fillRect(px(gp), gy, w*gp, 4);
  // 스태미나
  ctx.fillStyle = 'rgba(255,255,255,.07)'; ctx.fillRect(x, gy + 7, w, 3);
  ctx.fillStyle = f.st < 18 ? COL.red : COL.blue;
  const sp = f.st/100; ctx.fillRect(px(sp), gy + 7, w*sp, 3);
  // 카운터 게이지 (적중 시 충전, 가득 차면 카운터 스킬 사용 가능)
  const cy = gy + 14, cp = Math.min(1, f.cg/100), full = f.cg >= 100;
  ctx.fillStyle = 'rgba(255,255,255,.07)'; ctx.fillRect(x, cy, w, 5);
  ctx.fillStyle = full ? (Math.sin(game.t*14) > 0 ? '#fff' : COL.gold) : '#c9a227';
  ctx.fillRect(px(cp), cy, w*cp, 5);
}

function drawKeys(){
  const me = net.on && net.role === 'guest' ? E : P;
  const lb = me && me.cd ? me.cd.labels : CHARS.outfighter.labels;        // 선택한 캐릭터의 기술 이름 (인파이터는 바디/훅/어퍼컷)
  const items = [['A','D','이동'],['J',lb[0]],['K',lb[1]],['L',lb[2]],['U','카운터 스킬'],['S','가드'],['SPACE','회피'],['A/D','SPACE','코너 피벗']];
  ctx.font = `500 12px ${FONT}`;
  let total = 0; const widths = items.map(it => {
    const caps = it.slice(0,-1); let w = 0;
    caps.forEach(c => w += Math.max(24, ctx.measureText(c).width + 14) + 4);
    w += ctx.measureText(it[it.length-1]).width + 6;
    total += w + 22; return w;
  });
  let x = W/2 - (total-22)/2; const y = H - 30;
  items.forEach((it, i) => {
    const caps = it.slice(0,-1);
    caps.forEach(c => {
      const w = Math.max(24, ctx.measureText(c).width + 14);
      ctx.strokeStyle = COL.dim; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.roundRect(x, y-11, w, 22, 5); ctx.stroke();
      txt(c, x + w/2, y+.5, 12, '#c9c9d4', 'center', 600);
      x += w + 4;
    });
    txt(it[it.length-1], x + 2, y+.5, 12, COL.dim, 'left', 500);
    x += widths[i] - (widths[i] - 0) + ctx.measureText(it[it.length-1]).width + 6 + 22;
  });
}

function draw(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = COL.bg; ctx.fillRect(0,0,W,H);

  // 월드 (흔들림 + KO 줌)
  ctx.save();
  const sx = (Math.random()-.5)*game.shake, sy = (Math.random()-.5)*game.shake;
  const z = (game.state === 'ko' ? 1 + Math.min(.08, game.koT*.05) : 1) + game.kick;
  const cx = game.state === 'ko' ? (P.hp <= 0 ? P.x : E.x) : W/2;
  // 카메라는 쓰러진 쪽으로 쏠리되, 배경 이미지 밖(빈 공간)이 보이지 않도록 좌우 이동 범위를 제한한다 (흔들림 여유 22px 포함)
  let camX = lerp(W/2, cx, z > 1 ? .6 : 0);
  if(BG.canvas){
    const half = BG.canvas.width/2 - 22, lo = W/2 - half + W/(2*z), hi = W/2 + half - W/(2*z);
    camX = lo > hi ? W/2 : Math.max(lo, Math.min(hi, camX));
  }
  ctx.translate(W/2 + sx, GY-120 + sy); ctx.scale(z,z); ctx.translate(-camX, -(GY-120));

  // 배경: 링 이미지 (이미지가 없으면 예전의 단순한 링 선으로 대체)
  const titleArt = (game.state === 'title' || game.state === 'auth') && TB.img;       // 메인 화면은 그림 안에 두 선수가 이미 있으므로 캐릭터를 따로 그리지 않는다
  if(titleArt){
    ctx.drawImage(TB.img, 0, 0, W, H);
    const sg = ctx.createLinearGradient(0, 0, 372, 0);      // 왼쪽 열: 그림 속 글자/버튼을 지우고 HTML 메뉴가 올라갈 자리
    sg.addColorStop(0, '#060818'); sg.addColorStop(.88, '#060818'); sg.addColorStop(1, 'rgba(6,8,24,0)');
    ctx.fillStyle = sg; ctx.fillRect(0, 0, 372, H);
    if(game.state === 'title'){ ctx.fillStyle = '#080b1f'; ctx.beginPath(); ctx.roundRect(806, 10, 150, 46, 16); ctx.fill(); }   // 오른쪽 위 아이디 칩
    else { ctx.save(); ctx.filter = 'blur(7px)'; ctx.fillStyle = '#0a0c22'; ctx.beginPath(); ctx.roundRect(800, 6, 162, 54, 20); ctx.fill(); ctx.restore(); }   // 로그인 화면: 그림 속 예시 아이디 칩을 배경색으로 부드럽게 지운다
  } else if(BG.canvas){
    ctx.drawImage(BG.canvas, Math.round(W/2 - BG.canvas.width/2), Math.round(GY - BG.feetY*BG.scale));
  } else {
    ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.lineWidth = 2;
    [GY-250, GY-190, GY-130].forEach(y => { ctx.beginPath(); ctx.moveTo(60,y); ctx.lineTo(900,y); ctx.stroke(); });
    [60,900].forEach(x => { ctx.beginPath(); ctx.moveTo(x,GY-270); ctx.lineTo(x,GY); ctx.stroke(); });
    ctx.strokeStyle = '#272733'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0,GY+2); ctx.lineTo(W,GY+2); ctx.stroke();
  }

  if(titleArt){
    // (메인 화면: 그림만)
  } else if(game.state === 'charsel'){
    PV.forEach(drawFighter);                            // 캐릭터 선택 화면: 세 캐릭터를 나란히 세워 비교한다
  } else if(P && E){
    // 그리는 순서: 쓰러진 쪽 → 서 있는 쪽 → 펀치를 내는 쪽 (주먹이 상대 몸에 가려지지 않게 공격하는 캐릭터를 맨 위에)
    const layer = f => f.state === 'ko' ? 0 : (f.state === 'attack' || f.state === 'pivot') ? 2 : 1;     // 피벗으로 돌아 지나가는 쪽도 앞에 보이게
    const order = [P, E].sort((a,b) => layer(a) - layer(b));
    order.forEach(drawFighter);
  }

  // 코너 탈출 안내: 내가 코너에서 펀치가 닿는 거리에 몰려 있고 피벗을 쓸 수 있을 때만 머리 위에 깜빡이는 키 안내를 띄운다
  if(game.state === 'fight' && P && E){
    const me = net.on && net.role === 'guest' ? E : P, op = me === P ? E : P, pd = me.state === 'idle' ? pivotDir(me, op) : 0;
    if(pd && pivotReady(me, op)){
      ctx.globalAlpha = .8 + .2*Math.sin(game.t*9);
      txt((pd > 0 ? 'D ▶' : '◀ A') + '  +  SPACE   피벗', me.x, GY - 222, 14, '#ffe08a', 'center', 800, 2);
      ctx.globalAlpha = 1;
    }
  }
  // 링 이펙트
  rings.forEach(r => {
    const u = 1 - r.life/r.max;
    ctx.globalAlpha = (1-u)*.9; ctx.strokeStyle = r.color; ctx.lineWidth = (r.w || 3)*(1-u)+1;
    ctx.beginPath(); ctx.arc(r.x, r.y, lerp(r.r, r.R, easeOut(u)), 0, Math.PI*2); ctx.stroke();
  });
  // 스파크
  ctx.lineCap = 'round';
  parts.forEach(p => {
    ctx.globalAlpha = Math.max(0, p.life/p.max);
    if(p.dot){ ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill(); return; }
    ctx.strokeStyle = p.color; ctx.lineWidth = p.w || 3;
    const tk = p.k || .03; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx*tk, p.y - p.vy*tk); ctx.stroke();
  });
  // 충격 별(임팩트 프레임)
  stars.forEach(s => {
    const u = 1 - s.life/s.max, R = s.r*(.6 + .6*u);
    ctx.globalAlpha = 1 - u; ctx.fillStyle = '#fff';
    ctx.beginPath();
    for(let i=0;i<16;i++){
      const a = s.rot + i*Math.PI/8, rr = i%2 ? R*.3 : R;
      ctx[i ? 'lineTo' : 'moveTo'](s.x + Math.cos(a)*rr, s.y + Math.sin(a)*rr);
    }
    ctx.closePath(); ctx.fill();
  });
  ctx.globalAlpha = 1;
  texts.forEach(t => {
    const u = 1 - t.life/t.max, pop = u < .12 ? 1 + (1 - u/.12)*.5 : 1;
    ctx.globalAlpha = Math.min(1, t.life/(t.max*.4));
    txt(t.s, t.x, t.y, t.size*pop, t.color, 'center', 700, 1);
  });
  ctx.globalAlpha = 1;
  ctx.restore();

  // 상단 체력바/글자가 조명과 전광판 위에서도 읽히도록 위쪽을 살짝 어둡게
  if(BG.canvas && !titleArt && game.state !== 'ranking' && game.state !== 'charsel' && game.state !== 'stagesel'){
    if(game.state !== 'auth'){
      const tg = ctx.createLinearGradient(0, 0, 0, 135);
      tg.addColorStop(0, 'rgba(4,5,12,.72)'); tg.addColorStop(1, 'rgba(4,5,12,0)');
      ctx.fillStyle = tg; ctx.fillRect(0, 0, W, 135);
    }
    {                                      // 전투 중과 로그인 화면에선 가운데 전광판 로고를 어둡게 눌러서 STAGE 표시와 게이지가 겹쳐 보이지 않게 한다
      ctx.save(); ctx.translate(480, 72); ctx.scale(2.1, .75);          // 가장자리가 부드럽게 사라지는 타원형 어둡힘
      const rg = ctx.createRadialGradient(0, 0, 0, 0, 0, 110);
      rg.addColorStop(0, 'rgba(4,5,12,.97)'); rg.addColorStop(.62, 'rgba(4,5,12,.9)'); rg.addColorStop(1, 'rgba(4,5,12,0)');
      ctx.fillStyle = rg; ctx.fillRect(-120, -120, 240, 240); ctx.restore();
    }
  }

  // 충격 플래시
  if(game.flash > 0){ ctx.fillStyle = `rgba(255,255,255,${Math.min(.35, game.flash)})`; ctx.fillRect(0,0,W,H); }

  // HUD
  if(game.state !== 'title' && game.state !== 'auth' && game.state !== 'ranking' && game.state !== 'charsel' && game.state !== 'stagesel' && P && E){
    drawBar(40, 380, 36, 7, P, false);
    drawBar(W-40-380, 380, 36, 7, E, true);
    const meE = net.on && net.role === 'guest';                // 멀티플레이에서 손님은 오른쪽(E)을 조종한다
    if(net.on){
      txt(net.names[0] + '  ·  ' + P.cd.name + (meE ? '' : '  (YOU)'), 40, 20, 14, COL.fg, 'left', 700, 2);
      txt(net.names[1] + '  ·  ' + E.cd.name + (meE ? '  (YOU)' : ''), W-40, 20, 14, COL.red, 'right', 700, 2);
      txt('VS', W/2, 22, 13, COL.dim, 'center', 600, 5);
    } else {
      txt((game.user || 'YOU') + '  ·  ' + P.cd.name, 40, 20, 14, COL.fg, 'left', 700, 2);
      txt('CPU  LV ' + game.level + '  ·  ' + E.cd.name, W-40, 20, 14, COL.red, 'right', 700, 2);
      txt('STAGE ' + game.level, W/2, 22, 13, COL.dim, 'center', 600, 5);
    }
    if(P.cg >= 100) txt('COUNTER READY' + (meE ? '' : ' — U'), 40, 86, 13, Math.sin(game.t*14) > 0 ? '#fff' : COL.gold, 'left', 700, 2);
    if(E.cg >= 100) txt('COUNTER READY' + (meE ? ' — U' : ''), W-40, 86, 13, COL.red, 'right', 700, 2);
    if(P.combo >= 2) txt('COMBO x' + P.combo, 40, 108, 16, COL.gold, 'left', 700, 2);
    if(E.combo >= 2) txt('COMBO x' + E.combo, W-40, 108, 16, COL.red, 'right', 700, 2);
  }

  // 메인 화면의 버튼/계정 정보는 HTML(#menu)이 그린다. 배경 이미지가 없을 때만 제목을 직접 그린다
  if(game.state === 'title' && !BG.canvas) txt('BOXING', W/2, 110, 70, COL.fg, 'center', 200, 18);
  if(game.state === 'intro'){
    const s = game.introT < .9 ? (net.on ? 'READY' : 'STAGE ' + game.level) : 'FIGHT!';
    txt(s, W/2, 170, game.introT < .9 ? 54 : 74, game.introT < .9 ? COL.fg : COL.gold, 'center', 300, 12);
  }
  if(game.state === 'ko' && game.koT > .15){
    const u = Math.min(1, (game.koT-.15)/.2);
    txt('K.O.', W/2, 160, 110*(1.3 - .3*easeOut(u)), COL.fg, 'center', 800, 8);
    if(game.koT > 1.8 && net.on){
      const win = (net.role === 'guest' ? P : E).hp <= 0;       // 멀티플레이: 내 상대가 쓰러졌으면 승리
      txt(win ? '승리' : '패배', W/2, 245, 22, win ? COL.gold : COL.red, 'center', 600, 8);
      txt(net.vote.me ? '상대의 수락을 기다리는 중…' : net.vote.peer ? 'ENTER — 재대결 (상대가 기다리고 있어요)' : 'ENTER — 재대결', W/2, 280, 14, '#aab0c4', 'center', 500, 4);
      txt('C — 캐릭터 변경   ·   R — 랭킹   ·   ESC — 메인 화면', W/2, 306, 12, '#8d93a8', 'center', 500, 3);
      if(net.peer) txt('나 ' + CHARS[game.char].name + '   ·   상대 ' + CHARS[net.peer.ch].name, W/2, 332, 12, '#8d93a8', 'center', 500, 2);
    }
    else if(game.koT > 1.8){
      const win = E.hp <= 0;
      txt(win ? '승리' : '패배', W/2, 245, 22, win ? COL.gold : COL.red, 'center', 600, 8);
      let enterY = 280;
      if(win && game.saveError){            // 기록이 저장되지 않은 경우를 숨기지 않고 알린다
        txt(game.saveError === 'session' ? '기록 저장 실패 — 다시 로그인해 주세요' : '서버에 연결할 수 없어 기록을 저장하지 못했습니다 (다음 승리 때 함께 저장)', W/2, 276, 13, COL.red, 'center', 700, 1); enterY = 308;
      } else if(win && game.newBest){
        txt(game.rank ? `NEW BEST  STAGE ${game.level}   ·   랭킹 #${game.rank}` : `NEW BEST  STAGE ${game.level}`, W/2, 276, 15, COL.gold, 'center', 700, 2); enterY = 308;
      }
      txt(win ? 'ENTER — 다음 상대' : 'ENTER — 메인 화면으로', W/2, enterY, 14, '#aab0c4', 'center', 500, 4);
      if(win) txt('ESC — 메인 화면', W/2, enterY + 26, 12, '#8d93a8', 'center', 500, 3);
    }
  }
  if((game.state === 'fight' || game.state === 'intro') && game.escAt && performance.now() - game.escAt < 2000)
    txt('ESC 한 번 더 — 메인 화면으로 나가기', W/2, 150, 14, COL.gold, 'center', 700, 2);
  if(game.state !== 'auth' && game.state !== 'ranking' && game.state !== 'charsel' && game.state !== 'stagesel' && !titleArt) drawKeys();
}

/* ---------- 입력 / 루프 ---------- */
addEventListener('keydown', e => {
  if(e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  audio();
  if(game.state === 'auth') return;
  if(net.panel || net.sub) return;                       // 멀티플레이 창(또는 방 안의 캐릭터/랭킹 창)이 열려 있으면 메인 화면 단축키(Enter/R/ESC)를 막는다 (창의 키는 멀티플레이 모듈이 처리)
  if(game.state === 'charsel'){                         // 캐릭터 선택: ← → (또는 A D)로 고르고, Enter / ESC / Backspace 로 메인 화면 복귀. 게임 키는 모두 무시
    if(e.code === 'ArrowLeft' || e.code === 'KeyA'){ e.preventDefault(); pickChar(CHAR_KEYS[(CHAR_KEYS.indexOf(game.char) + 2) % 3]); }
    else if(e.code === 'ArrowRight' || e.code === 'KeyD'){ e.preventDefault(); pickChar(CHAR_KEYS[(CHAR_KEYS.indexOf(game.char) + 1) % 3]); }
    else if(e.code === 'Escape' || e.code === 'Enter' || e.code === 'Backspace'){ e.preventDefault(); closeChars(); }
    return;
  }
  if(game.state === 'stagesel'){                         // 스테이지 선택: Enter = 도전 가능한 가장 높은 스테이지 시작, ESC / Backspace = 메인 화면 복귀. 게임 키는 모두 무시
    if(e.code === 'Escape' || e.code === 'Backspace'){ e.preventDefault(); closeStages(); }
    else if(e.code === 'Enter' && !(e.target && e.target.tagName === 'BUTTON')){ e.preventDefault(); startStage((game.best || 0) + 1); }
    return;
  }
  if(game.state === 'ranking'){                          // 랭킹 화면: ESC / Enter / Backspace 로 메인 화면 복귀, 게임 키는 모두 무시
    if(e.code === 'Escape' || e.code === 'Enter' || e.code === 'Backspace'){ e.preventDefault(); closeRank(); }
    return;
  }
  // ESC = 메인 화면으로. 결과 화면(승리/패배)에서는 바로, 전투 중에는 실수로 나가지 않도록 2초 안에 한 번 더 눌러야 한다
  if(e.code === 'Escape' && (game.state === 'ko' || game.state === 'fight' || game.state === 'intro')){
    e.preventDefault();
    if(e.repeat) return;
    if(game.state === 'ko'){ toTitle(); return; }
    const now = performance.now();
    if(game.escAt && now - game.escAt < 2000){ game.escAt = 0; toTitle(); } else game.escAt = now;
    return;
  }
  if(e.code === 'KeyR' && game.state === 'title'){ openRank(); return; }
  if(e.code === 'Escape' && game.state === 'title'){ logout(); return; }
  if(['Space','ArrowLeft','ArrowRight','ArrowDown','ArrowUp'].includes(e.code)) e.preventDefault();
  if(e.repeat) return;
  keys[e.code] = true;
  if(game.state === 'fight'){
    if(ACTION_KEYS[e.code]) pushInput(ACTION_KEYS[e.code]);
    else if(GUARD_KEYS.includes(e.code)) pushInput('guard');
  }
  if(e.code === 'Enter'){
    if(game.state === 'title') start(1);
    else if(game.state === 'ko' && game.koT > 1.8){
      if(net.on) net.rematch();                        // 멀티플레이: 양쪽이 Enter를 누르면 재대결
      else if(E.hp <= 0) start(game.level + 1);
      else toTitle();                  // 패배하면 메인 화면으로 (PLAY로 STAGE 1부터 재도전)
    }
  }
});

/* ---------- 계정 (server.ps1 서버의 users.json에 저장 → 어떤 브라우저에서든 같은 계정) ---------- */
const $ = id => document.getElementById(id);
let authMode = 'login';
// 계정/랭킹 서버 주소. 순서: window.BOXING_API(시험용 덮어쓰기) → 파일로 직접 연 경우 내 PC 서버 → GitHub Pages 에서는 Cloudflare 서버 → 그 밖에는 같은 주소(server.ps1)
const API_CLOUD = 'https://boxing-api.boxing-api.workers.dev';                // Cloudflare Workers 계정/랭킹 서버 (worker/ 폴더)
const API = window.BOXING_API || (location.protocol === 'file:' ? 'http://localhost:8123' : /\.github\.io$/.test(location.hostname) && API_CLOUD ? API_CLOUD : '');
async function api(path, body){
  let res;
  try{
    res = await fetch(API + path, { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify(body) });
  }catch(e){ throw new Error('server'); }
  if(!res.ok) throw new Error('server');
  return res.json();
}
const ERR = {
  invalid_id: '아이디는 3~12자 (한글/영문/숫자/_)만 가능합니다',
  short_pw: '비밀번호는 4자 이상이어야 합니다',
  taken: '이미 사용 중인 아이디입니다',
  bad_credentials: '아이디 또는 비밀번호가 올바르지 않습니다',
  too_many: '시도가 너무 많습니다. 잠시 후 다시 해 주세요'
};

}

  game.char = CHARS[u.char] ? u.char : 'outfighter';      // 계정에 저장된 캐릭터 (없으면 아웃파이터)
  $('auth').classList.add('fade'); setTimeout(() => { if(game.user) $('auth').classList.add('hidden'); $('auth').classList.remove('fade'); }, 480);

  $('menuBest').textContent = 'BEST STAGE ' + (game.best || 0);

// 메인 화면의 내 순위 표시 (서버에서 가져온다. 실패해도 메인 화면은 그대로 쓸 수 있다)
async function refreshMenuRank(){
  const who = game.user;
  try{
    const r = await api('/api/ranking', { token: game.token, limit: 0 });
    if(game.state !== 'title' || game.user !== who || !r.me) return;       // 그 사이 화면/계정이 바뀌었으면 무시
    game.best = Math.max(game.best || 0, r.me.best);
    $('menuBest').textContent = 'BEST STAGE ' + r.me.best + (r.me.rank ? ' · RANK #' + r.me.rank + '/' + r.total : ' · UNRANKED');

/* ---------- 랭킹 화면 ---------- */
const RANK_POLL_MS = 3000;                              // 랭킹 화면이 열려 있는 동안 순위가 바뀌었는지 확인하는 간격 (서버 무료 한도를 아끼려고 3초)
const RANK = { open:false, timer:null, version:null, prev:new Map(), first:true, busy:false };
function setLive(on){
  const el = $('rankLive'); el.textContent = on ? 'LIVE' : 'OFFLINE'; el.classList.toggle('on', on);
}
function renderRank(r){
  const ol = $('rankList'), keep = ol.scrollTop, meKey = (game.user || '').toLowerCase(), next = new Map();
  ol.textContent = '';
  for(const it of r.list){
    const li = document.createElement('li'), sig = it.rank + '|' + it.best;
    next.set(it.id, sig);
    li.className = (it.rank <= 3 ? 'r' + it.rank : '') + (it.id.toLowerCase() === meKey ? ' me' : '');
    if(!RANK.first && RANK.prev.get(it.id) !== sig) li.classList.add('flash');   // 새로 들어왔거나 순위/기록이 바뀐 줄만 반짝
    const no = document.createElement('span'), nm = document.createElement('span'), st = document.createElement('span');
    no.className = 'no'; no.textContent = it.rank; nm.className = 'nm'; nm.textContent = it.id; st.className = 'st'; st.textContent = 'STAGE ' + it.best;
    li.append(no, nm, st); ol.append(li);
  }
  ol.scrollTop = keep;
  RANK.prev = next; RANK.first = false;
  const empty = $('rankEmpty'); empty.hidden = r.list.length > 0; ol.hidden = r.list.length === 0;
  if(!r.list.length) empty.innerHTML = '아직 랭킹에 오른 사람이 없습니다.<br>스테이지를 클리어하면 가장 먼저 이름을 올릴 수 있어요!';
  const me = r.me, mine = $('rankMine');
  mine.textContent = '';
  if(me && me.rank){
    const a = document.createElement('div'), b = document.createElement('b');
    b.textContent = me.id; a.append('내 순위  ', Object.assign(document.createElement('span'), { className:'gold', textContent:'#' + me.rank }), ' / ' + r.total + '명');
    const c = document.createElement('div'); c.textContent = 'BEST STAGE ' + me.best;
    mine.append(a, c);
  } else {
    mine.textContent = '아직 기록이 없어요. 스테이지 1을 클리어하면 등록됩니다.';
  }
}
async function pollRank(force){
  if(!RANK.open || RANK.busy || (document.hidden && !force)) return;
  RANK.busy = true;
  try{
    const r = await api('/api/ranking', { token: game.token, limit: 30, since: RANK.version });      // since: 이미 가진 버전 — 바뀐 게 없으면 서버가 목록을 다시 만들지 않고 same 만 답한다 (무료 서버 한도 절약)
    if(!RANK.open) return;                                  // 응답을 기다리는 사이 화면을 닫았다면 버린다
    setLive(true);
    if(r.same && RANK.version !== null) return;           // 순위가 바뀌지 않았다
    if(r.version !== RANK.version){
      const updated = RANK.version !== null;
      RANK.version = r.version; renderRank(r);
      if(updated){ const el = $('rankLive'); el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
    }
  }catch(e){
    if(!RANK.open) return;
    setLive(false);
    if(RANK.version === null){ $('rankEmpty').hidden = false; $('rankList').hidden = true; $('rankEmpty').textContent = '서버에 연결할 수 없습니다. 연결되면 자동으로 다시 불러옵니다.'; }
  }finally{ RANK.busy = false; }
}
function openRank(){

  RANK.open = true; RANK.version = null; RANK.first = true; RANK.prev = new Map();

}
