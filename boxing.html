/* ---------- 캐릭터 선택 창 ---------- */
// 능력치 막대는 실제 공격 데이터에서 계산한다: 공격력 = 세 기술 평균 대미지, 속도 = 한 번 치는 데 걸리는 평균 시간의 역수, 사정거리 = 평균 사정거리.
// 세 캐릭터 중 가장 큰 값을 5칸으로 놓고 나머지는 그 비율로 표시해서, 막대가 곧 밸런스 수치다.
function charStats(){
  const raw = {};
  for(const key of CHAR_KEYS){
    const a = ATTACK_SLOTS.map(s => CHARS[key].atk[s]);
    raw[key] = { pow: a.reduce((s, k) => s + k.dmg, 0)/3, spd: 3/a.reduce((s, k) => s + k.windup + k.active + k.recover, 0), rng: a.reduce((s, k) => s + k.reach, 0)/3 };
  }
  const mx = { pow:0, spd:0, rng:0 };
  for(const key of CHAR_KEYS) for(const s in mx) mx[s] = Math.max(mx[s], raw[key][s]);
  const out = {};
  for(const key of CHAR_KEYS) out[key] = { pow: raw[key].pow/mx.pow, spd: raw[key].spd/mx.spd, rng: raw[key].rng/mx.rng };
  return out;
}
const CHAR_DESC = {
  outfighter: ['긴 사정거리로 거리를 재며 싸운다', '회피 — 뒤로 물러난다'],
  infighter:  ['낮은 자세로 파고들어 짧고 강하게', '회피 — 앞으로 더킹하며 돌진'],
  slugger:    ['느리지만 한 방이 가장 강하다', '회피 — 제자리에서 숙이기만 한다']
};
function buildChars(){
  const st = charStats();
  document.querySelectorAll('#chars .card').forEach(card => {
    const key = card.dataset.ch, c = CHARS[key], s = st[key], bar = (cls, label, v) =>
      `<div class="stat ${cls}"><span>${label}</span><div class="bar"><i style="width:${Math.round(v*100)}%"></i></div></div>`;
    card.innerHTML =
      `<span class="badge">✓ 선택됨</span>` +
      `<div class="ct"><div class="nm">${c.name}</div><div class="tg">${c.tag}</div><div class="ds">${CHAR_DESC[key][0]}<br>${CHAR_DESC[key][1]}</div></div>` +
      `<div class="cb">${bar('p','공격력',s.pow)}${bar('s','속도',s.spd)}${bar('r','사정거리',s.rng)}` +
      `<div class="mv"><b>J</b> ${c.labels[0]} · <b>K</b> ${c.labels[1]} · <b>L</b> ${c.labels[2]}</div></div>`;
    card.onclick = () => { audio(); pickChar(key); };
  });
}
function refreshCards(){ document.querySelectorAll('#chars .card').forEach(c => c.classList.toggle('on', c.dataset.ch === game.char)); }
function pickChar(key){
  if(!CHARS[key] || game.char === key) return;
  game.char = key; refreshCards();
  if(game.token) api('/api/char', { token: game.token, char: key }).catch(() => {});     // 계정에 저장 (실패해도 이번 접속에서는 계속 사용)
}
function openChars(){
  if(game.state !== 'title') return;
  hideMenu(); game.state = 'charsel';
  PV = CHAR_KEYS.map((k, i) => mk([190, 480, 770][i], 1, true, 1, k));           // 세 캐릭터를 링 위에 나란히 세운다
  buildChars(); refreshCards();
  $('chars').classList.remove('hidden');
}
function stopChars(){ $('chars').classList.add('hidden'); PV = []; }
function closeChars(){ stopChars(); if(game.state === 'charsel') toTitle(); }
/* ---------- 스테이지 선택 창 ----------
   깬 스테이지(game.best)까지와 바로 다음 스테이지(best+1)의 버튼이 열려 있고, 그 뒤 몇 개는 잠긴 채 보인다. 열린 버튼을 누르면 그 스테이지부터 시작한다.
   기록(랭킹)은 예전과 똑같이 '지금까지의 최고 기록을 넘긴 스테이지'를 깼을 때만 올라간다. */
function buildStages(){
  const best = game.best || 0, next = best + 1, grid = $('stGrid');
  grid.textContent = '';
  for(let n = 1; n <= next + 4; n++){
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = n;
    b.className = 'stb ' + (n <= best ? 'clear' : n === next ? 'next' : 'lock');
    if(n <= next){ b.title = 'STAGE ' + n + ' 부터 시작'; b.addEventListener('click', () => { audio(); startStage(n); }); }
    else { b.disabled = true; b.title = '아직 열리지 않았습니다'; }
    grid.append(b);
  }
  $('stSub').textContent = best ? '클리어 ' + best + '  ·  도전 가능 ' + next : '아직 깬 스테이지가 없어요';
  $('stMine').textContent = '열린 스테이지를 눌러 그 스테이지부터 시작하세요. (Enter: 스테이지 ' + next + ')';
  const nb = grid.querySelector('.next'); if(nb) nb.scrollIntoView({ block:'center' });
}
function openStages(){
  if(game.state !== 'title') return;
  hideMenu(); game.state = 'stagesel'; P.x = 150; E.x = 810;       // 가운데 창이 두 캐릭터를 가리지 않도록 양옆으로 물러선다
  $('stages').classList.remove('hidden'); buildStages();
}
function stopStages(){ $('stages').classList.add('hidden'); }
function closeStages(){ stopStages(); if(game.state === 'stagesel') toTitle(); }
function startStage(n){
  if(game.state !== 'stagesel') return;
  n = Math.max(1, Math.min(n, (game.best || 0) + 1));              // 열려 있는 스테이지까지만
  stopStages(); start(n);
}
$('stageBtn').addEventListener('click', () => { audio(); openStages(); });
$('stBack').addEventListener('click', () => { audio(); closeStages(); });
$('charBtn').addEventListener('click', () => { audio(); openChars(); });
$('charsBack').addEventListener('click', () => { audio(); closeChars(); });
$('authForm').addEventListener('submit', async ev => {
  ev.preventDefault();
  try{
    const id = $('uid').value.trim(), pw = $('upw').value;
    if(!id) return authMsg('아이디를 입력해 주세요');
    if(authMode === 'signup'){
      if(!/^[A-Za-z0-9_가-힣]{3,12}$/.test(id)) return authMsg(ERR.invalid_id);
      if(pw.length < 4) return authMsg(ERR.short_pw);
      if(pw !== $('upw2').value) return authMsg('비밀번호 확인이 일치하지 않습니다');
    }
    const r = await api(authMode === 'signup' ? '/api/signup' : '/api/login', { id, pw });   // 중복 검사·비밀번호 확인은 서버가 처리
    if(!r.ok) return authMsg(ERR[r.error] || '요청이 거절되었습니다');
    enterGame(r);   // 가입 직후 바로 로그인
  }catch(err){
    authMsg(err && err.message === 'server'
      ? '서버에 연결할 수 없습니다. start-server.bat 을 실행한 뒤 다시 시도하세요'
      : '오류가 발생했습니다: ' + (err && err.message ? err.message : err));
  }
});
function logout(){
  stopRank(); stopChars(); stopStages(); game.user = null; game.token = null; game.char = 'outfighter'; game.state = 'auth'; hideMenu();
  $('auth').classList.remove('hidden', 'fade'); setMode('login'); $('uid').focus();
}
// 스테이지를 깨면 서버에 기록한다. 서버가 순위를 바로 다시 계산하므로, 랭킹 화면을 열어 둔 다른 사람 화면도 2초 안에 바뀐다
async function recordWin(){
  if(!game.token || game.level <= (game.best || 0)) return;
  game.newBest = true; game.rank = null; game.saveError = null;
  try{
    // game.best 는 서버가 확인해 준 기록만 담는다. 이전 스테이지 저장이 (서버 꺼짐 등으로) 실패했더라도,
    // 서버 규칙(한 번에 +1 스테이지씩만 인정)에 맞게 빠진 스테이지를 순서대로 채워서 보낸다.
    let last = null;
    for(let lv = (game.best || 0) + 1; lv <= game.level; lv++){
      last = await api('/api/best', { token: game.token, level: lv });
      if(!last.ok) break;
      game.best = last.best;
    }
    if(last && last.ok) game.rank = last.rank || null;
    else if(last && last.error === 'bad_token') game.saveError = 'session';   // 서버가 이 로그인을 모름 (예: sessions.json 삭제) → 다시 로그인 필요
    else game.newBest = false;                                                  // 서버가 거절한 기록은 신기록으로 표시하지 않는다
  }catch(e){ game.saveError = 'network'; }                                       // 서버에 닿지 못함 → 다음 승리 때 함께 저장된다
  if(game.state === 'title') refreshMenuRank();                                    // 저장이 끝나기 전에 ESC로 메인에 왔다면 내 순위 표시를 새로 고친다
}
setMode('login');
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for(const k in keys) keys[k] = false; });

P = mk(250, 1, true); E = mk(710, -1, false, 1);
let last = performance.now();
function frame(now){
  const dt = Math.min(.033, (now - last)/1000); last = now;
  step(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- 첫 로딩: 필요한 그림이 모두 불러와질 때까지 로딩 화면(#boot)으로 덮어 둔다 ----------
   배경 2장(메인/링) + 캐릭터 6장 + 글러브 2장. 느린 접속에서 뼈대 캐릭터나 빈 배경이 잠깐 보이지 않게 한다.
   그림 하나가 실패하거나 너무 오래 걸려도(BOOT_MAX_MS) 게임은 열린다 — 이때만 예전 도형 캐릭터로 대신 그린다. */
(function(){
  const BOOT_MAX_MS = 20000, t0 = performance.now(), boot = document.getElementById('boot');
  if(!boot) return;
  const bar = boot.querySelector('.bar i'), msg = boot.querySelector('.msg');
  const imgs = [];
  for(const k in SPR) for(const c of ['blue', 'red']) imgs.push(SPR[k].img[c]);
  for(const c of ['blue', 'red']) imgs.push(GLV.img[c]);
  const settled = i => i.complete;                                   // 불러왔거나(성공) 실패했거나
  const check = () => {
    const done = imgs.filter(settled).length + (TB.img ? 1 : 0) + (BG.canvas ? 1 : 0), total = imgs.length + 2;
    bar.style.width = Math.max(6, Math.round(100*done/total)) + '%';
    const late = performance.now() - t0 > BOOT_MAX_MS;
    if(done >= total || late){
      boot.classList.add('out'); setTimeout(() => boot.remove(), 600);
      if(late && done < total) console.warn('일부 그림을 불러오지 못했지만 게임을 엽니다 (' + done + '/' + total + ')');
      return;
    }
    if(performance.now() - t0 > 6000) msg.textContent = 'LOADING… (연결이 느립니다)';
    setTimeout(check, 60);
  };
  check();
})();
window.__boxingReady = true;

<script>
/* ============================================================================================
   멀티플레이 모듈 (위 게임 코드는 건드리지 않고, 필요한 함수만 감싸서 끼워 넣는다)
   - 방 만들기: 랜덤 6자리 코드 = 방 번호. 코드가 곧 PeerJS 접속 ID(fistbox-코드)라서 별도 서버 없이 방이 만들어진다.
   - 연결: PeerJS 클라우드가 두 PC의 "소개"만 해 주고(WebRTC), 그 뒤 게임 데이터는 두 PC가 직접 주고받는다. 어떤 네트워크든(집/학교/모바일) 코드만 있으면 접속된다.
   - 대전: 방장(HOST)이 전투를 계산하는 기준이다. 손님(GUEST)은 키 입력을 보내고, 방장이 보내 주는 화면 상태를 그대로 그린다. 방장=왼쪽(파랑), 손님=오른쪽(빨강).
   - 대전 기록은 랭킹에 반영되지 않는다.
   ============================================================================================ */
(function(){
'use strict';
const PEER_URLS = ['https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js', 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js'];
const ID_PREFIX = 'fistbox-';
const ACTS = ['jab', 'straight', 'uppercut', 'skill', 'dodge', 'guard'];
const FKEYS = ['x','vx','face','state','t','hp','lag','st','gd','gdBroken','gdT','cg','z','vz','squash','hitPow','hitKind','flash','counter','combo','comboT','stun','connected','sw','recoilV','dodgeInv','counterAtk','pivotCd'];
const rnd = v => typeof v === 'number' ? Math.round(v*100)/100 : v;
const cleanName = s => String(s == null ? '' : s).replace(/[^\w가-힣 ]/g, '').slice(0, 14) || 'PLAYER';

Object.assign(net, { link:null, peerObj:null, peer:null, ready:false, fx:[], rbuf:[], r:{ move:0, guard:0, at:0 }, rdt:1/60,
                     lastRx:0, ping:0, code:'', busy:false, sess:0, toastT:0, lastIn:'', lastInAt:0, isBC:false, disp:null });

/* ---------- 연결 도구 ---------- */
function loadPeer(){
  if(window.Peer) return Promise.resolve();
  return new Promise((res, rej) => {
    let i = 0;
    const next = () => {
      if(i >= PEER_URLS.length){ rej(new Error('load')); return; }
      const s = document.createElement('script'); let done = false;
      const fail = () => { if(done) return; done = true; s.remove(); next(); };
      s.src = PEER_URLS[i++]; s.onload = () => { if(done) return; done = true; window.Peer ? res() : next(); }; s.onerror = fail;
      setTimeout(fail, 10000); document.head.appendChild(s);
    };
    next();
  });
}
function wrapConn(conn){
  const l = { send(o){ try{ if(conn.open) conn.send(o); }catch(e){} }, close(){ try{ conn.close(); }catch(e){} },
              buffered(){ try{ return conn.dataChannel ? conn.dataChannel.bufferedAmount : 0; }catch(e){ return 0; } } };
  conn.on('data', d => { if(l.onmessage) l.onmessage(d); });
  conn.on('close', () => { if(l.onclose) l.onclose(); });
  conn.on('error', () => { if(l.onclose) l.onclose(); });
  return l;
}
// (개발/테스트용) 같은 브라우저의 두 창을 BroadcastChannel로 잇는다: window.__NET_LOCAL = true 일 때만 사용되고, 평소엔 PeerJS(인터넷)를 쓴다
function bcLink(ch, me, other){
  const l = { send(o){ try{ ch.postMessage({ to:other, from:me, d:o }); }catch(e){} }, close(){ try{ ch.postMessage({ to:other, from:me, d:{ k:'__close' } }); ch.close(); }catch(e){} }, buffered(){ return 0; } };
  ch.onmessage = ev => { const m = ev.data; if(!m || m.to !== me) return; if(m.d && m.d.k === '__close'){ if(l.onclose) l.onclose(); return; } if(l.onmessage) l.onmessage(m.d); };
  return l;
}

/* ---------- 화면(창) ---------- */
const $m = id => document.getElementById(id);
function setMsg(t, err){ const e = $m('mpMsg'); e.textContent = t || ''; e.className = 'status' + (err ? ' err' : ''); }
function toast(t){
  const e = $m('mpToast'); e.textContent = t; e.classList.add('on');
  clearTimeout(net.toastT); net.toastT = setTimeout(() => e.classList.remove('on'), 4500);
}
function showPanel(mode){
  $m('mp').classList.remove('hidden'); net.panel = true; hideMenu();
  $m('mpJoin').classList.toggle('hide', mode !== 'join'); $m('mpHost').classList.toggle('hide', mode !== 'host');
  $m('mpTtl').textContent = mode === 'host' ? 'CREATE ROOM' : 'MULTIPLAYER';
  $m('mpLive').textContent = ''; setMsg('');
}
function hidePanelUI(){ $m('mp').classList.add('hidden'); net.panel = false; }
function closePanel(){                                   // 창 닫기 = 아직 대전이 시작되지 않았다면 방/연결도 정리
  if(!net.on){ teardown(true); net.role = ''; }
  hidePanelUI();
  if(game.state === 'title') showMenu();
}
function openPanel(mode){
  if(game.state !== 'title' || net.on || net.panel) return;
  teardown(false); net.role = mode === 'host' ? 'host' : 'guest'; showPanel(mode);
  if(mode === 'host') hostRoom(); else { $m('mpCode').value = ''; setTimeout(() => $m('mpCode').focus(), 50); }
}

/* ---------- 연결 정리 ---------- */
function teardown(sendBye){
  const L = net.link, PR = net.peerObj;
  net.sess++;                                            // 진행 중이던 연결 시도의 늦은 콜백은 이 번호가 달라져서 무시된다
  net.link = null; net.peerObj = null; net.peer = null; net.ready = false; net.busy = false; net.code = '';
  net.rbuf.length = 0; net.fx.length = 0; net.vote.me = net.vote.peer = false;
  if(L){ if(sendBye) L.send({ k:'bye' }); L.onmessage = L.onclose = null; setTimeout(() => L.close(), 250); }
  if(PR){ PR.__bye = true; setTimeout(() => { try{ PR.destroy(); }catch(e){} }, 300); }   // __bye: 일부러 닫는 중 → 자동 재접속 금지 (방 코드가 서버에 남지 않게)
}
function leaveMatch(sendBye){
  net.on = false; net.role = '';
  teardown(sendBye);
}
// 상대가 나갔거나 연결이 끊김
function peerGone(msg){
  const inMatch = net.on;
  if(net.panel && !inMatch){ teardown(false); setMsg(msg, true); return; }
  leaveMatch(false);
  if(game.state !== 'title') toTitle();
  toast(msg);
}

/* ---------- 방 만들기 (방장) ---------- */
async function hostRoom(){
  if(net.busy) return; net.busy = true;
  const sess = net.sess, stale = () => sess !== net.sess;
  setMsg('방을 만드는 중…');
  try{
    if(window.__NET_LOCAL){ hostBC(); return; }
    await loadPeer();
  }catch(e){ if(stale()) return; net.busy = false; setMsg('연결 도구(PeerJS)를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.', true); return; }
  let tries = 0;
  const attempt = () => {
    if(stale() || !net.panel || net.role !== 'host') return;
    const code = String(100000 + Math.floor(Math.random()*900000));
    const p = new window.Peer(ID_PREFIX + code, { debug:0 });
    net.peerObj = p;
    p.on('open', () => {
      if(stale()){ p.__bye = true; try{ p.destroy(); }catch(e){} return; }
      net.code = code; net.busy = false; $m('mpShow').textContent = code; $m('mpLive').textContent = 'WAITING';
      setMsg('친구가 코드를 입력하기를 기다리는 중…');
    });
    p.on('connection', conn => {
      if(net.link){ try{ conn.on('open', () => { conn.send({ k:'full' }); setTimeout(() => conn.close(), 200); }); }catch(e){} return; }   // 이미 상대가 있으면 거절
      conn.on('open', () => { if(net.link || stale()){ return; } attach(wrapConn(conn)); });
    });
    // 중개 서버와 잠깐 끊겨도 방은 유지. 단, 우리가 방을 닫는 중이면(destroy가 먼저 이 이벤트를 부른다) 다시 붙지 않는다
    p.on('disconnected', () => { if(p.__bye || stale()) return; setTimeout(() => { if(!p.__bye && !stale() && !p.destroyed){ try{ p.reconnect(); }catch(e){} } }, 1000); });
    p.on('error', err => {
      if(stale()) return;
      if(err && err.type === 'unavailable-id' && tries++ < 6){ p.__bye = true; try{ p.destroy(); }catch(e){} attempt(); return; }   // 코드가 겹치면 새 코드로
      if(net.on) return;
      net.busy = false;
      setMsg(err && (err.type === 'network' || err.type === 'server-error' || err.type === 'socket-error' || err.type === 'socket-closed')
        ? '연결 중개 서버에 접속할 수 없습니다. 인터넷 연결을 확인해 주세요.' : '방을 만들지 못했습니다. 다시 시도해 주세요.', true);
    });
  };
  attempt();
}
function hostBC(){
  const code = String(100000 + Math.floor(Math.random()*900000));
  const ch = new BroadcastChannel(ID_PREFIX + code); net.code = code; net.isBC = true; net.busy = false;
  net.peerObj = { destroy(){ try{ ch.close(); }catch(e){} } };
  $m('mpShow').textContent = code; $m('mpLive').textContent = 'WAITING'; setMsg('친구가 코드를 입력하기를 기다리는 중…');
  ch.onmessage = ev => {
    const m = ev.data;
    if(!m || m.to !== 'H' || !m.d || m.d.k !== '__join' || net.link) return;
    ch.postMessage({ to:m.from, from:'H', d:{ k:'__ok' } });
    attach(bcLink(ch, 'H', m.from));
  };
}

/* ---------- 입장 (손님) ---------- */
async function joinRoom(){
  if(net.busy) return;
  const code = $m('mpCode').value.trim();
  if(!/^\d{6}$/.test(code)){ setMsg('방 코드는 숫자 6자리입니다.', true); return; }
  net.busy = true; setMsg('방을 찾는 중…'); $m('mpLive').textContent = '';
  const sess = net.sess, stale = () => sess !== net.sess;
  try{
    if(window.__NET_LOCAL){ joinBC(code); return; }
    await loadPeer();
  }catch(e){ if(stale()) return; net.busy = false; setMsg('연결 도구(PeerJS)를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.', true); return; }
  if(stale()) return;
  const p = new window.Peer({ debug:0 }); net.peerObj = p;
  let opened = false;
  const timer = setTimeout(() => { if(!opened && !stale()){ net.busy = false; teardown(false); setMsg('연결 시간이 초과되었습니다. 코드를 확인하고 다시 시도해 주세요.', true); } }, 18000);
  p.on('open', () => {
    if(stale()) return;
    const conn = p.connect(ID_PREFIX + code, { reliable:true, serialization:'json' });
    conn.on('open', () => { if(stale()){ try{ conn.close(); }catch(e){} return; } opened = true; clearTimeout(timer); net.busy = false; attach(wrapConn(conn)); });
    conn.on('error', () => { if(!opened && !stale()){ clearTimeout(timer); net.busy = false; teardown(false); setMsg('방에 연결하지 못했습니다.', true); } });
  });
  p.on('error', err => {
    if(opened || stale()) return;
    clearTimeout(timer); net.busy = false; teardown(false);
    setMsg(err && err.type === 'peer-unavailable' ? '해당 코드의 방을 찾을 수 없습니다. 코드를 다시 확인해 주세요.'
         : err && (err.type === 'network' || err.type === 'server-error' || err.type === 'socket-error') ? '연결 중개 서버에 접속할 수 없습니다. 인터넷 연결을 확인해 주세요.' : '방에 연결하지 못했습니다.', true);
  });
}
function joinBC(code){
  const ch = new BroadcastChannel(ID_PREFIX + code), me = 'G' + Math.random().toString(36).slice(2, 8); net.isBC = true;
  net.peerObj = { destroy(){ try{ ch.close(); }catch(e){} } };
  const timer = setTimeout(() => { if(net.busy){ net.busy = false; teardown(false); setMsg('해당 코드의 방을 찾을 수 없습니다. 코드를 다시 확인해 주세요.', true); } }, 2500);
  ch.onmessage = ev => {
    const m = ev.data;
    if(!m || m.to !== me || !m.d || m.d.k !== '__ok') return;
    clearTimeout(timer); net.busy = false; attach(bcLink(ch, me, m.from));
  };
  ch.postMessage({ to:'H', from:me, d:{ k:'__join' } });
}

/* ---------- 연결된 뒤: 인사 → (방장) 대전 시작 ---------- */
function attach(link){
  net.link = link; net.lastRx = performance.now(); net.ping = 0;
  link.onmessage = onMsg;
  link.onclose = () => peerGone('연결이 끊어졌습니다');
  link.send({ k:'hi', name:cleanName(game.user), ch:game.char, v:1 });
  $m('mpLive').textContent = 'CONNECTED'; setMsg('연결되었습니다! 잠시 후 시작합니다…');
}
function onMsg(m){
  if(!m || typeof m !== 'object') return;
  net.lastRx = performance.now();
  switch(m.k){
    case 'hi':
      net.peer = { name:cleanName(m.name), ch:CHARS[m.ch] ? m.ch : 'outfighter' };
      if(net.role === 'host' && !net.on) startMatch();
      break;
    case 'char': if(net.peer && CHARS[m.ch]) net.peer.ch = m.ch; break;                 // 상대가 방 안에서 캐릭터를 바꿈 → 다음 경기부터 반영
    case 'full': teardown(false); setMsg('이미 다른 사람이 들어와 있는 방입니다.', true); break;
    case 'start': if(net.role === 'guest') beginGuest(m); break;
    case 'snap': if(net.role === 'guest' && net.ready) applySnap(m); break;
    case 'in': if(net.role === 'host' && net.on) applyRemoteIn(m); break;
    case 'vote': if(net.on){ net.vote.peer = true; if(net.role === 'host' && net.vote.me) startMatch(); } break;
    case 'ping': if(net.link) net.link.send({ k:'pong', t:m.t }); break;
    case 'pong': net.ping = Math.round(performance.now() - m.t); break;
    case 'bye': peerGone('상대가 방을 나갔습니다'); break;
  }
}
function startMatch(){                                   // 방장: 새 경기 (첫 경기 / 재대결)
  net.vote.me = net.vote.peer = false;
  net.on = true; net.ready = true; net.role = 'host';
  closeSub(); hidePanelUI(); start(1);                              // 기존 시작 루틴(상태 초기화)을 쓰고, 파이터만 사람 둘로 바꾼다
  P = mk(310, 1, true, 1, game.char); E = mk(650, -1, false, 1, net.peer.ch); E.human = true; E.spd = 1;
  net.names = [cleanName(game.user), net.peer.name];
  net.fx.length = 0; net.rbuf.length = 0; net.r = { move:0, guard:0, at:performance.now() };
  net.link.send({ k:'start', hc:game.char, gc:net.peer.ch, hn:net.names[0], gn:net.names[1] });
  game.state = 'intro';
}
function beginGuest(m){                                  // 손님: 방장의 시작 신호를 받아 같은 파이터를 세운다
  net.vote.me = net.vote.peer = false;
  net.on = true; net.ready = true; net.role = 'guest';
  closeSub(); hidePanelUI(); start(1);
  P = mk(310, 1, true, 1, CHARS[m.hc] ? m.hc : 'outfighter'); E = mk(650, -1, false, 1, CHARS[m.gc] ? m.gc : 'outfighter'); E.human = true; E.spd = 1;
  net.names = [cleanName(m.hn), cleanName(m.gn)];
  game.state = 'intro'; net.lastInAt = 0; net.lastIn = '';
}
net.rematch = function(){                                // 결과 화면에서 Enter: 양쪽이 모두 누르면 재대결
  if(!net.on || net.vote.me) return;
  net.vote.me = true; net.link && net.link.send({ k:'vote' });
  if(net.role === 'host' && net.vote.peer) startMatch();
};

/* ---------- 방장: 손님 입력 받기 / 화면 상태 보내기 ---------- */
function applyRemoteIn(m){
  const r = net.r; r.at = performance.now();
  r.move = m.m > 0 ? 1 : m.m < 0 ? -1 : 0; r.guard = !!m.g;
  if(Array.isArray(m.a)) for(const a of m.a.slice(0, 4)){
    if(!ACTS.includes(a)) continue;
    net.rbuf = [{ a, age:0 }];                                                         // 입력 버퍼(1칸, 최신 입력으로 교체) — 방장 쪽 입력과 같은 규칙
  }
}
function takeRemote(f){
  if(!canAct(f) || !net.rbuf.length) return null;
  const i = net.rbuf.findIndex(b => !(f.atkCd[b.a] > 0));
  return i < 0 ? null : net.rbuf.splice(i, 1)[0].a;
}
function remoteCtl(f, dt){                               // 손님 파이터(E)를 조종: CPU 두뇌 대신 손님의 입력을 쓴다
  const r = net.r, c = f.ctrl;
  if(performance.now() - r.at > 700){ r.move = 0; r.guard = false; }               // 입력이 끊기면(탭 정지 등) 멈춰 세운다
  c.move = r.move; c.act = null;
  f.guardForce = Math.max(0, f.guardForce - dt);
  let a;
  while((a = takeRemote(f))){ if(a === 'guard') f.guardForce = .18; else { c.act = a; break; } }
  c.guard = !!r.guard || f.guardForce > 0;
  for(const b of net.rbuf) b.age += dt;
  net.rbuf = net.rbuf.filter(b => b.age < bufWindow(b.a) - 1e-6);
  if(f.state === 'hit' || f.state === 'ko') net.rbuf.length = 0;                   // 맞으면 저장된 입력은 비운다
}
function packF(f){
  const a = FKEYS.map(k => rnd(f[k]));
  a.push(f.atk ? f.atk.name : '', !!f.ctrl.guard, f.ctrl.move | 0);
  return a;
}
function sendSnap(){
  if(!net.link || net.link.buffered() > 200000) return;                              // 회선이 밀리면 이번 프레임은 건너뛴다
  const g = [game.state, rnd(game.introT), rnd(game.koT), rnd(game.flash), rnd(game.shake), rnd(game.slow), rnd(game.freeze), rnd(game.kick)];
  net.link.send({ k:'snap', g, p:packF(P), e:packF(E), x:net.fx });
  net.fx = [];
}

/* ---------- 손님: 화면 상태 받기 / 입력 보내기 ---------- */
function unpackF(f, a){
  for(let i = 0; i < FKEYS.length; i++) f[FKEYS[i]] = a[i];
  const n = FKEYS.length, nm = a[n];
  f.atk = nm ? (Object.values(f.chATK).find(k => k.name === nm) || null) : null;
  f.ctrl.guard = !!a[n+1]; f.ctrl.move = a[n+2] | 0;
}
const orig = { burst, dust, ring, addText, sfx, starsPush: stars.push };
function replay(e){
  switch(e[0]){
    case 'burst': orig.burst(...e.slice(1)); break;
    case 'dust': orig.dust(...e.slice(1)); break;
    case 'ring': orig.ring(...e.slice(1)); break;
    case 'text': orig.addText(...e.slice(1)); break;
    case 'sfx': orig.sfx(...e.slice(1)); break;
    case 'star': orig.starsPush.call(stars, e[1]); break;
  }
}
function applySnap(m){
  if(!m.g || !m.p || !m.e) return;
  const g = m.g;
  game.state = g[0]; game.introT = g[1]; game.koT = g[2]; game.flash = g[3]; game.shake = g[4]; game.slow = g[5]; game.freeze = g[6]; game.kick = g[7];
  unpackF(P, m.p); unpackF(E, m.e);
  if(Array.isArray(m.x)) for(const e of m.x) replay(e);
}
function guestStep(dt){                                  // 손님 쪽 한 프레임: 전투 계산은 하지 않고 입자/글자 같은 연출만 진행
  game.t += dt;
  game.shake *= Math.pow(.0008, dt); game.flash = Math.max(0, game.flash - dt); game.kick = Math.max(0, game.kick - dt*.35);
  if(game.freeze > 0){ game.freeze -= dt; return; }
  let ts = 1;
  if(game.slow > 0){ game.slow -= dt; ts = game.state === 'ko' ? .2 : .3; }
  dt *= ts;
  for(const p of parts){ p.life -= dt; p.vy += 1100*dt; p.x += p.vx*dt; p.y += p.vy*dt; }
  for(const r of rings) r.life -= dt;
  for(const s of stars) s.life -= dt;
  for(const t of texts){ t.life -= dt; t.y -= 38*dt; }
  for(let i = parts.length-1; i >= 0; i--) if(parts[i].life <= 0) parts.splice(i, 1);
  for(let i = rings.length-1; i >= 0; i--) if(rings[i].life <= 0) rings.splice(i, 1);
  for(let i = stars.length-1; i >= 0; i--) if(stars[i].life <= 0) stars.splice(i, 1);
  for(let i = texts.length-1; i >= 0; i--) if(texts[i].life <= 0) texts.splice(i, 1);
  P.bob += dt*5; E.bob += dt*5; P.t += dt; E.t += dt;
}
function sendIn(force){
  if(!net.link) return;
  const mv = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0), gd = GUARD_KEYS.some(k => keys[k]) ? 1 : 0, s = mv + ':' + gd, now = performance.now();
  if(!force && s === net.lastIn && now - net.lastInAt < 150) return;                 // 바뀐 때와 0.15초마다(끊김 감지용)만 보낸다
  net.lastIn = s; net.lastInAt = now; net.link.send({ k:'in', m:mv, g:gd });
}
addEventListener('keydown', e => {                       // 손님의 공격/회피/가드 입력은 눌린 순간 바로 방장에게 보낸다 (방장 쪽 버퍼가 처리)
  if(!net.on || net.role !== 'guest' || game.state !== 'fight' || e.repeat || net.panel) return;
  const a = ACTION_KEYS[e.code] || (GUARD_KEYS.includes(e.code) ? 'guard' : null);
  if(!a || !net.link) return;
  const mv = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0), gd = GUARD_KEYS.some(k => keys[k]) ? 1 : 0;
  net.lastIn = mv + ':' + gd; net.lastInAt = performance.now();
  net.link.send({ k:'in', m:mv, g:gd, a:[a] });
});

/* ---------- 방 안에서 캐릭터 변경 / 랭킹 보기 (결과 화면에서 C / R) ----------
   연결과 방은 그대로 두고, 기존 캐릭터 창(#chars)과 랭킹 창(#rank)을 그 위에 띄운다. 경기 상태(game.state)는 건드리지 않고,
   그리는 순간에만 메인 화면과 같은 장면(캐릭터 세 명 / 양옆에 선 두 명)으로 바꿔 보여 준다. */
function openSub(kind){
  if(!net.on || net.sub || net.panel || game.state !== 'ko' || game.koT < 1.8) return;
  net.sub = kind;
  if(kind === 'chars'){
    PV = CHAR_KEYS.map((k, i) => mk([190, 480, 770][i], 1, true, 1, k));
    buildChars(); refreshCards(); $m('chars').classList.remove('hidden');
  } else {
    net.disp = [mk(150, 1, true, 1, game.char), mk(810, -1, false, 1, net.peer ? net.peer.ch : 'outfighter')];
    RANK.open = true; RANK.version = null; RANK.first = true; RANK.prev = new Map();
    $m('rankList').textContent = ''; $m('rankList').hidden = true; $m('rankEmpty').hidden = false; $m('rankEmpty').textContent = '불러오는 중…'; $m('rankMine').textContent = '';
    setLive(false); $m('rankLive').textContent = 'CONNECTING'; $m('rank').classList.remove('hidden');
    pollRank(true); clearInterval(RANK.timer); RANK.timer = setInterval(() => pollRank(false), RANK_POLL_MS);
  }
}
function closeSub(){
  if(!net.sub) return;
  if(net.sub === 'chars') stopChars(); else stopRank();
  net.sub = ''; net.disp = null;
}
const _pickChar = pickChar;
pickChar = function(key){                                // 방 안에서 캐릭터를 바꾸면 상대에게도 알린다 (다음 경기부터 적용)
  const before = game.char; _pickChar(key);
  if(net.on && net.link && game.char !== before) net.link.send({ k:'char', ch:game.char });
};
$m('charsBack').addEventListener('click', closeSub);
$m('rankBack').addEventListener('click', closeSub);
addEventListener('keydown', e => {
  if(!net.on || net.panel || e.repeat) return;
  if(net.sub){
    if(e.code === 'Escape' || e.code === 'Enter' || e.code === 'NumpadEnter' || e.code === 'Backspace'){ e.preventDefault(); closeSub(); }
    else if(net.sub === 'chars' && (e.code === 'ArrowLeft' || e.code === 'KeyA')){ e.preventDefault(); pickChar(CHAR_KEYS[(CHAR_KEYS.indexOf(game.char) + 2) % 3]); }
    else if(net.sub === 'chars' && (e.code === 'ArrowRight' || e.code === 'KeyD')){ e.preventDefault(); pickChar(CHAR_KEYS[(CHAR_KEYS.indexOf(game.char) + 1) % 3]); }
    return;
  }
  if(game.state === 'ko' && game.koT >= 1.8){
    if(e.code === 'KeyC'){ e.preventDefault(); audio(); openSub('chars'); }
    else if(e.code === 'KeyR'){ e.preventDefault(); audio(); openSub('rank'); }
  }
});

/* ---------- 기존 함수 감싸기 ---------- */
const _step = step, _runAI = runAI, _toTitle = toTitle, _draw = draw, _recordWin = recordWin;
step = function(dt){
  if(net.sub){ for(const f of net.disp || []) f.bob += dt*5; for(const v of PV) v.bob += dt*5; }
  if(!net.on || !net.ready) return _step(dt);
  if(net.role === 'guest'){ guestStep(dt); sendIn(false); return; }
  net.rdt = dt; _step(dt); sendSnap();
};
runAI = function(f, o, dt){
  if(net.on && net.role === 'host' && f === E){ remoteCtl(E, net.rdt); return; }
  return _runAI(f, o, dt);
};
toTitle = function(){ closeSub(); if(net.on) leaveMatch(true); return _toTitle(); };         // ESC 등으로 메인으로 나가면 상대에게도 알리고 연결을 닫는다
recordWin = async function(){ if(net.on) return; return _recordWin(); };
draw = function(){
  if(net.on && net.sub){                                 // 캐릭터/랭킹 창이 떠 있는 동안: 메인 화면과 같은 장면으로 잠깐 바꿔서 그린다
    const rp = P, re = E, rs = game.state;
    if(net.sub === 'rank' && net.disp){ P = net.disp[0]; E = net.disp[1]; game.state = 'ranking'; } else game.state = 'charsel';
    try{ _draw(); } finally { P = rp; E = re; game.state = rs; }
    return;
  }
  _draw();
  if(net.on && net.ready){
    ctx.setTransform(1,0,0,1,0,0);
    txt((net.role === 'host' ? 'HOST' : 'GUEST') + (net.role === 'guest' ? '  ·  PING ' + net.ping + 'ms' : ''), W/2, 44, 11, COL.dim, 'center', 600, 3);
  }
};
// 방장은 화면에 보이는 모든 연출(입자/글자/소리)을 손님에게도 전달한다
[['burst', burst], ['dust', dust], ['ring', ring]].forEach(([n, fn]) => { window[n] = function(...a){ if(net.on && net.role === 'host') net.fx.push([n, ...a]); return fn.apply(this, a); }; });
addText = function(...a){ if(net.on && net.role === 'host') net.fx.push(['text', ...a]); return orig.addText.apply(this, a); };
sfx = function(...a){ if(net.on && net.role === 'host') net.fx.push(['sfx', ...a]); return orig.sfx.apply(this, a); };
stars.push = function(...a){ if(net.on && net.role === 'host' && a[0]) net.fx.push(['star', a[0]]); return orig.starsPush.apply(this, a); };

/* ---------- 연결 상태 점검 (핑 / 끊김 감지) ---------- */
setInterval(() => {
  if(!net.link) return;
  net.link.send({ k:'ping', t:performance.now() });
  if(performance.now() - net.lastRx > 8000) peerGone('상대와의 연결이 끊어졌습니다');
}, 1000);

/* ---------- 버튼 / 키 ---------- */
$m('hostBtn').addEventListener('click', () => { audio(); openPanel('host'); });
$m('joinBtn').addEventListener('click', () => { audio(); openPanel('join'); });
$m('mpBack').addEventListener('click', () => { audio(); closePanel(); });
$m('mpGo').addEventListener('click', () => { audio(); joinRoom(); });
$m('mpCode').addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6); });
$m('mpCopy').addEventListener('click', async () => {
  if(!net.code) return;
  try{ await navigator.clipboard.writeText(net.code); setMsg('코드를 복사했습니다: ' + net.code); }catch(e){ setMsg('코드: ' + net.code + ' (직접 알려 주세요)'); }
});
addEventListener('keydown', e => {
  if(!net.panel) return;
  if(e.code === 'Escape'){ e.preventDefault(); closePanel(); }
  else if((e.code === 'Enter' || e.code === 'NumpadEnter') && !$m('mpJoin').classList.contains('hide')){ e.preventDefault(); joinRoom(); }
});
})();
</script>
