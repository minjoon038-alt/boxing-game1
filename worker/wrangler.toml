name = "boxing-api"
main = "src/index.js"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "boxing"
database_id = "130aca5a-19e4-41d5-91c9-37d2d01080af"

# Multiplayer was removed (UPBOX is single-player). v1 created the matchmaking / room Durable Objects; v2 deletes them.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Lobby", "Room"]

[[migrations]]
tag = "v2"
deleted_classes = ["Lobby", "Room"]
